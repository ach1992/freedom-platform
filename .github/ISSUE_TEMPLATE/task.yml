name: Task Contract
description: Create a bounded engineering task with only the information needed to implement, verify, review, and continue it safely.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        Use this template only when a dedicated Task Contract materially improves implementation, review, coordination, recovery, or risk control. Bounded Low/Medium FAST-path work may use existing durable authority plus one self-contained PR when AGENTS.md permits it. Live task state belongs in GitHub. Keep this contract concise; add conditional risk detail only when it materially affects the work. Do not create per-task handoff, status, traceability, or evidence documents.

        Task sizing: choose the minimum meaningful reviewable slice before opening the Issue. Do not create one task merely per file, handler, seam, or mechanically similar sibling when accepted behavior, acceptance boundary, dependencies, ownership, risk, rollback/release boundary, and validation materially align and one cohesive change remains reviewable. Split work when those boundaries differ or combining it would create a mixed-purpose, unsafe, or hard-to-review change. Do not optimize for Issue/PR count in either direction.

        Execution continuity: once the parent objective is authorized and this task is READY, normal reversible implementation/validation/review-preparation continues without another Owner checkpoint. Approval requirements are action-scoped; a "before merge/release" gate does not pause coding, testing, PR maintenance, or dependency-safe follow-on work.

        Task lifecycle: this Issue owns the full meaningful outcome, not just the first PR. Keep it open across cohesive partial PRs while acceptance/dependency/risk/rollback/validation boundaries remain aligned. Partial PRs use Refs, not Closes. Use a Contract Revision for bounded in-outcome refinement; create a sibling Issue only when a material boundary actually changes or one contract would become unsafe/mixed-purpose/unreviewable.

  - type: textarea
    id: authority
    attributes:
      label: Parent / requirements
      description: Link the parent phase/issue and relevant requirement IDs or durable authority. Use "None" only when there is genuinely no parent/requirement.
      placeholder: "Parent: #8\nRequirements: PAY-001, SEC-002"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal / outcome
      description: State the observable result this task must produce and why it matters.
      placeholder: "Implement ... so that ..."
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / base rule
      description: List prerequisite Issues/PRs/decisions and the base-branch rule. Resolve the live SHA when work starts instead of preserving a stale SHA here.
      placeholder: "Depends on: none\nBranch from the current main head."
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define allowed behavior/surfaces and any adjacent outcome that must explicitly remain out of scope when misunderstanding is likely.
      placeholder: "In scope:\n- ...\n\nOut of scope (only when useful):\n- ..."
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List objective behavior or repository conditions that make the task complete.
      placeholder: "- [ ] ..."
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation strategy
      description: Define how correctness will be demonstrated before implementation starts. Name focused tests/checks and expected CI tier when relevant; do not require ceremonial tests.
      placeholder: "Focused validation: ...\nExpected validation profile/checks: APPLICATION; MariaDB/Redis + static"
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Change risk
      description: Classify the concrete change from blast radius, reversibility, data/security/privacy impact, external-effect uncertainty, compatibility and rollback; do not inherit a Phase risk label or mark High merely because a migration/provider/admin/queue surface is touched. High/Critical work still requires the applicable independent review and Owner gate; never downgrade to avoid them.
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Material constraints / impacts (optional)
      description: "Add only constraints that matter: protected/high-conflict areas, security/privacy, financial/provider effects, schema/migration, compatibility, runtime/operations, performance, or release impact. Leave empty when none apply."
      placeholder: "Example: Payments/Wallet are protected; no schema change; preserve provider idempotency."
    validations:
      required: false

  - type: dropdown
    id: state
    attributes:
      label: Initial state
      options:
        - DRAFT
        - BLOCKED
        - READY
    validations:
      required: true
