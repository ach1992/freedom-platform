name: Apply Trial Payload

on:
  push:
    branches:
      - work/phase-0.4-trial-policy
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-trial-payload
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'work/phase-0.4-trial-policy' || github.ref_name == 'work/phase-0.4-trial-policy'
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 15
    steps:
      - name: Check out trial branch
        uses: actions/checkout@v4
        with:
          ref: work/phase-0.4-trial-policy
          fetch-depth: 0

      - name: Verify and apply payload
        shell: bash
        run: |
          set -euo pipefail
          PHP_BIN=/www/server/php/84/bin/php
          test -x "$PHP_BIN"
          cat .github/trial-payload.part* | base64 -d > /tmp/trial-payload.tar.gz
          echo "835121024ed531e5f542c4c2012731e6191b052b6adad49c2601c37b12af038c  /tmp/trial-payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trial-payload.tar.gz -C .
          rm -f /tmp/trial-payload.tar.gz
          rm -f .github/trial-payload.b64 .github/trial-payload.part*
          rm -f .github/workflows/apply-trial-payload.yml
          find app/Modules/Catalog database/migrations tests -name '*.php' -print0 | xargs -0 -n1 "$PHP_BIN" -l >/dev/null

      - name: Commit applied trial boundary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(catalog): implement trial policy reservation boundary"
          git push origin HEAD:work/phase-0.4-trial-policy
