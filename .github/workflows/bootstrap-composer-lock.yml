name: Bootstrap Composer Lock

on:
  push:
    paths:
      - composer.json
      - .github/workflows/bootstrap-composer-lock.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Stop when the lockfile already exists
        id: lockfile
        shell: bash
        run: |
          if [[ -f composer.lock ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up PHP 8.4
        if: steps.lockfile.outputs.exists == 'false'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, openssl, pcntl, pdo_mysql, redis, sodium, tokenizer, xml
          coverage: none
          tools: composer:2.8.12
      - name: Resolve and validate locked dependencies
        if: steps.lockfile.outputs.exists == 'false'
        run: |
          set -euo pipefail
          composer update --no-interaction --prefer-dist --no-progress --no-plugins --no-scripts
          composer validate --strict --no-check-publish
      - name: Commit generated lockfile
        if: steps.lockfile.outputs.exists == 'false'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'build: lock Composer dependencies'
          git push
