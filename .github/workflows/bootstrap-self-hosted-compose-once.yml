name: Bootstrap Self-hosted Compose Once

on:
  pull_request:
    paths:
      - .github/workflows/bootstrap-self-hosted-compose-once.yml

permissions:
  contents: read

jobs:
  bootstrap:
    name: Install Docker Compose plugin
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 10
    steps:
      - name: Install Compose for runner user
        shell: bash
        run: |
          set -euo pipefail
          version="$(curl -fsSL https://api.github.com/repos/docker/compose/releases/latest | jq -r '.tag_name')"
          test -n "$version"
          test "$version" != null
          install_dir="$HOME/.docker/cli-plugins"
          mkdir -p "$install_dir"
          curl -fsSL \
            "https://github.com/docker/compose/releases/download/${version}/docker-compose-linux-x86_64" \
            -o "$install_dir/docker-compose"
          chmod 0755 "$install_dir/docker-compose"
          docker compose version
