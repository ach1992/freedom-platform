name: Cancel stale branch workflow backlog once

on:
  push:
    branches:
      - develop/v1.0.0-completion
    paths:
      - .github/workflows/cancel-stale-branch-runs-once.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: develop/v1.0.0-completion
    steps:
      - name: Cancel every other queued or running branch workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          current_run = int(os.environ['GITHUB_RUN_ID'])
          branch = os.environ['TARGET_BRANCH']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'freedom-platform-backlog-canceller',
          }

          def request(url: str, method: str = 'GET') -> dict:
              req = urllib.request.Request(url, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = response.read()
              return json.loads(payload) if payload else {}

          cancelled = set()
          for _ in range(40):
              pending = []
              for status in ('queued', 'in_progress'):
                  query = urllib.parse.urlencode({
                      'branch': branch,
                      'status': status,
                      'per_page': 100,
                      'page': 1,
                  })
                  listing = request(f'https://api.github.com/repos/{repository}/actions/runs?{query}')
                  for run in listing.get('workflow_runs', []):
                      run_id = int(run['id'])
                      if run_id != current_run and run_id not in cancelled:
                          pending.append(run_id)

              if not pending:
                  print(f'Backlog cleared; cancelled {len(cancelled)} workflow runs.')
                  break

              for run_id in pending:
                  try:
                      request(f'https://api.github.com/repos/{repository}/actions/runs/{run_id}/cancel', 'POST')
                      cancelled.add(run_id)
                      print(f'Cancelled {run_id}')
                  except urllib.error.HTTPError as error:
                      if error.code not in (409, 422):
                          raise
              time.sleep(2)
          else:
              raise SystemExit('Backlog did not clear within the bounded cancellation loop.')
          PY
