name: CI Repair Artifact

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-repair-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_DEBUG: "false"
  APP_TIMEZONE: UTC
  BUSINESS_TIMEZONE: Asia/Tehran
  APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  PHP_ROOT: /www/server/php/84
  COMPOSER_BIN: /usr/local/bin/composer

jobs:
  repair:
    name: Generate bounded repair artifact
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'develop/v1.0.0-completion') }}
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use runner PHP toolchain
        timeout-minutes: 2
        run: bash scripts/ci/bootstrap-self-hosted-toolchain.sh no-coverage

      - name: Generate and validate repair files
        run: bash scripts/ci/generate-ci-repair-artifact.sh

      - name: Upload repair artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-repair-${{ github.run_id }}
          path: build/maintenance
          if-no-files-found: error
          retention-days: 7
