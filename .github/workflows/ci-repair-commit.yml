name: Apply Bounded CI Repair

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-repair-commit-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_DEBUG: "false"
  APP_TIMEZONE: UTC
  BUSINESS_TIMEZONE: Asia/Tehran
  APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  PHP_ROOT: /www/server/php/84
  COMPOSER_BIN: /usr/local/bin/composer

jobs:
  repair:
    name: Validate and commit bounded repair
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'develop/v1.0.0-completion' }}
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 30
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Use runner PHP toolchain
        timeout-minutes: 2
        run: bash scripts/ci/bootstrap-self-hosted-toolchain.sh no-coverage

      - name: Generate and validate repair files
        run: bash scripts/ci/generate-ci-repair-artifact.sh

      - name: Commit exact repair set
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          repair_files=(
            composer.lock
            app/Modules/Panels/Application/Contracts/PanelCreateServiceRequest.php
            app/Modules/Panels/Application/Contracts/PanelCapabilities.php
            app/Modules/Panels/Application/Contracts/SensitiveDeliveryArtifacts.php
            app/Modules/Panels/Infrastructure/FakePanelAdapter.php
            database/migrations/2026_08_06_002200_create_trial_policy_foundation.php
          )

          git add -- "${repair_files[@]}"

          if git diff --cached --quiet; then
            echo 'The bounded repair is already applied.'
            exit 0
          fi

          unexpected="$(git diff --name-only --cached -- . ':!composer.lock' ':!app/Modules/Panels/Application/Contracts/PanelCreateServiceRequest.php' ':!app/Modules/Panels/Application/Contracts/PanelCapabilities.php' ':!app/Modules/Panels/Application/Contracts/SensitiveDeliveryArtifacts.php' ':!app/Modules/Panels/Infrastructure/FakePanelAdapter.php' ':!database/migrations/2026_08_06_002200_create_trial_policy_foundation.php')"
          test -z "$unexpected" || {
            echo 'Unexpected paths entered the repair commit:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          }

          git config user.name 'freedom-platform-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(ci): apply dependency and formatting repairs'
          git push origin "HEAD:$HEAD_BRANCH"
