name: CI

# Default-branch bootstrap control. The active integration branch owns the full
# Version 1 validation pipeline. Main uses only ephemeral GitHub-hosted CI.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-control:
    name: Default branch repository control
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, intl, json, mbstring, openssl, pcntl, pdo, pdo_mysql, redis, sodium, tokenizer, xml
          coverage: none
          tools: composer:2.10.2

      - name: Verify default-branch repository contract
        shell: bash
        run: |
          set -euo pipefail

          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 4) { fwrite(STDERR, "PHP 8.4 is required.\n"); exit(1); }'
          composer --version --no-ansi | grep -F 'Composer version 2.10.2 '

          test -s composer.lock
          test -s artisan
          docker compose -f docker-compose.ci.yml config --quiet
          composer validate --strict --no-check-publish
          bash scripts/ci/verify-planning.sh
