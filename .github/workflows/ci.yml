name: CI

# Default-branch bootstrap control. The active integration branch owns the full
# Version 1 validation pipeline; main must never fall back to GitHub-hosted runners.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-control:
    name: Default branch repository control
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true

      - name: Verify owner-controlled runner and repository contract
        shell: bash
        run: |
          set -euo pipefail

          php_bin=/www/server/php/84/bin/php
          composer_bin=/usr/local/bin/composer

          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test -x "$php_bin"
          test -f "$composer_bin"

          "$php_bin" -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 4) { fwrite(STDERR, "PHP 8.4 is required.\n"); exit(1); }'
          "$php_bin" "$composer_bin" --version --no-ansi

          test -s composer.lock
          test -s artisan
          docker compose -f docker-compose.ci.yml config --quiet
          "$php_bin" "$composer_bin" validate --strict --no-check-publish
          bash scripts/ci/verify-planning.sh
