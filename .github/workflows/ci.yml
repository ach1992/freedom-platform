name: CI

# Requirements: ARCH-001 ARCH-002 QUA-001 QUA-002 QUA-004 QUA-012 QUA-013

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_DEBUG: "false"
  APP_TIMEZONE: UTC
  BUSINESS_TIMEZONE: Asia/Tehran
  APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: "33067"
  DB_DATABASE: freedom_platform_ci
  DB_USERNAME: freedom_ci
  DB_PASSWORD: ci-only-database-password
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6380"
  REDIS_PASSWORD: ci-only-redis-password
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  CI_PHP_IMAGE: freedom-platform-ci-php:8.4

jobs:
  preflight:
    name: Repository preflight
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    outputs:
      application: ${{ steps.mode.outputs.application }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare self-hosted workspace
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.ci.yml down --volumes --remove-orphans >/dev/null 2>&1 || true
          docker version
          docker compose version

      - name: Determine phase mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence/preflight
          if [[ -f composer.json ]]; then
            echo 'application=true' >> "$GITHUB_OUTPUT"
            printf '%s\n' '# CI preflight' '' '- Mode: application' > build/evidence/preflight/summary.md
          else
            echo 'application=false' >> "$GITHUB_OUTPUT"
            printf '%s\n' '# CI preflight' '' '- Mode: planning' '- Application gates: not applicable (composer.json is not present)' > build/evidence/preflight/summary.md
          fi

      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail
          required_planning_files=(
            docs/00-execution-ledger.md
            docs/01-authoritative-requirements.md
            docs/02-requirement-traceability-matrix.md
            docs/03-risk-register.md
            docs/04-domain-glossary.md
            docs/05-architecture-overview.md
            docs/06-test-strategy.md
            docs/07-security-threat-model.md
            docs/08-data-classification.md
            docs/09-deployment-runbook.md
            docs/10-release-checklist.md
            docker-compose.ci.yml
          )
          for path in "${required_planning_files[@]}"; do
            test -s "$path" || { echo "Required planning artifact is missing or empty: $path" >&2; exit 1; }
          done
          docker compose -f docker-compose.ci.yml config --quiet
          if [[ -f composer.json ]]; then
            test -s composer.lock || { echo 'composer.lock is mandatory once composer.json exists.' >&2; exit 1; }
            test -s artisan || { echo 'artisan is mandatory once composer.json exists.' >&2; exit 1; }
            for script in ci:static ci:test ci:forbidden-patterns ci:architecture ci:licenses; do
              jq -e --arg script "$script" '.scripts[$script] | type == "string" or type == "array"' composer.json >/dev/null \
                || { echo "Missing mandatory Composer script: $script" >&2; exit 1; }
            done
          fi

      - name: Record runner facts
        shell: bash
        run: |
          set -euo pipefail
          {
            echo
            echo "- Git SHA: $GITHUB_SHA"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Runner: $RUNNER_OS/$RUNNER_ARCH"
            echo "- Runner name: $RUNNER_NAME"
            echo "- UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> build/evidence/preflight/summary.md

      - name: Verify planning traceability
        run: bash scripts/ci/verify-planning.sh

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preflight-evidence-${{ github.run_id }}
          path: |
            build/evidence/preflight
            build/evidence/planning
          if-no-files-found: error
          retention-days: 7

  static:
    name: PHP static quality
    needs: preflight
    if: needs.preflight.outputs.application == 'true'
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build cached PHP 8.4 CI image
        run: docker build --file docker/ci/php84.Dockerfile --tag "$CI_PHP_IMAGE" docker/ci
      - name: Install locked dependencies
        run: bash scripts/ci/run-php-container.sh composer install --no-interaction --prefer-dist --no-progress
      - name: Code style
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p build/evidence/static
          set +e
          bash scripts/ci/run-php-container.sh vendor/bin/pint --test --format=json 2>&1 | tee build/evidence/static/pint.json
          pint_status=${PIPESTATUS[0]}
          set -e
          if (( pint_status != 0 )); then
            bash scripts/ci/run-php-container.sh vendor/bin/pint >/dev/null
            git diff -- . ':(exclude)build' | tee build/evidence/static/pint.diff
            exit "$pint_status"
          fi
      - name: Static analysis and repository policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence/static
          bash scripts/ci/run-php-container.sh composer validate --strict --no-check-publish 2>&1 | tee build/evidence/static/composer-validate.log
          bash scripts/ci/run-php-container.sh vendor/bin/phpstan analyse --no-progress --error-format=table 2>&1 | tee build/evidence/static/phpstan.log
          bash scripts/ci/run-php-container.sh composer ci:forbidden-patterns 2>&1 | tee build/evidence/static/forbidden-patterns.log
          bash scripts/ci/run-php-container.sh composer ci:architecture 2>&1 | tee build/evidence/static/architecture.log
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-evidence-${{ github.run_id }}
          path: build/evidence/static
          if-no-files-found: error
          retention-days: 7

  integration:
    name: MariaDB and Redis tests
    needs: preflight
    if: needs.preflight.outputs.application == 'true'
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build cached PHP 8.4 CI image
        run: docker build --file docker/ci/php84.Dockerfile --tag "$CI_PHP_IMAGE" docker/ci
      - name: Start disposable dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.ci.yml down --volumes --remove-orphans >/dev/null 2>&1 || true
          docker compose -f docker-compose.ci.yml up -d --wait
      - name: Install locked dependencies
        run: bash scripts/ci/run-php-container.sh composer install --no-interaction --prefer-dist --no-progress
      - name: Run complete automated suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence/tests build/evidence/coverage build/evidence/services
          docker compose -f docker-compose.ci.yml ps > build/evidence/services/compose-ps.txt
          test -f .env || cp .env.example .env
          bash scripts/ci/run-php-container.sh php artisan config:clear --ansi
          COLUMNS=240 bash scripts/ci/run-php-container.sh php artisan test \
            --display-warnings \
            --fail-on-warning \
            --log-junit build/evidence/tests/junit.xml \
            --coverage-clover build/evidence/coverage/clover.xml \
            2>&1 | tee build/evidence/tests/test.log
          test -s build/evidence/tests/junit.xml
          test -s build/evidence/coverage/clover.xml
      - name: Capture dependency service logs
        if: always()
        run: |
          mkdir -p build/evidence/services
          docker compose -f docker-compose.ci.yml logs --no-color > build/evidence/services/compose.log 2>&1 || true
      - name: Stop disposable dependencies
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-evidence-${{ github.run_id }}
          path: |
            build/evidence/tests
            build/evidence/coverage
            build/evidence/services
          if-no-files-found: error
          retention-days: 7

  dependencies:
    name: Dependency and license policy
    needs: preflight
    if: needs.preflight.outputs.application == 'true'
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build cached PHP 8.4 CI image
        run: docker build --file docker/ci/php84.Dockerfile --tag "$CI_PHP_IMAGE" docker/ci
      - name: Install locked dependencies
        run: bash scripts/ci/run-php-container.sh composer install --no-interaction --prefer-dist --no-progress
      - name: Audit dependencies and licenses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence/dependencies
          bash scripts/ci/run-php-container.sh composer audit --locked --abandoned=fail --format=json > build/evidence/dependencies/audit.json
          bash scripts/ci/run-php-container.sh composer ci:licenses
          test -s build/evidence/dependencies/licenses.json
      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-evidence-${{ github.run_id }}
          path: build/evidence/dependencies
          if-no-files-found: error
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan Git history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
