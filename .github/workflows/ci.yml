name: CI

# Requirements: ARCH-001 ARCH-002 QUA-001 QUA-002 QUA-004 QUA-012 QUA-013

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:
    inputs:
      phpunit_filter:
        description: Optional PHPUnit --filter regexp for targeted MariaDB/Redis diagnosis.
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_DEBUG: "false"
  APP_TIMEZONE: UTC
  BUSINESS_TIMEZONE: Asia/Tehran
  APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: "33067"
  DB_DATABASE: freedom_platform_ci
  DB_USERNAME: freedom_ci
  DB_PASSWORD: ci-only-database-password
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: "6380"
  REDIS_PASSWORD: ci-only-redis-password
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis

jobs:
  preflight:
    name: Validation plan and repository control
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
      project_control: ${{ steps.plan.outputs.project_control }}
      planning: ${{ steps.plan.outputs.planning }}
      control_plane: ${{ steps.plan.outputs.control_plane }}
      unit: ${{ steps.plan.outputs.unit }}
      style: ${{ steps.plan.outputs.style }}
      static_analysis: ${{ steps.plan.outputs.static_analysis }}
      dependencies: ${{ steps.plan.outputs.dependencies }}
      integration: ${{ steps.plan.outputs.integration }}
      runtime: ${{ steps.plan.outputs.runtime }}
      operations: ${{ steps.plan.outputs.operations }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Reject stale pull request revision
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          current_head=$(git ls-remote --refs "$HEAD_REPO_URL" "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')
          current_base=$(git ls-remote origin "refs/heads/$BASE_REF" | awk 'NR == 1 {print $1}')
          test -n "$current_head" || { echo "Current PR head ref is unavailable: $HEAD_REF" >&2; exit 1; }
          test -n "$current_base" || { echo "Current PR base ref is unavailable: $BASE_REF" >&2; exit 1; }
          if [[ "$current_head" != "$EXPECTED_HEAD_SHA" || "$current_base" != "$EXPECTED_BASE_SHA" ]]; then
            echo 'Pull request revision drifted before validation started.' >&2
            echo "Expected head/base: $EXPECTED_HEAD_SHA / $EXPECTED_BASE_SHA" >&2
            echo "Current head/base: $current_head / $current_base" >&2
            exit 1
          fi

      - name: Determine validation plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence/preflight
          changed=build/evidence/preflight/changed-files.txt
          plan=build/evidence/preflight/validation-plan.txt
          : > "$changed"

          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' && "${{ github.base_ref }}" == 'main' ]]; then
            if git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
              git diff --name-only HEAD^1 HEAD | sort -u > "$changed"
            fi
          fi

          bash scripts/ci/classify-validation-plan.sh "$changed" > "$plan"

          profile=FULL
          project_control=true
          planning=true
          control_plane=true
          unit=true
          style=true
          static_analysis=true
          dependencies=true
          integration=true
          runtime=true
          operations=true

          while IFS='=' read -r key value; do
            case "$key" in
              profile|project_control|planning|control_plane|unit|style|static_analysis|dependencies|integration|runtime|operations)
                printf -v "$key" '%s' "$value"
                ;;
              *)
                echo "Validation classifier returned an unknown key: $key" >&2
                exit 1
                ;;
            esac
          done < "$plan"

          # Independent self-modifying-CI guard: these surfaces may not suppress their own control validation.
          if grep -Eq '^(\.github/workflows/ci\.yml|\.github/workflows/staging-readiness\.yml|scripts/ci/(classify-validation-plan|test-validation-plan|select-feature-integration-scope|test-feature-integration-scope|scan-git-secrets|test-secret-scan|verify-project-control|verify-readonly-staging-workflow)\.sh)$' "$changed"; then
            project_control=true
            control_plane=true
          fi

          for key in profile project_control planning control_plane unit style static_analysis dependencies integration runtime operations; do
            printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_OUTPUT"
          done

          {
            echo '# CI preflight'
            echo
            echo "- Profile: $profile"
            echo "- Project control: $project_control"
            echo "- Planning consistency: $planning"
            echo "- Control-plane validation: $control_plane"
            echo "- Unit tests: $unit"
            echo "- PHP style: $style"
            echo "- PHP/static architecture: $static_analysis"
            echo "- Dependency/license policy: $dependencies"
            echo "- MariaDB/Redis integration: $integration"
            echo "- Docker/runtime contract: $runtime"
            echo "- Operational syntax: $operations"
          } > build/evidence/preflight/summary.md

      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail
          required_repository_files=(
            composer.json
            composer.lock
            artisan
            docker-compose.ci.yml
            scripts/ci/classify-validation-plan.sh
            scripts/ci/test-validation-plan.sh
            scripts/ci/select-feature-integration-scope.sh
            scripts/ci/test-feature-integration-scope.sh
            scripts/ci/scan-git-secrets.sh
            scripts/ci/test-secret-scan.sh
            scripts/ci/verify-readonly-staging-workflow.sh
            scripts/ci/verify-planning.sh
            scripts/ci/verify-project-control.sh
          )
          for path in "${required_repository_files[@]}"; do
            test -s "$path" || { echo "Required repository control file is missing or empty: $path" >&2; exit 1; }
          done

          for script in scripts/ci/classify-validation-plan.sh scripts/ci/test-validation-plan.sh scripts/ci/select-feature-integration-scope.sh scripts/ci/test-feature-integration-scope.sh scripts/ci/scan-git-secrets.sh scripts/ci/test-secret-scan.sh scripts/ci/verify-readonly-staging-workflow.sh scripts/ci/verify-planning.sh scripts/ci/verify-project-control.sh; do
            bash -n "$script"
          done

          for script in ci:static ci:forbidden-patterns ci:architecture ci:licenses; do
            jq -e --arg script "$script" '.scripts[$script] | type == "string" or type == "array"' composer.json >/dev/null \
              || { echo "Missing mandatory Composer script: $script" >&2; exit 1; }
          done

          while IFS= read -r changed_path; do
            [[ -e "$changed_path" ]] || continue
            case "$changed_path" in
              scripts/ci/*.sh) bash -n "$changed_path" ;;
              *) : ;;
            esac
          done < build/evidence/preflight/changed-files.txt

      - name: Validate Docker runtime contract
        if: ${{ steps.plan.outputs.runtime == 'true' }}
        run: docker compose -f docker-compose.ci.yml config --quiet

      - name: Record runner facts
        shell: bash
        run: |
          set -euo pipefail
          {
            echo
            echo "- Git SHA: $GITHUB_SHA"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Runner: $RUNNER_OS/$RUNNER_ARCH"
            echo "- UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> build/evidence/preflight/summary.md

      - name: Verify planning consistency
        if: ${{ steps.plan.outputs.planning == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          bash scripts/ci/verify-planning.sh 2>&1 | tee build/evidence/preflight/planning.log

      - name: Verify project and control-plane contract
        if: ${{ steps.plan.outputs.project_control == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          bash scripts/ci/verify-project-control.sh 2>&1 | tee build/evidence/preflight/project-control.log

      - name: Verify changed CI/read-only control mechanisms
        if: ${{ steps.plan.outputs.control_plane == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          changed=build/evidence/preflight/changed-files.txt
          if [[ ! -s "$changed" ]] || grep -Eq '^(\.github/workflows/(ci|staging-readiness)\.yml|scripts/ci/(classify-validation-plan|test-validation-plan|select-feature-integration-scope|test-feature-integration-scope|select-feature-shard|test-feature-sharding|scan-git-secrets|test-secret-scan|verify-project-control|verify-readonly-staging-workflow)\.sh)$' "$changed"; then
            bash scripts/ci/test-validation-plan.sh
            bash scripts/ci/test-feature-integration-scope.sh
            bash scripts/ci/test-feature-sharding.sh
            bash scripts/ci/test-secret-scan.sh
            bash scripts/ci/verify-readonly-staging-workflow.sh
          fi

      - name: Upload diagnostic preflight evidence
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-evidence-${{ github.run_id }}
          path: |
            build/evidence/preflight
            build/evidence/planning
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: PHP quality and unit tests
    needs: preflight
    if: ${{ needs.preflight.outputs.unit == 'true' || needs.preflight.outputs.static_analysis == 'true' || (needs.preflight.outputs.style == 'true' && needs.preflight.outputs.integration != 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, hash, intl, json, libxml, mbstring, openssl, pcntl, pdo, pdo_mysql, redis, session, sodium, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:2.10.2

      - name: Validate CI PHP toolchain
        timeout-minutes: 2
        run: bash scripts/ci/bootstrap-ci-toolchain.sh no-coverage

      - name: Install locked dependencies
        timeout-minutes: 10
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          php artisan package:discover --ansi

      - name: Unit tests
        if: ${{ needs.preflight.outputs.unit == 'true' }}
        run: composer test:quick

      - name: Code style
        if: ${{ needs.preflight.outputs.style == 'true' }}
        shell: bash
        env:
          VALIDATION_PROFILE: ${{ needs.preflight.outputs.profile }}
        run: |
          set -euo pipefail
          mkdir -p build/evidence/static

          pint_args=(--test --format=json)
          repair_args=()
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' && "$VALIDATION_PROFILE" != 'FULL' ]] && git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            if ! git diff --name-only HEAD^1 HEAD | grep -Eq '^(\.editorconfig|pint\.json)$'; then
              pint_args+=(--diff=HEAD^1)
              repair_args+=(--diff=HEAD^1)
            fi
          fi

          if php vendor/bin/pint "${pint_args[@]}" 2>&1 | tee build/evidence/static/pint.json; then
            exit 0
          fi
          php vendor/bin/pint "${repair_args[@]}"
          git diff -- . | tee build/evidence/static/pint.diff
          exit 1

      - name: Static and architecture policy
        if: ${{ needs.preflight.outputs.static_analysis == 'true' }}
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence/static
          php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress --error-format=table --memory-limit=1G 2>&1 | tee build/evidence/static/phpstan.log
          bash scripts/ci/forbidden-patterns.sh 2>&1 | tee build/evidence/static/forbidden-patterns.log
          bash scripts/ci/architecture.sh 2>&1 | tee build/evidence/static/architecture.log

      - name: Upload diagnostic quality evidence
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.run_id }}
          path: build/evidence/static
          if-no-files-found: warn
          retention-days: 14

  dependencies:
    name: Dependency and license policy
    needs: preflight
    if: ${{ needs.preflight.outputs.dependencies == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, hash, intl, json, libxml, mbstring, openssl, pcntl, pdo, pdo_mysql, redis, session, sodium, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:2.10.2

      - name: Validate CI PHP toolchain
        timeout-minutes: 2
        run: bash scripts/ci/bootstrap-ci-toolchain.sh no-coverage

      - name: Install locked dependencies
        timeout-minutes: 10
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Validate dependency contract
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence/dependencies
          composer validate --strict --no-check-publish 2>&1 | tee build/evidence/dependencies/composer-validate.log
          composer audit --locked --abandoned=fail --format=json > build/evidence/dependencies/audit.json
          bash scripts/ci/licenses.sh
          test -s build/evidence/dependencies/licenses.json

      - name: Upload diagnostic dependency evidence
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-evidence-${{ github.run_id }}
          path: build/evidence/dependencies
          if-no-files-found: warn
          retention-days: 14

  integration_shards:
    name: MariaDB 10.11 and Redis shard ${{ matrix.shard_index }}
    needs: preflight
    if: ${{ needs.preflight.outputs.integration == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3]
    env:
      MARIADB_VERSION: '10.11'
      COMPOSE_PROJECT_NAME: freedom-platform-ci-${{ github.run_id }}-${{ matrix.shard_index }}
      PHPUNIT_FILTER: ${{ inputs.phpunit_filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Plan integration execution
        id: integration_plan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence/tests
          plan=build/evidence/tests/integration-plan.txt
          : > "$plan"

          integration_scope=FULL
          shard_count=1
          run=true
          shard_index=${{ matrix.shard_index }}

          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]] && git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            bash scripts/ci/select-feature-integration-scope.sh HEAD^1 HEAD > "$plan"
            integration_scope=$(awk -F= '$1 == "scope" { print $2; exit }' "$plan")
            case "$integration_scope" in
              FULL)
                shard_count=4
                ;;
              TARGETED)
                ((shard_index == 0)) || run=false
                ;;
              *)
                echo "Invalid pull-request integration scope: $integration_scope" >&2
                exit 1
                ;;
            esac
          elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && -n "$PHPUNIT_FILTER" ]]; then
            integration_scope=DIAGNOSTIC
            printf '%s\n' 'scope=DIAGNOSTIC' > "$plan"
            ((shard_index == 0)) || run=false
          elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            integration_scope=FULL
            printf '%s\n' 'scope=FULL' > "$plan"
            ((shard_index == 0)) || run=false
          else
            printf '%s\n' 'scope=FULL' > "$plan"
            ((shard_index == 0)) || run=false
          fi

          {
            echo "scope=$integration_scope"
            echo "shard_count=$shard_count"
            echo "run=$run"
          } >> "$GITHUB_OUTPUT"

      - name: Set up PHP 8.4
        if: ${{ steps.integration_plan.outputs.run == 'true' }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, hash, intl, json, libxml, mbstring, openssl, pcntl, pdo, pdo_mysql, redis, session, sodium, tokenizer, xml, xmlwriter
          coverage: ${{ github.event_name == 'workflow_dispatch' && inputs.phpunit_filter == '' && 'pcov' || 'none' }}
          tools: composer:2.10.2

      - name: Validate CI PHP toolchain
        if: ${{ steps.integration_plan.outputs.run == 'true' }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mode=no-coverage
          [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && -z "$PHPUNIT_FILTER" ]] && mode=coverage
          bash scripts/ci/bootstrap-ci-toolchain.sh "$mode"

      - name: Install locked dependencies
        if: ${{ steps.integration_plan.outputs.run == 'true' }}
        timeout-minutes: 10
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          php artisan package:discover --ansi

      - name: Code style for integration-only PHP changes
        if: ${{ steps.integration_plan.outputs.run == 'true' && matrix.shard_index == 0 && needs.preflight.outputs.style == 'true' && needs.preflight.outputs.static_analysis != 'true' }}
        shell: bash
        env:
          VALIDATION_PROFILE: ${{ needs.preflight.outputs.profile }}
        run: |
          set -euo pipefail
          pint_args=(--test)
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' && "$VALIDATION_PROFILE" != 'FULL' ]] && git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            if ! git diff --name-only HEAD^1 HEAD | grep -Eq '^(\.editorconfig|pint\.json)$'; then
              pint_args+=(--diff=HEAD^1)
            fi
          fi
          php vendor/bin/pint "${pint_args[@]}"

      - name: Start disposable dependencies
        if: ${{ steps.integration_plan.outputs.run == 'true' }}
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          export MARIADB_HOST_PORT=0
          export REDIS_HOST_PORT=0
          docker compose -f docker-compose.ci.yml up -d --wait
          mariadb_port=$(docker compose -f docker-compose.ci.yml port mariadb 3306 | sed -E 's/.*:([0-9]+)$/\1/')
          redis_port=$(docker compose -f docker-compose.ci.yml port redis 6379 | sed -E 's/.*:([0-9]+)$/\1/')
          [[ "$mariadb_port" =~ ^[0-9]{2,5}$ ]]
          [[ "$redis_port" =~ ^[0-9]{2,5}$ ]]
          printf 'DB_PORT=%s\nREDIS_PORT=%s\n' "$mariadb_port" "$redis_port" >> "$GITHUB_ENV"

      - name: Run planned PHPUnit suite
        if: ${{ steps.integration_plan.outputs.run == 'true' }}
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence/tests build/evidence/coverage build/evidence/services
          docker compose -f docker-compose.ci.yml ps > build/evidence/services/compose-ps.txt
          test -f .env || cp .env.example .env
          php artisan config:clear --ansi

          integration_scope=${{ steps.integration_plan.outputs.scope }}
          shard_count=${{ steps.integration_plan.outputs.shard_count }}
          shard_index=${{ matrix.shard_index }}
          targeted_tests=()

          while IFS='=' read -r key value; do
            case "$key" in
              scope)
                ;;
              target)
                [[ -n "$value" ]] || { echo 'Focused integration selector returned an empty target.' >&2; exit 1; }
                targeted_tests+=("$value")
                ;;
              '')
                ;;
              *)
                echo "Focused integration selector returned an unknown key: $key" >&2
                exit 1
                ;;
            esac
          done < build/evidence/tests/integration-plan.txt

          case "$integration_scope" in
            FULL|DIAGNOSTIC)
              ;;
            TARGETED)
              ((${#targeted_tests[@]} > 0)) || { echo 'TARGETED integration scope requires at least one Feature test.' >&2; exit 1; }
              ;;
            *)
              echo "Invalid integration scope: $integration_scope" >&2
              exit 1
              ;;
          esac

          {
            echo "scope=$integration_scope"
            echo "shard_index=$shard_index"
            echo "shard_count=$shard_count"
            printf 'target=%s\n' "${targeted_tests[@]}"
          } > build/evidence/tests/integration-scope.txt

          phpunit_args=(
            --configuration phpunit.xml
            --display-warnings
            --fail-on-warning
            --log-junit build/evidence/tests/junit.xml
          )

          if [[ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ]]; then
            phpunit_args+=(--stop-on-error --stop-on-failure)
            if [[ "$integration_scope" == 'TARGETED' ]]; then
              phpunit_args+=("${targeted_tests[@]}")
            elif [[ "$integration_scope" == 'FULL' && "$shard_count" -gt 1 ]]; then
              mapfile -t shard_tests < <(bash scripts/ci/select-feature-shard.sh "$shard_count" "$shard_index")
              ((${#shard_tests[@]} > 0)) || { echo "Feature shard $shard_index/$shard_count is empty." >&2; exit 1; }
              phpunit_args+=("${shard_tests[@]}")
            else
              phpunit_args+=(--testsuite Feature)
            fi
          fi

          if [[ -n "$PHPUNIT_FILTER" ]]; then
            phpunit_args+=(--filter "$PHPUNIT_FILTER" --stop-on-error --stop-on-failure)
          elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            phpunit_args+=(--coverage-clover build/evidence/coverage/clover.xml)
          fi

          COLUMNS=240 php vendor/bin/phpunit "${phpunit_args[@]}" 2>&1 | tee build/evidence/tests/test.log
          test -s build/evidence/tests/junit.xml
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && -z "$PHPUNIT_FILTER" ]]; then
            test -s build/evidence/coverage/clover.xml
          fi

      - name: Summarize slow tests
        if: ${{ steps.integration_plan.outputs.run == 'true' && success() }}
        shell: bash
        run: |
          php <<'PHP'
          <?php
          $path = 'build/evidence/tests/junit.xml';
          if (! is_file($path)) {
              exit(0);
          }
          libxml_use_internal_errors(true);
          $xml = simplexml_load_file($path);
          if ($xml === false) {
              fwrite(STDERR, "Unable to parse PHPUnit JUnit timing data; continuing without a timing summary.\n");
              exit(0);
          }
          $rows = [];
          foreach ($xml->xpath('//testcase') ?: [] as $case) {
              $seconds = (float) $case['time'];
              $class = (string) $case['class'];
              if ($class === '') {
                  $class = (string) $case['classname'];
              }
              $name = (string) $case['name'];
              $label = trim($class.'::'.$name, ':');
              $label = preg_replace('/\s+/', ' ', $label) ?: $label;
              $rows[] = [$seconds, $label];
          }
          usort($rows, static fn (array $a, array $b): int => $b[0] <=> $a[0]);
          $summary = getenv('GITHUB_STEP_SUMMARY');
          if (! is_string($summary) || $summary === '') {
              exit(0);
          }
          $lines = ['## Slowest PHPUnit test cases', '', '```text'];
          foreach (array_slice($rows, 0, 20) as [$seconds, $label]) {
              $lines[] = sprintf('%8.3fs  %s', $seconds, $label);
          }
          $lines[] = '```';
          file_put_contents($summary, implode(PHP_EOL, $lines).PHP_EOL, FILE_APPEND);
          PHP

      - name: Capture dependency service logs
        if: ${{ steps.integration_plan.outputs.run == 'true' && (failure() || github.event_name == 'workflow_dispatch') }}
        run: |
          mkdir -p build/evidence/services
          docker compose -f docker-compose.ci.yml logs --no-color > build/evidence/services/compose.log 2>&1 || true

      - name: Stop disposable dependencies
        if: ${{ always() && steps.integration_plan.outputs.run == 'true' }}
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans

      - name: Upload diagnostic test evidence
        if: ${{ steps.integration_plan.outputs.run == 'true' && (failure() || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-evidence-${{ github.run_id }}-mariadb-10-11-shard-${{ matrix.shard_index }}
          path: |
            build/evidence/tests
            build/evidence/coverage
            build/evidence/services
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: MariaDB 10.11 and Redis tests
    needs:
      - preflight
      - integration_shards
    if: ${{ always() && needs.preflight.outputs.integration == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every planned integration shard
        shell: bash
        env:
          SHARD_RESULT: ${{ needs.integration_shards.result }}
        run: |
          set -euo pipefail
          [[ "$SHARD_RESULT" == 'success' ]] || {
            echo "Integration shards must all succeed; observed aggregate result: ${SHARD_RESULT:-missing}" >&2
            exit 1
          }

  operations:
    name: Operational syntax and entrypoints
    needs: preflight
    if: ${{ needs.preflight.outputs.operations == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, filter, gd, hash, intl, json, libxml, mbstring, openssl, pcntl, pdo, pdo_mysql, redis, session, sodium, tokenizer, xml, xmlwriter
          coverage: none
          tools: composer:2.10.2

      - name: Validate affected operational entrypoints
        shell: bash
        run: |
          set -euo pipefail
          files=$(mktemp)
          trap 'rm -f "$files"' EXIT

          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' && "${{ github.base_ref }}" == 'main' ]] && git rev-parse --verify HEAD^1 >/dev/null 2>&1; then
            git diff --name-only HEAD^1 HEAD | grep -E '^(deploy/|scripts/ci/(PasarGuardLiveAcceptance\.php|pasarguard-live-acceptance\.php|pasarguard-readonly-probe\.php)$)' > "$files" || true
          else
            find deploy -type f -print > "$files"
            printf '%s\n' scripts/ci/PasarGuardLiveAcceptance.php scripts/ci/pasarguard-live-acceptance.php scripts/ci/pasarguard-readonly-probe.php >> "$files"
          fi

          while IFS= read -r file; do
            [[ -f "$file" ]] || continue
            case "$file" in
              *.sh)
                bash -n "$file"
                ;;
              *.php)
                php -l "$file" >/dev/null
                ;;
              *.conf)
                awk '
                  /^[[:space:]]*($|;|#)/ { next }
                  /^\[[^][]+\]$/ { next }
                  /^[A-Za-z0-9_.-]+=.*/ { next }
                  { print "Invalid supervisor-style config line " NR ": " $0 > "/dev/stderr"; exit 1 }
                ' "$file"
                ;;
              *.cron)
                awk '
                  /^[[:space:]]*($|#)/ { next }
                  NF >= 6 { next }
                  { print "Invalid cron entry line " NR ": " $0 > "/dev/stderr"; exit 1 }
                ' "$file"
                ;;
              *)
                echo "No operational validator exists for changed file: $file" >&2
                exit 1
                ;;
            esac
          done < "$files"

  secrets:
    name: Secret scan
    # A filtered workflow_dispatch is diagnostic-only; every pull-request run scans the exact event base-to-head history.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'workflow_dispatch' && inputs.phpunit_filter != '') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install checksum-pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: '8.24.3'
          GITLEAKS_SHA256: '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c'
        run: |
          set -euo pipefail
          [[ "$RUNNER_OS" == 'Linux' && "$RUNNER_ARCH" == 'X64' ]] || {
            echo "Unsupported runner for pinned Gitleaks binary: $RUNNER_OS/$RUNNER_ARCH" >&2
            exit 1
          }

          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-${GITLEAKS_VERSION}"
          rm -rf "$install_dir"
          mkdir -p "$install_dir"

          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$install_dir" gitleaks
          test -x "$install_dir/gitleaks"
          "$install_dir/gitleaks" version
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Scan exact Git history
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url }}
        run: bash scripts/ci/scan-git-secrets.sh

  required:
    name: Repository preflight
    needs:
      - preflight
      - quality
      - dependencies
      - integration
      - operations
      - secrets
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && !(github.event_name == 'workflow_dispatch' && inputs.phpunit_filter != '') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce applicable validation and final freshness
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          OPERATIONS_RESULT: ${{ needs.operations.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          UNIT_REQUIRED: ${{ needs.preflight.outputs.unit }}
          STYLE_REQUIRED: ${{ needs.preflight.outputs.style }}
          STATIC_REQUIRED: ${{ needs.preflight.outputs.static_analysis }}
          DEPENDENCIES_REQUIRED: ${{ needs.preflight.outputs.dependencies }}
          INTEGRATION_REQUIRED: ${{ needs.preflight.outputs.integration }}
          OPERATIONS_REQUIRED: ${{ needs.preflight.outputs.operations }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url }}
          BASE_REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail

          require_success() {
            local name=$1
            local actual=$2
            [[ "$actual" == 'success' ]] || {
              echo "$name must succeed; observed result: ${actual:-missing}" >&2
              exit 1
            }
          }

          require_planned() {
            local name=$1
            local required=$2
            local actual=$3
            if [[ "$required" == 'true' ]]; then
              require_success "$name" "$actual"
              return
            fi
            [[ "$actual" == 'skipped' || "$actual" == 'success' ]] || {
              echo "$name was not required but ended in an unsafe state: ${actual:-missing}" >&2
              exit 1
            }
          }

          require_success 'Validation plan and repository control' "$PREFLIGHT_RESULT"
          require_success 'Secret scan' "$SECRETS_RESULT"

          quality_required=false
          if [[ "$UNIT_REQUIRED" == 'true' || "$STATIC_REQUIRED" == 'true' || ( "$STYLE_REQUIRED" == 'true' && "$INTEGRATION_REQUIRED" != 'true' ) ]]; then
            quality_required=true
          fi

          require_planned 'PHP quality and unit tests' "$quality_required" "$QUALITY_RESULT"
          require_planned 'Dependency and license policy' "$DEPENDENCIES_REQUIRED" "$DEPENDENCIES_RESULT"
          require_planned 'MariaDB 10.11 and Redis tests' "$INTEGRATION_REQUIRED" "$INTEGRATION_RESULT"
          require_planned 'Operational syntax and entrypoints' "$OPERATIONS_REQUIRED" "$OPERATIONS_RESULT"

          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            current_head=$(git ls-remote --refs "$HEAD_REPO_URL" "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')
            current_base=$(git ls-remote --refs "$BASE_REPO_URL" "refs/heads/$BASE_REF" | awk 'NR == 1 {print $1}')
            test -n "$current_head" || { echo "Current PR head ref is unavailable: $HEAD_REF" >&2; exit 1; }
            test -n "$current_base" || { echo "Current PR base ref is unavailable: $BASE_REF" >&2; exit 1; }
            if [[ "$current_head" != "$EXPECTED_HEAD_SHA" || "$current_base" != "$EXPECTED_BASE_SHA" ]]; then
              echo 'Pull request revision drifted after validation; a fresh CI run is required.' >&2
              echo "Expected head/base: $EXPECTED_HEAD_SHA / $EXPECTED_BASE_SHA" >&2
              echo "Current head/base: $current_head / $current_base" >&2
              exit 1
            fi
          fi

          {
            echo '## Required CI gate'
            echo
            echo '- Applicable validation jobs completed successfully.'
            echo '- Secret scan completed successfully.'
            if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
              echo '- PR head/base freshness revalidated after dependent jobs completed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
