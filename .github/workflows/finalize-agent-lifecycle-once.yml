name: Finalize agent lifecycle once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/finalize-agent-lifecycle-once.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'develop/v1.0.0-completion'
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 20
    env:
      CI_PHP_IMAGE: freedom-platform-ci-php:8.4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop/v1.0.0-completion
          fetch-depth: 1

      - name: Align domain, provider registration and typed records
        shell: bash
        run: |
          set -euo pipefail
          cat > app/Modules/Agents/Domain/AgentApplicationState.php <<'PHP'
          <?php

          declare(strict_types=1);

          namespace App\Modules\Agents\Domain;

          enum AgentApplicationState: string
          {
              case Submitted = 'submitted';
              case UnderReview = 'under_review';
              case Approved = 'approved';
              case Rejected = 'rejected';
              case Withdrawn = 'withdrawn';

              public function canTransitionTo(self $target): bool
              {
                  return match ($this) {
                      self::Submitted => in_array($target, [self::UnderReview, self::Withdrawn], true),
                      self::UnderReview => in_array($target, [self::Submitted, self::Approved, self::Rejected], true),
                      self::Approved, self::Rejected, self::Withdrawn => false,
                  };
              }

              public function keepsActiveApplicationSlot(): bool
              {
                  return in_array($this, [self::Submitted, self::UnderReview], true);
              }
          }
          PHP

          cat > app/Modules/Agents/Domain/AgentStatus.php <<'PHP'
          <?php

          declare(strict_types=1);

          namespace App\Modules\Agents\Domain;

          enum AgentStatus: string
          {
              case Active = 'active';
              case Limited = 'limited';
              case Suspended = 'suspended';

              public function canTransitionTo(self $target): bool
              {
                  return $this !== $target;
              }
          }
          PHP

          python3 <<'PY'
          from pathlib import Path

          path = Path('app/Modules/Agents/Application/AgentApplicationService.php')
          source = path.read_text()
          source = source.replace('function (Connection $connection, object $application)', 'function (Connection $connection, AgentApplicationRecord $application)')
          source = source.replace('@param callable(Connection, object): void $mutation', '@param callable(Connection, AgentApplicationRecord): void $mutation')
          old = """            /** @var object{customer_id: int, state: string, claimed_by_administrator_id: ?int}|null $application */
            $application = $connection->table('agent_applications')->where('id', $applicationId)->lockForUpdate()->first(['customer_id', 'state', 'claimed_by_administrator_id']);
            if ($application === null || $application->state !== $from->value || ! $from->canTransitionTo($to)) {
                throw new RuntimeException('Agent application transition is not allowed.');
            }
            $mutation($connection, $application);
"""
          new = """            /** @var object{customer_id: int, state: string, claimed_by_administrator_id: ?int}|null $row */
            $row = $connection->table('agent_applications')->where('id', $applicationId)->lockForUpdate()->first(['customer_id', 'state', 'claimed_by_administrator_id']);
            if ($row === null || $row->state !== $from->value || ! $from->canTransitionTo($to)) {
                throw new RuntimeException('Agent application transition is not allowed.');
            }
            $application = new AgentApplicationRecord(
                (int) $row->customer_id,
                $row->state,
                $row->claimed_by_administrator_id === null ? null : (int) $row->claimed_by_administrator_id,
            );
            $mutation($connection, $application);
"""
          if old not in source:
              raise SystemExit('Agent transition record anchor was not found.')
          source = source.replace(old, new)
          source = source.replace('$application->customer_id', '$application->customerId')
          source = source.replace('$application->claimed_by_administrator_id', '$application->claimedByAdministratorId')
          source = source.replace('private function assertReviewerOrOwner(Connection $connection, object $application, int $administratorId): void', 'private function assertReviewerOrOwner(Connection $connection, AgentApplicationRecord $application, int $administratorId): void')
          source = source.replace('private function assertReapplicationAllowed(?object $latest): void', "/** @param object{state: string, reapply_allowed_at: ?string, reapplication_released_at: ?string}|null $latest */\n    private function assertReapplicationAllowed(?object $latest): void")
          old_time = """        if ($latest->reapply_allowed_at === null || $this->clock->now()->getTimestamp() < strtotime($latest->reapply_allowed_at)) {
            throw new RuntimeException('Agent reapplication cooldown is still active.');
        }
"""
          new_time = """        $allowedAt = $latest->reapply_allowed_at === null ? false : strtotime($latest->reapply_allowed_at);
        if ($allowedAt === false || $this->clock->now()->getTimestamp() < $allowedAt) {
            throw new RuntimeException('Agent reapplication cooldown is still active.');
        }
"""
          if old_time not in source:
              raise SystemExit('Agent cooldown anchor was not found.')
          path.write_text(source.replace(old_time, new_time))

          domain_test = Path('tests/Unit/Modules/IdentityAccessDomainTest.php')
          test = domain_test.read_text()
          test = test.replace("['active', 'suspended'], $this->values(AgentStatus::cases())", "['active', 'limited', 'suspended'], $this->values(AgentStatus::cases())")
          test = test.replace('AgentApplicationState::Claimed', 'AgentApplicationState::UnderReview')
          domain_test.write_text(test)

          providers = Path('bootstrap/providers.php')
          text = providers.read_text()
          anchor = '    App\\Modules\\Identity\\Infrastructure\\IdentityServiceProvider::class,\n'
          addition = anchor + '    App\\Modules\\Agents\\Infrastructure\\AgentsServiceProvider::class,\n'
          if 'AgentsServiceProvider::class' not in text:
              if anchor not in text:
                  raise SystemExit('Provider insertion anchor was not found.')
              providers.write_text(text.replace(anchor, addition))

          environment = Path('.env.example')
          env_text = environment.read_text()
          if 'AGENT_REAPPLICATION_COOLDOWN_DAYS=' not in env_text:
              env_text += '\nAGENT_REAPPLICATION_COOLDOWN_DAYS=30\nAGENT_DEFAULT_PRICING_PROFILE_CODE=default\n'
              environment.write_text(env_text)
          PY

      - name: Format and validate package
        shell: bash
        run: |
          set -euo pipefail
          docker build --file docker/ci/php84.Dockerfile --tag "$CI_PHP_IMAGE" docker/ci
          bash scripts/ci/run-php-container.sh composer install --no-interaction --prefer-dist --no-progress
          find app/Modules/Agents app/Modules/AccessControl/Application config/agents.php database/migrations/2026_08_05_000900_extend_agent_lifecycle.php tests/Feature/AgentLifecycleServicesTest.php -type f -name '*.php' -print0 \
            | xargs -0 -n1 bash scripts/ci/run-php-container.sh php -l
          bash scripts/ci/run-php-container.sh vendor/bin/pint \
            app/Modules/AccessControl/Application/AdministratorPermissionAuthorizer.php \
            app/Modules/Agents \
            bootstrap/providers.php \
            config/agents.php \
            database/migrations/2026_08_05_000900_extend_agent_lifecycle.php \
            tests/Feature/AgentLifecycleServicesTest.php \
            tests/Unit/Modules/IdentityAccessDomainTest.php

      - name: Commit finalized package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .env.example \
            app/Modules/AccessControl/Application/AdministratorPermissionAuthorizer.php \
            app/Modules/Agents \
            bootstrap/providers.php \
            config/agents.php \
            database/migrations/2026_08_05_000900_extend_agent_lifecycle.php \
            tests/Feature/AgentLifecycleServicesTest.php \
            tests/Unit/Modules/IdentityAccessDomainTest.php \
            evidence/0.3.0/agent-application-lifecycle.md
          git rm .github/workflows/finalize-agent-lifecycle-once.yml
          git diff --cached --check
          git commit -m 'feat: finalize agent application lifecycle'
          git push origin HEAD:develop/v1.0.0-completion
