name: Fix Telegram Queue Alignment Once

on:
  pull_request:
    paths:
      - .github/workflows/fix-telegram-queue-alignment-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop/v1.0.0-completion
          fetch-depth: 1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, intl, mbstring, openssl, pcntl, pdo_mysql, redis, sodium, xml
          coverage: none
          tools: composer:2.10.2
          ini-file: production
      - name: Align Telegram ingress queue and add recovery command
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('config/telegram.php'): [("'queue' => env('TELEGRAM_WEBHOOK_QUEUE', 'critical'),", "'queue' => env('TELEGRAM_WEBHOOK_QUEUE', 'telegram-ingress'),")],
              Path('.env.example'): [('TELEGRAM_WEBHOOK_QUEUE=critical', 'TELEGRAM_WEBHOOK_QUEUE=telegram-ingress')],
              Path('deploy/supervisor/freedom-platform.conf'): [
                  ('--queue=provisioning,telegram-delivery,synchronization,default', '--queue=provisioning,telegram-ingress,telegram-delivery,synchronization,default'),
                  ('WORKER_QUEUE_GROUP="provisioning,telegram-delivery,synchronization,default"', 'WORKER_QUEUE_GROUP="provisioning,telegram-ingress,telegram-delivery,synchronization,default"'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'{path}: expected text not found: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          bootstrap = Path('bootstrap/app.php')
          text = bootstrap.read_text()
          old = 'use App\\Modules\\Telegram\\Presentation\\Console\\ConfigureTelegramWebhookCommand;\n'
          new = old + 'use App\\Modules\\Telegram\\Presentation\\Console\\RequeueTelegramUpdatesCommand;\n'
          if old not in text:
              raise SystemExit('Bootstrap Telegram command import not found.')
          text = text.replace(old, new, 1)
          old = '        ConfigureTelegramWebhookCommand::class,\n'
          new = old + '        RequeueTelegramUpdatesCommand::class,\n'
          if old not in text:
              raise SystemExit('Bootstrap Telegram command registration not found.')
          bootstrap.write_text(text.replace(old, new, 1))

          verify = Path('deploy/staging/verify-telegram-webhook.sh')
          text = verify.read_text()
          old = '''supervisorctl restart 'freedom-platform-workers:*' >/dev/null
          sleep 5

          CONFIGURE_OUTPUT='''
          new = '''supervisorctl restart 'freedom-platform-workers:*' >/dev/null
          sleep 5
          runuser -u www -- "$PHP" "$ARTISAN" queue:clear redis --queue=critical --force --no-ansi --no-interaction >/dev/null

          CONFIGURE_OUTPUT='''
          if old not in text:
              raise SystemExit('Telegram verification worker restart block not found.')
          text = text.replace(old, new, 1)
          old = '''$app = require $root.'/current/bootstrap/app.php';
          $app->make(Kernel::class)->bootstrap();

          $config ='''
          new = '''$app = require $root.'/current/bootstrap/app.php';
          $kernel = $app->make(Kernel::class);
          $kernel->bootstrap();

          $config ='''
          if old not in text:
              raise SystemExit('Telegram verification kernel bootstrap block not found.')
          text = text.replace(old, new, 1)
          old = '''set_exception_handler(static function (Throwable $exception) use ($database, $botId, &$updateId): never {
              $database->connection()->table('processed_telegram_updates')
                  ->where('bot_id', $botId)
                  ->where('update_id', $updateId)
                  ->delete();
              fwrite(STDERR, "Telegram contract verification failed.\\n");
              exit(1);
          });

          $payload = [
          '''
          new = '''set_exception_handler(static function (Throwable $exception) use ($database, $botId, &$updateId): never {
              $database->connection()->table('processed_telegram_updates')
                  ->where('bot_id', $botId)
                  ->where('update_id', $updateId)
                  ->delete();
              fwrite(STDERR, "Telegram contract verification failed.\\n");
              exit(1);
          });

          $requeueStatus = $kernel->call('telegram:updates:requeue', [
              '--older-than' => 0,
              '--limit' => 100,
              '--include-failed' => true,
              '--json' => true,
          ]);
          $requeueOutput = trim($kernel->output());

          if ($requeueStatus !== 0) {
              throw new RuntimeException('Telegram stranded-update recovery failed.');
          }

          $requeueResult = json_decode($requeueOutput, true, 16, JSON_THROW_ON_ERROR);

          if (! is_array($requeueResult) || ! is_int($requeueResult['requeued'] ?? null)) {
              throw new RuntimeException('Telegram stranded-update recovery returned invalid output.');
          }

          echo 'stranded_updates_requeued='.$requeueResult['requeued'].PHP_EOL;

          $payload = [
          '''
          if old not in text:
              raise SystemExit('Telegram verification failure handler block not found.')
          verify.write_text(text.replace(old, new, 1))

          command = Path('app/Modules/Telegram/Presentation/Console/RequeueTelegramUpdatesCommand.php')
          command.write_text('''<?php

          declare(strict_types=1);

          namespace App\\Modules\\Telegram\\Presentation\\Console;

          use App\\Modules\\Telegram\\Application\\Jobs\\ProcessTelegramUpdateJob;
          use App\\Modules\\Telegram\\Infrastructure\\TelegramRuntimeConfiguration;
          use Illuminate\\Console\\Command;
          use Illuminate\\Database\\DatabaseManager;
          use Illuminate\\Support\\Collection;
          use RuntimeException;

          final class RequeueTelegramUpdatesCommand extends Command
          {
              protected $signature = 'telegram:updates:requeue
                  {--older-than=30 : Only requeue rows not updated during this many seconds}
                  {--limit=100 : Maximum rows to requeue}
                  {--include-failed : Include failed rows in addition to accepted and queued rows}
                  {--json : Emit a machine-readable secret-free result}';

              protected $description = 'Requeue stranded Telegram updates using the configured ingress queue.';

              /** @requirement ONB-001 PAY-003 OPS-003 SEC-009 */
              public function handle(
                  DatabaseManager $database,
                  TelegramRuntimeConfiguration $configuration,
              ): int {
                  $olderThan = $this->integerOption('older-than', 0, 86_400);
                  $limit = $this->integerOption('limit', 1, 1_000);
                  $includeFailed = $this->option('include-failed') === true;
                  $states = $includeFailed ? ['accepted', 'queued', 'failed'] : ['accepted', 'queued'];
                  $cutoff = now('UTC')->subSeconds($olderThan)->format('Y-m-d H:i:s.u');

                  /** @var Collection<int, object> $rows */
                  $rows = $database->connection()->table('processed_telegram_updates')
                      ->whereIn('state', $states)
                      ->where('updated_at', '<=', $cutoff)
                      ->orderBy('id')
                      ->limit($limit)
                      ->get(['bot_id', 'update_id']);

                  $requeued = 0;

                  foreach ($rows as $candidate) {
                      $didRequeue = $database->connection()->transaction(function () use (
                          $database,
                          $configuration,
                          $candidate,
                          $states,
                      ): bool {
                          $row = $database->connection()->table('processed_telegram_updates')
                              ->where('bot_id', (string) $candidate->bot_id)
                              ->where('update_id', (int) $candidate->update_id)
                              ->lockForUpdate()
                              ->first(['state']);

                          if ($row === null || ! in_array((string) $row->state, $states, true)) {
                              return false;
                          }

                          ProcessTelegramUpdateJob::dispatch(
                              (string) $candidate->bot_id,
                              (int) $candidate->update_id,
                          )->onQueue($configuration->queue)->afterCommit();

                          $now = now('UTC')->format('Y-m-d H:i:s.u');
                          $database->connection()->table('processed_telegram_updates')
                              ->where('bot_id', (string) $candidate->bot_id)
                              ->where('update_id', (int) $candidate->update_id)
                              ->update([
                                  'state' => 'queued',
                                  'queued_at' => $now,
                                  'processing_started_at' => null,
                                  'failed_at' => null,
                                  'last_error_class' => null,
                                  'last_error_code' => null,
                                  'updated_at' => $now,
                              ]);

                          return true;
                      });

                      if ($didRequeue) {
                          $requeued++;
                      }
                  }

                  $result = [
                      'requeued' => $requeued,
                      'queue' => $configuration->queue,
                      'included_failed' => $includeFailed,
                  ];

                  if ($this->option('json') === true) {
                      $this->line(json_encode($result, JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR));
                  } else {
                      $this->components->info(sprintf('Requeued %d Telegram update(s) on %s.', $requeued, $configuration->queue));
                  }

                  return self::SUCCESS;
              }

              private function integerOption(string $name, int $minimum, int $maximum): int
              {
                  $value = $this->option($name);

                  if (filter_var($value, FILTER_VALIDATE_INT) === false) {
                      throw new RuntimeException(sprintf('The --%s option must be an integer.', $name));
                  }

                  $integer = (int) $value;

                  if ($integer < $minimum || $integer > $maximum) {
                      throw new RuntimeException(sprintf('The --%s option is outside the allowed range.', $name));
                  }

                  return $integer;
              }
          }
          ''')

          test = Path('tests/Feature/RequeueTelegramUpdatesCommandTest.php')
          test.write_text('''<?php

          declare(strict_types=1);

          namespace Tests\\Feature;

          use App\\Modules\\Telegram\\Application\\Jobs\\ProcessTelegramUpdateJob;
          use Illuminate\\Foundation\\Testing\\RefreshDatabase;
          use Illuminate\\Support\\Facades\\Artisan;
          use Illuminate\\Support\\Facades\\DB;
          use Illuminate\\Support\\Facades\\Queue;
          use Tests\\TestCase;

          final class RequeueTelegramUpdatesCommandTest extends TestCase
          {
              use RefreshDatabase;

              protected function setUp(): void
              {
                  parent::setUp();
                  Queue::fake();
                  config([
                      'app.url' => 'https://bot.example.test',
                      'telegram.bot_token' => '123456789:abcdefghijklmnopqrstuvwxyz_ABCDE',
                      'telegram.webhook_secret' => 'telegram_webhook_secret_1234567890_safe',
                      'telegram.webhook_path' => 'api/telegram/webhook',
                      'telegram.max_body_bytes' => 1_048_576,
                      'telegram.queue' => 'telegram-ingress',
                      'telegram.processing_lease_seconds' => 120,
                      'telegram.api_base_url' => 'https://api.telegram.org',
                      'telegram.api_timeout_seconds' => 15,
                  ]);
              }

              public function test_stranded_update_is_requeued_on_the_configured_ingress_queue(): void
              {
                  $this->insertUpdate(7001, 'queued');

                  $exitCode = Artisan::call('telegram:updates:requeue', [
                      '--older-than' => 0,
                      '--limit' => 10,
                      '--json' => true,
                  ]);

                  self::assertSame(0, $exitCode);
                  self::assertStringContainsString('"requeued":1', Artisan::output());
                  self::assertStringContainsString('"queue":"telegram-ingress"', Artisan::output());
                  Queue::assertPushedOn('telegram-ingress', ProcessTelegramUpdateJob::class);
                  $this->assertDatabaseHas('processed_telegram_updates', [
                      'bot_id' => '123456789',
                      'update_id' => 7001,
                      'state' => 'queued',
                  ]);
                  self::assertNotNull(DB::table('processed_telegram_updates')->where('update_id', 7001)->value('queued_at'));
              }

              public function test_failed_update_requires_explicit_inclusion(): void
              {
                  $this->insertUpdate(7002, 'failed');

                  Artisan::call('telegram:updates:requeue', ['--older-than' => 0, '--json' => true]);
                  Queue::assertNothingPushed();

                  Artisan::call('telegram:updates:requeue', [
                      '--older-than' => 0,
                      '--include-failed' => true,
                      '--json' => true,
                  ]);
                  Queue::assertPushedOn('telegram-ingress', ProcessTelegramUpdateJob::class);
              }

              private function insertUpdate(int $updateId, string $state): void
              {
                  $now = now('UTC')->subMinute()->format('Y-m-d H:i:s.u');
                  DB::table('processed_telegram_updates')->insert([
                      'bot_id' => '123456789',
                      'update_id' => $updateId,
                      'payload_hash' => hash('sha256', (string) $updateId),
                      'state' => $state,
                      'attempt_count' => 0,
                      'created_at' => $now,
                      'updated_at' => $now,
                  ]);
              }
          }
          ''')

          contract = Path('tests/Unit/Deployment/StagingDeploymentScriptContractTest.php')
          text = contract.read_text()
          old = '''        self::assertStringContainsString("supervisorctl restart 'freedom-platform-workers:*'", $script);
                  self::assertStringContainsString('set_exception_handler', $script);
                  self::assertStringContainsString('exit(1);', $script);
              }
          }
          '''
          new = '''        self::assertStringContainsString("supervisorctl restart 'freedom-platform-workers:*'", $script);
                  self::assertStringContainsString('queue:clear redis --queue=critical', $script);
                  self::assertStringContainsString('telegram:updates:requeue', $script);
                  self::assertStringContainsString('set_exception_handler', $script);
                  self::assertStringContainsString('exit(1);', $script);
              }

              /** @requirement ONB-001 OPS-003 QUA-013 */
              public function test_telegram_ingress_queue_is_consumed_by_supervisor(): void
              {
                  $configuration = file_get_contents(dirname(__DIR__, 3).'/config/telegram.php');
                  $supervisor = file_get_contents(dirname(__DIR__, 3).'/deploy/supervisor/freedom-platform.conf');
                  self::assertIsString($configuration);
                  self::assertIsString($supervisor);
                  self::assertStringContainsString("TELEGRAM_WEBHOOK_QUEUE', 'telegram-ingress'", $configuration);
                  self::assertStringContainsString('--queue=provisioning,telegram-ingress,telegram-delivery,synchronization,default', $supervisor);
              }
          }
          '''
          if old not in text:
              raise SystemExit('Deployment contract test block not found.')
          contract.write_text(text.replace(old, new, 1))
          PY
          chmod 755 deploy/staging/verify-telegram-webhook.sh
          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/pint \
            app/Modules/Telegram/Presentation/Console/RequeueTelegramUpdatesCommand.php \
            tests/Feature/RequeueTelegramUpdatesCommandTest.php \
            tests/Unit/Deployment/StagingDeploymentScriptContractTest.php \
            bootstrap/app.php \
            config/telegram.php
          git diff --check
      - name: Commit queue alignment package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .env.example bootstrap/app.php config/telegram.php \
            deploy/supervisor/freedom-platform.conf \
            deploy/staging/verify-telegram-webhook.sh \
            app/Modules/Telegram/Presentation/Console/RequeueTelegramUpdatesCommand.php \
            tests/Feature/RequeueTelegramUpdatesCommandTest.php \
            tests/Unit/Deployment/StagingDeploymentScriptContractTest.php
          git commit -m 'fix(telegram): align ingress queue with Supervisor'
          git push origin HEAD:develop/v1.0.0-completion
