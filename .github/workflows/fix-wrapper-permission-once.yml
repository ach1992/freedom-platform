name: Fix Wrapper Permission Once

on:
  pull_request:
    paths:
      - .github/workflows/fix-wrapper-permission-once.yml

permissions:
  contents: write

jobs:
  patch-and-recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop/v1.0.0-completion
          fetch-depth: 1
      - name: Patch executable permission contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          deploy = Path('deploy/staging/core-deploy.sh')
          text = deploy.read_text()
          old = '''    find "$release_path" -type f -exec chmod 0640 {} +
              chmod 0750 "$release_path/artisan"
              install -d -o www -g www -m 0750 "$release_path/bootstrap/cache"
          '''
          new = '''    find "$release_path" -type f -exec chmod 0640 {} +
              chmod 0750 "$release_path/artisan"
              chmod 0750 "$release_path/deploy/bin/queue-worker-with-heartbeat.sh"
              install -d -o www -g www -m 0750 "$release_path/bootstrap/cache"
          '''
          if old not in text:
              raise SystemExit('Release permission block not found.')
          deploy.write_text(text.replace(old, new, 1))

          test = Path('tests/Unit/Deployment/QueueWorkerHeartbeatWrapperTest.php')
          text = test.read_text()
          old = '''        self::assertSame(3, substr_count($configuration, 'killasgroup=true'));
              }
          }
          '''
          new = '''        self::assertSame(3, substr_count($configuration, 'killasgroup=true'));
              }

              /** @requirement RUN-002 RUN-003 OPS-003 QUA-013 */
              public function test_release_preparation_restores_wrapper_execute_permission(): void
              {
                  $deployment = file_get_contents(dirname(__DIR__, 3).'/deploy/staging/core-deploy.sh');

                  self::assertIsString($deployment);
                  self::assertStringContainsString(
                      'chmod 0750 "$release_path/deploy/bin/queue-worker-with-heartbeat.sh"',
                      $deployment,
                  );
              }
          }
          '''
          if old not in text:
              raise SystemExit('Wrapper contract test block not found.')
          test.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit permission correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/staging/core-deploy.sh tests/Unit/Deployment/QueueWorkerHeartbeatWrapperTest.php
          git commit -m 'fix(staging): preserve heartbeat wrapper executable bit'
          git push origin HEAD:develop/v1.0.0-completion
      - name: Prepare SSH client
        env:
          KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Recover staging workers immediately
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          PORT: ${{ secrets.STAGING_PORT }}
          USER: ${{ secrets.STAGING_USER }}
          DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$PORT" "$USER@$HOST" "DOMAIN='$DOMAIN' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          ROOT="/www/acdomains/$DOMAIN"
          for release in "$ROOT"/releases/staging-{a,b}-69ad5f4ff697; do
              test -f "$release/deploy/bin/queue-worker-with-heartbeat.sh"
              chown www:www "$release/deploy/bin/queue-worker-with-heartbeat.sh"
              chmod 0750 "$release/deploy/bin/queue-worker-with-heartbeat.sh"
          done
          supervisorctl reread >/dev/null
          supervisorctl update >/dev/null
          supervisorctl restart 'freedom-platform-workers:*' >/dev/null
          sleep 8
          supervisorctl status 'freedom-platform-workers:*'
          test "$(supervisorctl status 'freedom-platform-workers:*' | grep -c 'RUNNING')" = '5'
          echo 'worker_permission_recovery=passed'
          REMOTE
      - if: always()
        run: rm -rf "$HOME/.ssh"
