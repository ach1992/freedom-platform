name: Format Identity Phone Once

on:
  push:
    branches:
      - develop/v1.0.0-completion
    paths:
      - .github/workflows/format-identity-phone-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message == 'ci: format identity phone package once'
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop/v1.0.0-completion
          fetch-depth: 1
      - run: docker build --file docker/ci/php84.Dockerfile --tag freedom-platform-ci-php:8.4 docker/ci
      - run: bash scripts/ci/run-php-container.sh composer install --no-interaction --prefer-dist --no-progress
      - name: Format identity package
        run: |
          set -euo pipefail
          bash scripts/ci/run-php-container.sh vendor/bin/pint \
            app/Modules/Identity \
            database/migrations/2026_08_04_000600_extend_phone_verification_foundation.php \
            tests/Unit/Modules/IdentityPhoneDomainTest.php \
            tests/Feature/TelegramContactVerificationTest.php \
            tests/Feature/SmsFallbackPersistenceTest.php
      - name: Commit exact formatter result
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            app/Modules/Identity \
            database/migrations/2026_08_04_000600_extend_phone_verification_foundation.php \
            tests/Unit/Modules/IdentityPhoneDomainTest.php \
            tests/Feature/TelegramContactVerificationTest.php \
            tests/Feature/SmsFallbackPersistenceTest.php
          if git diff --cached --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git commit -m 'style: format identity phone package'
          git push origin HEAD:develop/v1.0.0-completion
