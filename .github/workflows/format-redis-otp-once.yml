name: Format Redis OTP Limiter Once

on:
  pull_request:
    paths:
      - .github/workflows/format-redis-otp-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop/v1.0.0-completion
          fetch-depth: 1
      - run: docker build --file docker/ci/php84.Dockerfile --tag freedom-platform-ci-php:8.4 docker/ci
      - run: bash scripts/ci/run-php-container.sh composer install --no-interaction --prefer-dist --no-progress
      - run: bash scripts/ci/run-php-container.sh vendor/bin/pint app/Modules/Identity/Infrastructure/RedisOtpAbuseLimiter.php
      - name: Commit formatter result
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/Modules/Identity/Infrastructure/RedisOtpAbuseLimiter.php
          if git diff --cached --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git commit -m 'style: format Redis OTP limiter'
          git push origin HEAD:develop/v1.0.0-completion
