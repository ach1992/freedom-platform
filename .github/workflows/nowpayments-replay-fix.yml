name: One-time NOWPayments replay fix

on:
  push:
    branches:
      - task/8-phase-0.5-completion
    paths:
      - .github/workflows/nowpayments-replay-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch stable settlement evidence identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/Modules/Payments/NowPayments/Application/NowPaymentsPaymentService.php')
          text = path.read_text()
          old = """            $settledAt = $result->updatedAt ?? $this->clock->now();
            $eventId = 'status:'.strtolower($result->responseHash);
            $settlementEvent = new VerifiedPaymentEvent(
                $eventId,
                strtolower($result->responseHash),
                new PaymentEvidence(
"""
          new = """            $settledAt = $result->updatedAt ?? $this->clock->now();
            $settlementEvidenceHash = hash('sha256', json_encode([
                'provider_payment_id' => (string) $current->provider_payment_id,
                'payment_status' => 'finished',
                'order_id' => (string) $current->order_id,
                'price_amount' => (string) $current->price_amount_usd,
                'price_currency' => 'USD',
                'pay_amount' => $result->payAmount,
                'actually_paid' => $result->actuallyPaid,
                'pay_currency' => (string) $current->pay_currency,
            ], JSON_THROW_ON_ERROR | JSON_UNESCAPED_SLASHES));
            $eventId = 'payment:'.(string) $current->provider_payment_id.':finished';
            $settlementEvent = new VerifiedPaymentEvent(
                $eventId,
                $settlementEvidenceHash,
                new PaymentEvidence(
"""
          if old not in text:
              raise SystemExit('expected NOWPayments settlement block not found')
          text = text.replace(old, new, 1)
          old_hash = """                    strtolower($result->responseHash),
                    [
                        'provider_status' => 'finished',
"""
          new_hash = """                    $settlementEvidenceHash,
                    [
                        'provider_status' => 'finished',
"""
          if old_hash not in text:
              raise SystemExit('expected NOWPayments evidence hash block not found')
          text = text.replace(old_hash, new_hash, 1)
          path.write_text(text)
          PY
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Format and validate patch
        run: |
          vendor/bin/pint app/Modules/Payments/NowPayments/Application/NowPaymentsPaymentService.php
          git diff --check
      - name: Commit targeted fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Modules/Payments/NowPayments/Application/NowPaymentsPaymentService.php
          git commit -m "fix(nowpayments): stabilize settlement replay evidence (#113)"
          git push origin HEAD:task/8-phase-0.5-completion
