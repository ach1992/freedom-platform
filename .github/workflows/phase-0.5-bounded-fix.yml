name: Phase 0.5 bounded correction

on:
  push:
    branches:
      - task/8-phase-0.5-completion
    paths:
      - .github/workflows/phase-0.5-bounded-fix.yml

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/8-phase-0.5-completion
          fetch-depth: 0

      - name: Guard exact starting head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "ac86f1a4f4bdbac19e7474f9a588656a955d157f"
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"

      - name: Apply evidence-backed corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          # CI #2036 proved this extension has zero effect: PHPStan remained at 709 errors.
          replace_exact(
              'phpstan.neon',
              "\nservices:\n    -\n        class: App\\PHPStan\\DatabaseQueryBuilderExpressionTypeExtension\n        tags:\n            - phpstan.broker.expressionTypeResolverExtension\n",
              "\n",
          )
          Path('app/PHPStan/DatabaseQueryBuilderExpressionTypeExtension.php').unlink()

          # Canonical BSC USDT is application authority; tests must not inject a synthetic contract.
          usdt_files = {
              'tests/Feature/UsdtBep20PaymentFlowTest.php': 'use App\\Modules\\Payments\\Usdt\\Application\\UsdtAmountQuoteService;\n',
              'tests/Feature/UsdtBep20ReconciliationTest.php': 'use App\\Modules\\Payments\\Usdt\\Application\\UsdtBlockchainVerificationService;\n',
              'tests/Feature/UsdtVerifiedTransferContentionTest.php': '    use App\\Modules\\Payments\\Usdt\\Application\\UsdtAmountQuoteService;\n',
          }
          for path, anchor in usdt_files.items():
              text = Path(path).read_text()
              import_line = ('    ' if anchor.startswith('    ') else '') + 'use App\\Modules\\Payments\\Usdt\\Application\\UsdtBep20Asset;\n'
              if import_line in text:
                  raise SystemExit(f'{path}: canonical asset import already present unexpectedly')
              replace_exact(path, anchor, anchor + import_line)
              replace_exact(
                  path,
                  "config()->set('payments.usdt_bep20.token_contract', '0x'.str_repeat('aa', 20));",
                  "config()->set('payments.usdt_bep20.token_contract', UsdtBep20Asset::TOKEN_CONTRACT);",
              )

          # Preserve the DateTimeImmutable application contract in contention setup.
          replace_exact(
              'tests/Feature/GiftCardRedemptionContentionTest.php',
              "                now('UTC')->addMinutes(20),\n                'Gift-card contention provider is healthy.',",
              "                now('UTC')->addMinutes(20)->toDateTimeImmutable(),\n                'Gift-card contention provider is healthy.',",
          )

          # This closure uses $this and therefore cannot be static.
          replace_exact(
              'tests/Feature/ReferralRewardAccrualTest.php',
              "$this->assertQueryRejected(static fn (): bool => DB::table('referral_rewards')->insert([",
              "$this->assertQueryRejected(fn (): bool => DB::table('referral_rewards')->insert([",
          )

          # CLI bootstrap may emit blank stdout before the explicit worker protocol marker.
          reader_old = """                    $line = fgets($stream);\n                    if ($line !== false) {\n                        return $line;\n                    }\n"""
          reader_new = """                    $line = fgets($stream);\n                    if ($line !== false) {\n                        if (trim($line) === '') {\n                            continue;\n                        }\n\n                        return $line;\n                    }\n"""
          for path in [
              'tests/Feature/CardToCardContentionTest.php',
              'tests/Feature/ZarinpalRequestContentionVerificationTest.php',
              'tests/Feature/GiftCardRedemptionContentionTest.php',
              'tests/Feature/UsdtVerifiedTransferContentionTest.php',
          ]:
              replace_exact(path, reader_old, reader_new)

          # Assertions track the tightened fail-closed wording already emitted by production code.
          replace_exact(
              'tests/Feature/GiftCardPaymentFlowTest.php',
              "'authoritative redeemed evidence'",
              "'authoritative post-submission redeemed evidence'",
          )
          for path in [
              'tests/Feature/PurchaseRefundAuthorityTest.php',
              'tests/Feature/PurchaseRefundContentionVerificationTest.php',
          ]:
              replace_exact(
                  path,
                  "'Purchase refund would exceed authoritative captured amount.'",
                  "'Purchase refund would exceed authoritative refundable captured amount.'",
              )
          PY

          rm .github/workflows/phase-0.5-bounded-fix.yml
          git diff --check

      - name: Commit and push once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Expected bounded corrections, found none.' >&2; exit 1; }
          git commit -m 'test(phase-0.5): correct deterministic CI contracts'
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"
          git push origin HEAD:task/8-phase-0.5-completion
