name: Phase 0.5 canonical documentation wording polish

on:
  push:
    branches:
      - task/34-wallex-spec-reconcile

permissions:
  contents: write

concurrency:
  group: phase-0.5-doc-polish
  cancel-in-progress: false

jobs:
  polish:
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    if: ${{ github.actor == 'ach1992' && github.ref_name == 'task/34-wallex-spec-reconcile' }}
    steps:
      - name: Check out exact staging revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Guard and polish exact requirement wording
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a4d8f846f0490df37611af608201bcaef3e602d1"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/specification/master-execution-prompt.md')
          text = path.read_text()
          replacements = {
              "| `USDT-002` | Rate providers include managed Manual IRR-per-USDT, Nobitex public USDT/RLS, and Wallex public `USDTTMN`, with deterministic `Nobitex -> Wallex -> Manual` selection, stale-rate limits, min/max sanity checks, divergence guard, circuit breaking, and protected managed-setting history. |":
              "| `USDT-002` | Rate providers include managed Manual IRR-per-USDT, Nobitex public USDT/RLS, and Wallex public `USDTTMN`, with deterministic `Nobitex -> Wallex -> Manual` selection, stale-rate limits, min/max sanity checks, divergence guard, circuit breaking, protected managed-setting history, and test connection. |",
              "| `IPG-002` | NOWPayments create-payment, IPN signature verification, server-side status lookup, amount/currency/order matching, partial/over/under payment policy, expiration, and reconciliation use the same snapshotted IRR-per-USDT authority as direct USDT as the explicit V1 `price_currency=usd` pricing proxy; no separate USD/IRR or Manual USD authority exists. |":
              "| `IPG-002` | NOWPayments implements create-payment, IPN signature verification, server-side status lookup, amount/currency/order matching, partial/over/under payment policy, expiration, and reconciliation. Version 1 pricing uses the same snapshotted IRR-per-USDT authority as direct USDT as the explicit `price_currency=usd` pricing proxy; no separate USD/IRR provider or Manual USD authority exists. |",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one wording match, found {count}: {old[:40]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          ! grep -Fq 'Tetherland' docs/specification/master-execution-prompt.md
          grep -Fq 'test connection' docs/specification/master-execution-prompt.md
          grep -Fq 'Version 1 pricing uses the same snapshotted IRR-per-USDT authority' docs/specification/master-execution-prompt.md
          bash scripts/ci/verify-planning.sh
          bash scripts/ci/verify-project-control.sh
          git diff --check
      - name: Commit only durable documentation polish
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase-0.5-doc-polish.yml
          git add docs/specification/master-execution-prompt.md
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' '.github/workflows/phase-0.5-doc-polish.yml' 'docs/specification/master-execution-prompt.md' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(phase-0.5): polish canonical pricing requirements'
          git push origin HEAD:task/34-wallex-spec-reconcile
