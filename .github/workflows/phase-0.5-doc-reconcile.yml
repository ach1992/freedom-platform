name: Phase 0.5 canonical documentation reconciliation

on:
  push:
    branches:
      - task/34-wallex-spec-reconcile

permissions:
  contents: write

concurrency:
  group: phase-0.5-doc-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    if: ${{ github.actor == 'ach1992' && github.ref_name == 'task/34-wallex-spec-reconcile' }}
    steps:
      - name: Check out exact staging revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Guard staging base and reconcile canonical docs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2c1a99717cba02fed50e15988ac8475a2e631591"
          python3 - <<'PY'
          from pathlib import Path

          spec_path = Path('docs/specification/master-execution-prompt.md')
          spec = spec_path.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          spec = replace_once(
              spec,
              "Version 1 supports:\n\n- manual rate;\n- Nobitex public market data;\n- Tetherland price data;\n- future adapters.",
              "Version 1 supports:\n\n- managed Manual IRR-per-USDT rate;\n- Nobitex public USDT/RLS market data;\n- Wallex public `USDTTMN` spot-market data;\n- future adapters.\n\nRuntime selection is deterministic: `Nobitex -> Wallex -> Manual`. The Manual rate is a protected DB-backed, versioned, audited product setting. Deployment configuration is bootstrap fallback only before a managed value exists; it is not a second runtime authority.",
              'USDT rate-provider section',
          )
          spec = replace_once(
              spec,
              "- invalid signature changes no financial state;\n- compare payment ID, order ID, amount, pay currency, price currency, and status;",
              "- invalid signature changes no financial state;\n- use the same selected IRR-per-USDT authority as direct USDT pricing (`Nobitex -> Wallex -> Manual`) as the explicit Version 1 business pricing proxy required for `price_currency=usd`; this is a pricing policy, not a claim that USD and USDT are economically identical;\n- snapshot the selected rate source, exact rate, provider evidence identity, pricing-policy identity, derived USD `price_amount`, pay currency, and rounding policy immutably for each payment;\n- do not introduce a separate USD/IRR provider or Manual USD rate in Version 1;\n- compare payment ID, order ID, amount, pay currency, price currency, and status;",
              'NOWPayments pricing authority section',
          )
          spec = replace_once(
              spec,
              "- Tetherland public price endpoint: `https://api.tetherland.com/currencies`",
              "- Wallex public markets endpoint: `https://api.wallex.ir/hector/web/v1/markets`",
              'official rate-provider source',
          )
          spec = replace_once(
              spec,
              "| `USDT-002` | Rate providers include manual, Nobitex, and Tetherland with priority/fallback, stale-rate limits, min/max sanity checks, divergence guard, and test connection. |",
              "| `USDT-002` | Rate providers include managed Manual IRR-per-USDT, Nobitex public USDT/RLS, and Wallex public `USDTTMN`, with deterministic `Nobitex -> Wallex -> Manual` selection, stale-rate limits, min/max sanity checks, divergence guard, circuit breaking, and protected managed-setting history. |",
              'USDT-002 requirement row',
          )
          spec = replace_once(
              spec,
              "| `IPG-002` | NOWPayments create-payment, IPN signature verification, server-side status lookup, amount/currency/order matching, partial/over/under payment policy, expiration, and reconciliation are implemented. |",
              "| `IPG-002` | NOWPayments create-payment, IPN signature verification, server-side status lookup, amount/currency/order matching, partial/over/under payment policy, expiration, and reconciliation use the same snapshotted IRR-per-USDT authority as direct USDT as the explicit V1 `price_currency=usd` pricing proxy; no separate USD/IRR or Manual USD authority exists. |",
              'IPG-002 requirement row',
          )
          if 'Tetherland' in spec:
              raise SystemExit('master specification still contains Tetherland after reconciliation')
          spec_path.write_text(spec)

          req_path = Path('docs/01-authoritative-requirements.md')
          req = req_path.read_text()
          req = replace_once(
              req,
              "For the two explicit Owner-approved Version 1 provider clarifications below, these durable rules supersede conflicting historical provider names or pricing-source wording that remains in the master specification. No other master-specification requirement is changed.",
              "The two explicit Owner-approved Version 1 provider clarifications below are also reflected in the master specification. They remain repeated here so the stable requirement IDs stay unambiguous; no other master-specification requirement is changed.",
              'requirements reconciliation note',
          )
          req_path.write_text(req)
          PY

          grep -Fq 'Wallex public `USDTTMN` spot-market data' docs/specification/master-execution-prompt.md
          grep -Fq 'Nobitex -> Wallex -> Manual' docs/specification/master-execution-prompt.md
          grep -Fq 'price_currency=usd' docs/specification/master-execution-prompt.md
          ! grep -Fq 'Tetherland' docs/specification/master-execution-prompt.md
          bash scripts/ci/verify-planning.sh
          bash scripts/ci/verify-project-control.sh
          git diff --check

      - name: Commit only durable documentation corrections
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase-0.5-doc-reconcile.yml
          git add docs/specification/master-execution-prompt.md docs/01-authoritative-requirements.md
          test -n "$(git status --porcelain)"
          git diff --cached --name-only | sort > /tmp/changed.txt
          printf '%s\n' '.github/workflows/phase-0.5-doc-reconcile.yml' 'docs/01-authoritative-requirements.md' 'docs/specification/master-execution-prompt.md' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(phase-0.5): reconcile canonical provider pricing contract'
          git push origin HEAD:task/34-wallex-spec-reconcile
