name: Phase 0.5 bounded functional correction v2

on:
  push:
    branches:
      - task/8-phase-0.5-completion
    paths:
      - .github/workflows/phase-0.5-functional-fix-v2.yml

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/8-phase-0.5-completion
          fetch-depth: 0

      - name: Guard exact starting head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 06d4e2be7891449f7ee9afceb2094351a94e1a87 "${GITHUB_SHA}"
          unexpected="$(git diff --name-only 06d4e2be7891449f7ee9afceb2094351a94e1a87.."${GITHUB_SHA}" | grep -Ev "^\.github/workflows/phase-0\.5-functional-fix(-v2)?\.yml$|^\.github/workflows/phase-0\.5-helper-repair\.yml$" || true)"
          test -z "$unexpected"
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"

      - name: Bootstrap PHP toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap-self-hosted-toolchain.sh no-coverage
          export PATH="$(tail -n 1 "$GITHUB_PATH"):$PATH"
          php --version
          composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Apply evidence-backed corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path: str, old: str, new: str, minimum: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} occurrence(s), found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          replace_once(
              'tests/Feature/CardToCardContentionTest.php',
              "    use Illuminate\\Database\\DatabaseManager;\n\n    final class C2cContentionFixedAdjustmentGenerator",
              "    use Illuminate\\Database\\DatabaseManager;\n\n    require_once dirname(__DIR__, 2).'/vendor/autoload.php';\n\n    final class C2cContentionFixedAdjustmentGenerator",
          )
          replace_once(
              'tests/Feature/CardToCardContentionTest.php',
              "        require dirname(__DIR__, 2).'/vendor/autoload.php';",
              "        require_once dirname(__DIR__, 2).'/vendor/autoload.php';",
          )
          replace_once(
              'tests/Feature/ZarinpalRequestContentionVerificationTest.php',
              "    use Illuminate\\Contracts\\Console\\Kernel;\n\n    final class ZarinpalRequestContentionTransport",
              "    use Illuminate\\Contracts\\Console\\Kernel;\n\n    require_once dirname(__DIR__, 2).'/vendor/autoload.php';\n\n    final class ZarinpalRequestContentionTransport",
          )
          replace_once(
              'tests/Feature/ZarinpalRequestContentionVerificationTest.php',
              "        require dirname(__DIR__, 2).'/vendor/autoload.php';",
              "        require_once dirname(__DIR__, 2).'/vendor/autoload.php';",
          )

          replace_once(
              'tests/Feature/CardToCardMatchingTest.php',
              "$this->assertQueryRejected(static fn (): bool => DB::table('purchase_refunds')->insert([",
              "$this->assertQueryRejected(fn (): bool => DB::table('purchase_refunds')->insert([",
          )
          replace_once(
              'tests/Feature/GiftCardRedemptionContentionTest.php',
              "                now('UTC')->addMinutes(30),",
              "                now('UTC')->addMinutes(30)->toDateTimeImmutable(),",
          )

          teardown = """        protected function tearDown(): void
          {
              try {
                  if (isset($this->app)) {
                      $this->truncateDatabaseTables();
                  }
              } finally {
                  parent::tearDown();
              }
          }

          """
          replace_once(
              'tests/Feature/ReferralRewardAccrualContentionVerificationTest.php',
              "        public function test_concurrent_duplicate_settlement_creates_once_and_replays_once(): void\n",
              teardown + "        public function test_concurrent_duplicate_settlement_creates_once_and_replays_once(): void\n",
          )
          replace_once(
              'tests/Feature/ReferralRewardLifecycleContentionVerificationTest.php',
              "        public function test_duplicate_mature_workers_create_exactly_one_release_effect(): void\n",
              teardown + "        public function test_duplicate_mature_workers_create_exactly_one_release_effect(): void\n",
          )

          replace_all(
              'tests/Feature/UsdtBep20PaymentFlowTest.php',
              'UsdtTokenAmount::toBaseUnits($amountQuote->exactUsdt)',
              'UsdtTokenAmount::toBaseUnits($amountQuote->exactUsdt, UsdtBep20Asset::TOKEN_DECIMALS)',
          )
          replace_once(
              'tests/Feature/UsdtBep20TestSupport.php',
              'use App\\Modules\\Payments\\Usdt\\Application\\UsdtAmountQuoteService;\n',
              'use App\\Modules\\Payments\\Usdt\\Application\\UsdtAmountQuoteService;\nuse App\\Modules\\Payments\\Usdt\\Application\\UsdtBep20Asset;\n',
          )
          replace_all(
              'tests/Feature/UsdtBep20TestSupport.php',
              'UsdtTokenAmount::toBaseUnits($amountQuote->exactUsdt)',
              'UsdtTokenAmount::toBaseUnits($amountQuote->exactUsdt, UsdtBep20Asset::TOKEN_DECIMALS)',
          )
          replace_once(
              'tests/Feature/UsdtVerifiedTransferContentionTest.php',
              '    use App\\Modules\\Payments\\Usdt\\Application\\Contracts\\UsdtBlockchainVerificationEvidence;\n',
              '    use App\\Modules\\Payments\\Usdt\\Application\\Contracts\\UsdtBlockchainVerificationEvidence;\n    use App\\Modules\\Payments\\Usdt\\Application\\UsdtBep20Asset;\n',
          )
          replace_once(
              'tests/Feature/UsdtVerifiedTransferContentionTest.php',
              "                56,\n                (string) $payload['token_contract'],\n                (string) $payload['destination_address'],\n                (int) $payload['amount_base_units'],\n                6,",
              "                UsdtBep20Asset::CHAIN_ID,\n                (string) $payload['token_contract'],\n                (string) $payload['destination_address'],\n                (string) $payload['amount_base_units'],\n                UsdtBep20Asset::TOKEN_DECIMALS,",
          )

          replace_once(
              'tests/Feature/UsdtManualRateSettingTest.php',
              "        self::assertSame(1, $managed->version);",
              "        self::assertGreaterThan(0, $managed->version ?? 0);",
          )
          replace_once(
              'tests/Feature/UsdtManualRateSettingTest.php',
              "        self::assertSame(1, $current->version);",
              "        self::assertSame($managed->version, $current->version);",
          )
          replace_once(
              'tests/Feature/UsdtManualRateSettingTest.php',
              "        self::assertSame(2, $second->version);",
              "        self::assertGreaterThan($first->version ?? 0, $second->version ?? 0);",
          )
          replace_once(
              'tests/Feature/UsdtManualRateSettingTest.php',
              "        $this->service()->set($finance, '900000', 'usdt-rate-setting-0004', 'corr-usdt-rate-0004');\n\n        $this->assertQueryRejected(fn (): int => DB::table('usdt_manual_rate_versions')->where('id', 1)->update([\n            'rate_irr' => '950000.00000000',\n        ]));\n        $this->assertQueryRejected(fn (): int => DB::table('usdt_manual_rate_versions')->where('id', 1)->delete());",
              "        $created = $this->service()->set($finance, '900000', 'usdt-rate-setting-0004', 'corr-usdt-rate-0004');\n        self::assertNotNull($created->version);\n\n        $this->assertQueryRejected(fn (): int => DB::table('usdt_manual_rate_versions')->where('id', $created->version)->update([\n            'rate_irr' => '950000.00000000',\n        ]));\n        $this->assertQueryRejected(fn (): int => DB::table('usdt_manual_rate_versions')->where('id', $created->version)->delete());",
          )

          service_path = 'app/Modules/Payments/GiftCard/Application/GiftCardSubmissionService.php'
          replace_once(
              service_path,
              "        $keyVersion = $normalizedCode === null ? null : $this->lookupKeyVersion();\n        $codeHash = $normalizedCode === null ? null : hash_hmac('sha256', $normalizedCode, $this->lookupKey());\n        $maskedCode = $normalizedCode === null ? null : $this->maskCode($normalizedCode);",
              "        $keyVersion = $normalizedCode === null ? null : $this->lookupKeyVersion();\n        $codeHash = $normalizedCode === null ? null : hash_hmac('sha256', $normalizedCode, $this->lookupKey());\n        $previousLookup = $normalizedCode === null || $keyVersion === null ? null : $this->previousLookupKey($keyVersion);\n        $previousCodeHash = $previousLookup === null || $normalizedCode === null ? null : hash_hmac('sha256', $normalizedCode, $previousLookup['key']);\n        $previousKeyVersion = $previousLookup['version'] ?? null;\n        $maskedCode = $normalizedCode === null ? null : $this->maskCode($normalizedCode);",
          )
          replace_once(
              service_path,
              "                $codeHash,\n                $maskedCode,",
              "                $codeHash,\n                $previousCodeHash,\n                $previousKeyVersion,\n                $maskedCode,",
          )
          previous_payload = """                $previousPayloadHash = null;
          if ($previousCodeHash !== null && $previousKeyVersion !== null) {
              $previousPayloadHash = $this->requestPayloadHash(
                  (int) $intent->id,
                  (int) $type->id,
                  (int) $type->version,
                  (string) $type->configuration_hash,
                  $userId,
                  $previousCodeHash,
                  $previousKeyVersion,
                  $privateImageReference,
                  $telegramFileId,
                  $telegramFileUniqueId,
                  $imageContentHash,
                  $claimedFaceValue,
                  $claimedCurrency,
                  $claimedBrand,
                  $claimedRegion,
              );
          }

          """
          replace_once(
              service_path,
              "                $existing = $connection->table('gift_card_submissions')->where('submission_key', $submissionKey)->lockForUpdate()->first();\n",
              previous_payload + "                $existing = $connection->table('gift_card_submissions')->where('submission_key', $submissionKey)->lockForUpdate()->first();\n",
          )
          replace_once(
              service_path,
              "                        || ! hash_equals(strtolower((string) $existing->request_payload_hash), $payloadHash)) {",
              "                        || (! hash_equals(strtolower((string) $existing->request_payload_hash), $payloadHash)\n                            && ($previousPayloadHash === null\n                                || ! hash_equals(strtolower((string) $existing->request_payload_hash), $previousPayloadHash)))) {",
          )
          historical_check = """                if ($previousCodeHash !== null) {
              $historicalDuplicate = $connection->table('gift_card_submissions')
                  ->where('code_lookup_hash', $previousCodeHash)
                  ->lockForUpdate()
                  ->first(['id', 'public_id']);
              if ($historicalDuplicate !== null) {
                  throw new RuntimeException('Gift-card evidence is already bound to another purchase.');
              }
          }

          """
          replace_once(
              service_path,
              "                if (! (bool) $type->active) {\n",
              historical_check + "                if (! (bool) $type->active) {\n",
          )
          replace_once(
              service_path,
              "            throw $exception;\n        }\n    }\n\n    private function recordDuplicateFindingSafely(",
              "            throw $exception;\n        } catch (RuntimeException $exception) {\n            if ($previousCodeHash !== null\n                && $exception->getMessage() === 'Gift-card evidence is already bound to another purchase.') {\n                $connection = $this->database->connection();\n                $duplicate = $connection->table('gift_card_submissions')\n                    ->where('code_lookup_hash', $previousCodeHash)\n                    ->first(['id', 'public_id']);\n                if ($duplicate !== null) {\n                    $this->recordDuplicateFindingSafely(\n                        (int) $duplicate->id,\n                        (string) $duplicate->public_id,\n                        $previousCodeHash,\n                        $correlationId,\n                    );\n                }\n            }\n\n            throw $exception;\n        }\n    }\n\n    private function recordDuplicateFindingSafely(",
          )
          previous_key_method = """    /** @return array{key:string,version:int}|null */
          private function previousLookupKey(int $currentVersion): ?array
          {
              $key = config('payments.gift_card.code_lookup_previous_key');
              $rawVersion = config('payments.gift_card.code_lookup_previous_key_version');
              $keyConfigured = is_string($key) && trim($key) !== '';
              $versionConfigured = $rawVersion !== null && $rawVersion !== '';

              if (! $keyConfigured && ! $versionConfigured) {
                  return null;
              }
              if (! $keyConfigured || strlen($key) < 32) {
                  throw new RuntimeException('Gift-card previous code lookup key is not configured securely.');
              }

              $version = filter_var($rawVersion, FILTER_VALIDATE_INT, ['options' => ['min_range' => 1]]);
              if ($version === false || (int) $version >= $currentVersion) {
                  throw new RuntimeException('Gift-card previous code lookup key version is invalid.');
              }

              return ['key' => $key, 'version' => (int) $version];
          }

          """
          replace_once(
              service_path,
              "    private function assertToken(string $value, string $label, int $minimum, int $maximum): void\n",
              previous_key_method + "    private function assertToken(string $value, string $label, int $minimum, int $maximum): void\n",
          )
          replace_once(
              'tests/Feature/GiftCardLookupKeyRotationTest.php',
              "        config()->set('payments.gift_card.code_lookup_previous_key_version', 1);\n        $second = $this->purchase('second');",
              "        config()->set('payments.gift_card.code_lookup_previous_key_version', 1);\n\n        $this->submit($first, 'first', $code);\n        self::assertSame(1, DB::table('gift_card_submissions')->count());\n\n        $second = $this->purchase('second');",
          )
          PY

          modified_php=(
            app/Modules/Payments/GiftCard/Application/GiftCardSubmissionService.php
            tests/Feature/CardToCardContentionTest.php
            tests/Feature/CardToCardMatchingTest.php
            tests/Feature/GiftCardLookupKeyRotationTest.php
            tests/Feature/GiftCardRedemptionContentionTest.php
            tests/Feature/ReferralRewardAccrualContentionVerificationTest.php
            tests/Feature/ReferralRewardLifecycleContentionVerificationTest.php
            tests/Feature/UsdtBep20PaymentFlowTest.php
            tests/Feature/UsdtBep20ReconciliationTest.php
            tests/Feature/UsdtBep20TestSupport.php
            tests/Feature/UsdtManualRateSettingTest.php
            tests/Feature/UsdtVerifiedTransferContentionTest.php
            tests/Feature/ZarinpalRequestContentionVerificationTest.php
          )
          vendor/bin/pint "${modified_php[@]}"
          git diff --check
          for file in "${modified_php[@]}"; do
            php -l "$file"
          done

      - name: Commit and push once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Expected bounded corrections, found none.' >&2; exit 1; }
          git commit -m 'fix(phase-0.5): close remaining functional validation gaps'
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"
          git push origin HEAD:task/8-phase-0.5-completion
