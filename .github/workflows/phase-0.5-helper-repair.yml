name: Phase 0.5 helper repair

on:
  push:
    branches:
      - task/8-phase-0.5-completion
    paths:
      - .github/workflows/phase-0.5-helper-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/8-phase-0.5-completion
          fetch-depth: 0
      - name: Guard staging-only drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 06d4e2be7891449f7ee9afceb2094351a94e1a87 "${GITHUB_SHA}"
          unexpected="$(git diff --name-only 06d4e2be7891449f7ee9afceb2094351a94e1a87.."${GITHUB_SHA}" | grep -Ev "^\.github/workflows/phase-0\.5-(functional-fix(-v2)?|helper-repair)\.yml$" || true)"
          test -z "$unexpected"
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"
      - name: Repair helper environment handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/phase-0.5-functional-fix-v2.yml')
          text = p.read_text()
          old_if = "    if: github.actor != 'github-actions[bot]'\n"
          if text.count(old_if) != 1:
              raise SystemExit('Unexpected v2 actor guard state.')
          text = text.replace(old_if, '', 1)
          old = "          bash scripts/ci/bootstrap-self-hosted-toolchain.sh no-coverage\n          composer install --no-interaction --prefer-dist --no-progress --no-scripts\n"
          new = "          bash scripts/ci/bootstrap-self-hosted-toolchain.sh no-coverage\n          export PATH=\"$(tail -n 1 \"$GITHUB_PATH\"):$PATH\"\n          php --version\n          composer install --no-interaction --prefer-dist --no-progress --no-scripts\n"
          if text.count(old) != 1:
              raise SystemExit('Unexpected v2 bootstrap block state.')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/phase-0.5-helper-repair.yml
          git diff --check
      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(phase-0.5): repair helper toolchain handoff'
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"
          git push origin HEAD:task/8-phase-0.5-completion
