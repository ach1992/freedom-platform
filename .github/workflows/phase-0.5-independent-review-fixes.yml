name: Phase 0.5 independent review corrections

on:
  push:
    branches:
      - task/8-phase-0.5-completion
    paths:
      - .github/workflows/phase-0.5-independent-review-fixes.yml
      - .github/phase-0.5-independent-review-fixes.py

permissions:
  contents: write

env:
  APP_ENV: testing
  APP_DEBUG: 'false'
  APP_TIMEZONE: UTC
  BUSINESS_TIMEZONE: Asia/Tehran
  APP_KEY: 'base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: '33067'
  DB_DATABASE: freedom_platform_ci
  DB_USERNAME: freedom_ci
  DB_PASSWORD: ci-only-database-password
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: '6380'
  REDIS_PASSWORD: ci-only-redis-password
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  PHP_ROOT: /www/server/php/84
  COMPOSER_BIN: /usr/local/bin/composer
  MARIADB_VERSION: '10.11'

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/8-phase-0.5-completion
          fetch-depth: 0

      - name: Guard review boundary
        shell: bash
        run: |
          set -euo pipefail
          base=916c8d23cbe68e3f41070122e8ba910562238fc8
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "$base" "${GITHUB_SHA}"
          unexpected="$(git diff --name-only "$base".."${GITHUB_SHA}" | grep -Ev '^(\.github/workflows/phase-0\.5-independent-review-fixes\.yml|\.github/phase-0\.5-independent-review-fixes\.py)$' || true)"
          test -z "$unexpected"
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"

      - name: Bootstrap PHP 8.4 and dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap-self-hosted-toolchain.sh no-coverage
          export PATH="$(tail -n 1 "$GITHUB_PATH"):$PATH"
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          php artisan package:discover --ansi

      - name: Apply independent review corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/phase-0.5-independent-review-fixes.py
          vendor/bin/pint app/Modules/Payments/NowPayments/Application/NowPaymentsPaymentService.php tests/Feature/NowPaymentsPaymentServiceTest.php app/Modules/Payments/GiftCard/Application/GiftCardSubmissionService.php tests/Feature/GiftCardLookupKeyRotationTest.php config/payments.php
          git diff --check
          php -l app/Modules/Payments/NowPayments/Application/NowPaymentsPaymentService.php
          php -l tests/Feature/NowPaymentsPaymentServiceTest.php
          php -l app/Modules/Payments/GiftCard/Application/GiftCardSubmissionService.php
          php -l tests/Feature/GiftCardLookupKeyRotationTest.php
          php -l config/payments.php

      - name: Start disposable dependencies
        shell: bash
        run: docker compose -f docker-compose.ci.yml up -d --wait

      - name: Validate targeted review regressions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(tail -n 1 "$GITHUB_PATH"):$PATH"
          test -f .env || cp .env.example .env
          php artisan config:clear --ansi
          COLUMNS=240 php vendor/bin/phpunit --configuration phpunit.xml tests/Feature/NowPaymentsPaymentServiceTest.php tests/Feature/GiftCardLookupKeyRotationTest.php

      - name: Validate static and policy gates
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(tail -n 1 "$GITHUB_PATH"):$PATH"
          composer validate --strict --no-check-publish
          php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress --error-format=table --memory-limit=1G
          bash scripts/ci/forbidden-patterns.sh
          bash scripts/ci/architecture.sh

      - name: Stop disposable dependencies
        if: always()
        shell: bash
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans || true

      - name: Commit reviewed corrections only
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(app/Modules/Payments/NowPayments/Application/NowPaymentsPaymentService.php|tests/Feature/NowPaymentsPaymentServiceTest.php|app/Modules/Payments/GiftCard/Application/GiftCardSubmissionService.php|tests/Feature/GiftCardLookupKeyRotationTest.php|config/payments.php|\.env\.example)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/Modules/Payments/NowPayments/Application/NowPaymentsPaymentService.php tests/Feature/NowPaymentsPaymentServiceTest.php app/Modules/Payments/GiftCard/Application/GiftCardSubmissionService.php tests/Feature/GiftCardLookupKeyRotationTest.php config/payments.php .env.example
          git diff --cached --quiet && { echo 'Expected review corrections, found none.' >&2; exit 1; }
          git commit -m 'fix(phase-0.5): address independent high-risk review'
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"
          git push origin HEAD:task/8-phase-0.5-completion
