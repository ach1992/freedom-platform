          php -l config/payments.php

      - name: Start disposable dependencies
        shell: bash
        run: docker compose -f docker-compose.ci.yml up -d --wait

      - name: Validate targeted review regressions
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(tail -n 1 "$GITHUB_PATH"):$PATH"
          test -f .env || cp .env.example .env
          php artisan config:clear --ansi
          COLUMNS=240 php vendor/bin/phpunit --configuration phpunit.xml \
            tests/Feature/NowPaymentsPaymentServiceTest.php \
            tests/Feature/GiftCardLookupKeyRotationTest.php

      - name: Validate static and policy gates
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(tail -n 1 "$GITHUB_PATH"):$PATH"
          composer validate --strict --no-check-publish
          php -d memory_limit=1G vendor/bin/phpstan analyse --no-progress --error-format=table --memory-limit=1G
          bash scripts/ci/forbidden-patterns.sh
          bash scripts/ci/architecture.sh

      - name: Stop disposable dependencies
        if: always()
        shell: bash
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans || true

      - name: Commit reviewed corrections only
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(app/Modules/Payments/NowPayments/Application/NowPaymentsPaymentService.php|tests/Feature/NowPaymentsPaymentServiceTest.php|app/Modules/Payments/GiftCard/Application/GiftCardSubmissionService.php|tests/Feature/GiftCardLookupKeyRotationTest.php|config/payments.php|\.env\.example)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/Modules/Payments/NowPayments/Application/NowPaymentsPaymentService.php \
            tests/Feature/NowPaymentsPaymentServiceTest.php \
            app/Modules/Payments/GiftCard/Application/GiftCardSubmissionService.php \
            tests/Feature/GiftCardLookupKeyRotationTest.php \
            config/payments.php \
            .env.example
          git diff --cached --quiet && { echo 'Expected review corrections, found none.' >&2; exit 1; }
          git commit -m 'fix(phase-0.5): address independent high-risk review'
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"
          git push origin HEAD:task/8-phase-0.5-completion
