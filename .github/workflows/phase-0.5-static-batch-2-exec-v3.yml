name: Phase 0.5 static batch 2 executor v3

on:
  push:
    branches:
      - task/8-phase-0.5-completion
    paths:
      - .github/workflows/phase-0.5-static-batch-2-exec-v3.yml

permissions:
  contents: write

jobs:
  execute:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/8-phase-0.5-completion
          fetch-depth: 0

      - name: Guard staging-only drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 95a355d19571c0fbd7aa5098d03913a4e0aba3d0 "${GITHUB_SHA}"
          unexpected="$(git diff --name-only 95a355d19571c0fbd7aa5098d03913a4e0aba3d0.."${GITHUB_SHA}" | grep -Ev '^\.github/workflows/phase-0\.5-static-batch-2(-exec(-v[23])?)?\.yml$' || true)"
          test -z "$unexpected"
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"

      - name: Bootstrap PHP 8.4
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap-self-hosted-toolchain.sh no-coverage
          export PATH="$(tail -n 1 "$GITHUB_PATH"):$PATH"
          composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Execute repaired batch manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/phase-0.5-static-batch-2.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n\n          modified_php=("
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = dedent(workflow[start:end])

          block_start = script.index('canonical_files = [')
          block_end = script.index('# NOWPayments numeric-string annotations', block_start)
          canonical = r'''canonical_docs = {
              'app/Modules/Payments/CardToCard/Infrastructure/GenericRestBankTransactionVerificationProvider.php': (
                  '/** @param array<string, mixed> $value @return array<string, mixed> */',
                  '/**\n     * @param array<string, mixed> $value\n     * @return array<string, mixed>\n     */',
              ),
              'app/Modules/Payments/GiftCard/Infrastructure/GenericRestGiftCardVerificationProvider.php': (
                  '/** @param array<string,mixed> $value @return array<string,mixed> */',
                  '/**\n     * @param array<string, mixed> $value\n     * @return array<string, mixed>\n     */',
              ),
              'app/Modules/Payments/Usdt/Infrastructure/GenericRestBlockchainTransactionVerificationProvider.php': (
                  '/** @param array<string,mixed> $value @return array<string,mixed> */',
                  '/**\n     * @param array<string, mixed> $value\n     * @return array<string, mixed>\n     */',
              ),
          }
          for path, (old, new) in canonical_docs.items():
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: canonicalize PHPDoc marker mismatch.')
              p.write_text(text.replace(old, new, 1))

          '''
          script = script[:block_start] + canonical + script[block_end:]

          stale_start = script.index('# Last functional failure is only a stale expected exception wording.')
          stale_block = script[stale_start:]
          replacement = r'''# Last functional failure is only a stale expected exception wording.
          p = Path('tests/Feature/UsdtBep20PaymentFlowTest.php')
          text = p.read_text()
          old = "self::assertStringContainsString('exact authoritative BEP20', $exception->getMessage());"
          new = "self::assertStringContainsString('exact authoritative canonical BSC-USDT', $exception->getMessage());"
          if text.count(old) != 1:
              raise SystemExit('USDT live stale message marker mismatch.')
          p.write_text(text.replace(old, new, 1))
          '''
          script = script[:stale_start] + replacement
          Path('/tmp/phase-0.5-static-batch-2.py').write_text(script)
          PY
          python3 /tmp/phase-0.5-static-batch-2.py

          mapfile -t modified_php < <(git diff --name-only -- app tests | grep '\.php$' | sort)
          test "${#modified_php[@]}" -gt 0
          vendor/bin/pint "${modified_php[@]}"
          git diff --check
          for file in "${modified_php[@]}"; do php -l "$file"; done

      - name: Verify PHPStan decreases before push
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          set +e
          vendor/bin/phpstan analyse --no-progress > build/logs/phpstan-batch-2.log 2>&1
          status=$?
          set -e
          count="$(grep -oE 'Found [0-9]+ errors' build/logs/phpstan-batch-2.log | tail -n 1 | grep -oE '[0-9]+' || true)"
          test -n "$count"
          echo "phpstan_status=$status errors=$count"
          test "$count" -lt 384

      - name: Commit product changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app tests
          git diff --cached --quiet && { echo 'Expected product corrections, found none.' >&2; exit 1; }
          git commit -m 'fix(phase-0.5): tighten remaining payment row types'
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"
          git push origin HEAD:task/8-phase-0.5-completion
