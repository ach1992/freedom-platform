name: Phase 0.5 static batch 2

on:
  push:
    branches:
      - task/8-phase-0.5-completion
    paths:
      - .github/workflows/phase-0.5-static-batch-2.yml

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/8-phase-0.5-completion
          fetch-depth: 0

      - name: Guard staging-only drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 95a355d19571c0fbd7aa5098d03913a4e0aba3d0 "${GITHUB_SHA}"
          unexpected="$(git diff --name-only 95a355d19571c0fbd7aa5098d03913a4e0aba3d0.."${GITHUB_SHA}" | grep -Ev '^\.github/workflows/phase-0\.5-static-batch-2\.yml$' || true)"
          test -z "$unexpected"
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"

      - name: Bootstrap PHP 8.4
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap-self-hosted-toolchain.sh no-coverage
          export PATH="$(tail -n 1 "$GITHUB_PATH"):$PATH"
          composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Apply bounded type corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def add_import(text: str, import_line: str) -> str:
              if import_line in text:
                  return text
              final_pos = text.find('\nfinal ')
              if final_pos < 0:
                  raise SystemExit('Unable to find final class marker.')
              last_use = text.rfind('\nuse ', 0, final_pos)
              if last_use < 0:
                  raise SystemExit('Unable to find import block.')
              line_end = text.find('\n', last_use + 1)
              return text[:line_end + 1] + import_line + text[line_end + 1:]

          def db_rows(path: str) -> None:
              p = Path(path)
              text = p.read_text()
              if 'object{' in text:
                  raise SystemExit(f'{path}: object-shape present; refusing broad DB-row conversion.')
              before = text
              text = add_import(text, 'use stdClass;\n')
              text = re.sub(r'\bobject (?=\$)', 'stdClass ', text)
              text = text.replace('?object', '?stdClass')
              text = text.replace(': object', ': stdClass')
              text = text.replace('list<object>', 'list<stdClass>')
              text = text.replace('array<object>', 'array<stdClass>')
              if text == before:
                  raise SystemExit(f'{path}: expected DB-row object types, found none.')
              p.write_text(text)

          pure_row_files = [
              'app/Modules/Payments/CardToCard/Application/CardToCardBankTransactionService.php',
              'app/Modules/Payments/CardToCard/Application/CardToCardDestinationService.php',
              'app/Modules/Payments/CardToCard/Application/CardToCardManualSubmissionService.php',
              'app/Modules/Payments/CardToCard/Application/CardToCardMatchingService.php',
              'app/Modules/Payments/CardToCard/Application/CardToCardSettlementService.php',
              'app/Modules/Payments/GiftCard/Application/GiftCardReconciliationService.php',
              'app/Modules/Payments/GiftCard/Application/GiftCardRedemptionService.php',
              'app/Modules/Payments/GiftCard/Application/GiftCardReleaseService.php',
              'app/Modules/Payments/GiftCard/Application/GiftCardReviewDecisionService.php',
              'app/Modules/Payments/GiftCard/Application/GiftCardSubmissionService.php',
              'app/Modules/Payments/GiftCard/Application/GiftCardTypeService.php',
              'app/Modules/Payments/Usdt/Application/UsdtManualRateSettingService.php',
              'app/Modules/Payments/Usdt/Application/UsdtManualReviewDecisionService.php',
              'app/Modules/Payments/Usdt/Application/UsdtPaymentAuthorityService.php',
              'app/Modules/Payments/Usdt/Application/UsdtReconciliationService.php',
              'app/Modules/Payments/Usdt/Application/UsdtTxidSubmissionService.php',
              'app/Modules/Payments/Usdt/Application/UsdtVerifiedTransferService.php',
          ]
          for file in pure_row_files:
              db_rows(file)

          # CardToCardPaymentService mixes a domain receipt with DB rows; type each boundary precisely.
          p = Path('app/Modules/Payments/CardToCard/Application/CardToCardPaymentService.php')
          text = p.read_text()
          text = add_import(text, 'use App\\Modules\\Payments\\Application\\PurchasePaymentIntentReceipt;\n')
          text = add_import(text, 'use stdClass;\n')
          replacements = {
              '/** @var list<object> $destinations */': '/** @var list<stdClass> $destinations */',
              'private function reserveOnDestination(Connection $connection, int $intentId, int $baseAmountIrr, object $destination): ?object': 'private function reserveOnDestination(Connection $connection, int $intentId, int $baseAmountIrr, stdClass $destination): ?stdClass',
              'private function destinationHasDailyCapacity(Connection $connection, object $destination, int $baseAmountIrr): bool': 'private function destinationHasDailyCapacity(Connection $connection, stdClass $destination, int $baseAmountIrr): bool',
              'private function receipt(Connection $connection, object $intent, object $reservation, bool $replayed): CardToCardPaymentReceipt': 'private function receipt(Connection $connection, PurchasePaymentIntentReceipt $intent, stdClass $reservation, bool $replayed): CardToCardPaymentReceipt',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'CardToCardPaymentService marker mismatch: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          # Preserve the existing precise object shape through the wallet helper boundary.
          p = Path('app/Modules/Wallet/Application/WalletAccountProvisioningService.php')
          text = p.read_text()
          marker = '    private function validatedAccountId(object $account, int $userId): int\n'
          replacement = '    /** @param object{id:int|string,code:string,account_class:string,owner_user_id:int|string|null,wallet_bucket:string|null,currency:string,is_active:int|bool} $account */\n    private function validatedAccountId(object $account, int $userId): int\n'
          if text.count(marker) != 1:
              raise SystemExit('Wallet shape boundary marker mismatch.')
          p.write_text(text.replace(marker, replacement, 1))

          # Remaining simple typed findings from exact-head #2061.
          for path, old, new in [
              ('app/Modules/Payments/GiftCard/Application/GiftCardReleaseService.php', '$evidence?->providerEventId ??', '$evidence->providerEventId ??'),
              ('app/Modules/Payments/GiftCard/Application/GiftCardReleaseService.php', '$evidence?->providerTransactionId ??', '$evidence->providerTransactionId ??'),
              ('app/Modules/Payments/GiftCard/Application/GiftCardReleaseService.php', '$evidence?->evidenceHash ??', '$evidence->evidenceHash ??'),
              ('app/Modules/Payments/Usdt/Application/UsdtReconciliationService.php', '$evidence?->providerEventId ??', '$evidence->providerEventId ??'),
              ('app/Modules/Payments/Usdt/Application/UsdtReconciliationService.php', '$evidence?->evidenceHash ??', '$evidence->evidenceHash ??'),
              ('app/Modules/Payments/Usdt/Application/UsdtVerifiedTransferService.php', '$evidence?->providerEventId ??', '$evidence->providerEventId ??'),
              ('app/Modules/Payments/Usdt/Application/UsdtVerifiedTransferService.php', '$evidence?->evidenceHash ??', '$evidence->evidenceHash ??'),
          ]:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: missing nullsafe marker {old}')
              p.write_text(text.replace(old, new, 1))

          # Manual rate validator returns a numeric-string by construction.
          p = Path('app/Modules/Payments/Usdt/Application/UsdtManualRateSettingService.php')
          text = p.read_text()
          marker = '    private function validatedRate(string $rateIrr): string\n'
          if text.count(marker) != 1:
              raise SystemExit('USDT validatedRate marker mismatch.')
          text = text.replace(marker, '    /** @return numeric-string */\n    private function validatedRate(string $rateIrr): string\n', 1)
          p.write_text(text)

          # canonicalize() already has a precise return union; expose it to PHPStan with normal multiline PHPDoc.
          canonical_files = [
              'app/Modules/Payments/CardToCard/Infrastructure/GenericRestBankTransactionVerificationProvider.php',
              'app/Modules/Payments/GiftCard/Infrastructure/GenericRestGiftCardVerificationProvider.php',
              'app/Modules/Payments/Usdt/Infrastructure/GenericRestBlockchainTransactionVerificationProvider.php',
          ]
          for path in canonical_files:
              p = Path(path)
              text = p.read_text()
              pattern = re.compile(r'/\*\* @param mixed \$value @return ([^*]+?) \*/\n(\s*private function canonicalize\(mixed \$value\): mixed)')
              match = pattern.search(text)
              if match is None:
                  raise SystemExit(f'{path}: canonicalize PHPDoc marker mismatch.')
              doc = '/**\n     * @param mixed $value\n     * @return ' + match.group(1).strip() + '\n     */\n' + match.group(2)
              p.write_text(text[:match.start()] + doc + text[match.end():])

          # NOWPayments numeric-string annotations follow strict decimal validation; no runtime relaxation.
          p = Path('app/Modules/Payments/NowPayments/Application/NowPaymentsDecimal.php')
          text = p.read_text()
          marker = "        $normalized = bcadd($value, '0', $precision);\n"
          if text.count(marker) != 1:
              raise SystemExit('NOWPayments normalize marker mismatch.')
          text = text.replace(marker, "        /** @var numeric-string $value */\n        $normalized = bcadd($value, '0', $precision);\n", 1)
          marker = "        $trimmed = rtrim(rtrim($normalized, '0'), '.');\n\n        return $trimmed === '' ? '0' : $trimmed;\n"
          replacement = "        $trimmed = rtrim(rtrim($normalized, '0'), '.');\n        $result = $trimmed === '' ? '0' : $trimmed;\n        /** @var numeric-string $result */\n\n        return $result;\n"
          if text.count(marker) != 1:
              raise SystemExit('NOWPayments jsonNumber marker mismatch.')
          p.write_text(text.replace(marker, replacement, 1))

          # Last functional failure is only a stale expected exception wording.
          p = Path('tests/Feature/UsdtBep20PaymentFlowTest.php')
          text = p.read_text()
          old = "USDT verified settlement requires exact authoritative transfer evidence."
          new = "USDT verified settlement requires exact authoritative canonical BSC-USDT transfer evidence."
          if text.count(old) != 1:
              raise SystemExit('USDT stale message marker mismatch.')
          p.write_text(text.replace(old, new, 1))
          PY

          modified_php=(
            app/Modules/Payments/CardToCard/Application/CardToCardBankTransactionService.php
            app/Modules/Payments/CardToCard/Application/CardToCardDestinationService.php
            app/Modules/Payments/CardToCard/Application/CardToCardManualSubmissionService.php
            app/Modules/Payments/CardToCard/Application/CardToCardMatchingService.php
            app/Modules/Payments/CardToCard/Application/CardToCardPaymentService.php
            app/Modules/Payments/CardToCard/Application/CardToCardSettlementService.php
            app/Modules/Payments/CardToCard/Infrastructure/GenericRestBankTransactionVerificationProvider.php
            app/Modules/Payments/GiftCard/Application/GiftCardReconciliationService.php
            app/Modules/Payments/GiftCard/Application/GiftCardRedemptionService.php
            app/Modules/Payments/GiftCard/Application/GiftCardReleaseService.php
            app/Modules/Payments/GiftCard/Application/GiftCardReviewDecisionService.php
            app/Modules/Payments/GiftCard/Application/GiftCardSubmissionService.php
            app/Modules/Payments/GiftCard/Application/GiftCardTypeService.php
            app/Modules/Payments/GiftCard/Infrastructure/GenericRestGiftCardVerificationProvider.php
            app/Modules/Payments/NowPayments/Application/NowPaymentsDecimal.php
            app/Modules/Payments/Usdt/Application/UsdtManualRateSettingService.php
            app/Modules/Payments/Usdt/Application/UsdtManualReviewDecisionService.php
            app/Modules/Payments/Usdt/Application/UsdtPaymentAuthorityService.php
            app/Modules/Payments/Usdt/Application/UsdtReconciliationService.php
            app/Modules/Payments/Usdt/Application/UsdtTxidSubmissionService.php
            app/Modules/Payments/Usdt/Application/UsdtVerifiedTransferService.php
            app/Modules/Payments/Usdt/Infrastructure/GenericRestBlockchainTransactionVerificationProvider.php
            app/Modules/Wallet/Application/WalletAccountProvisioningService.php
            tests/Feature/UsdtBep20PaymentFlowTest.php
          )
          vendor/bin/pint "${modified_php[@]}"
          git diff --check
          for file in "${modified_php[@]}"; do php -l "$file"; done

      - name: Verify PHPStan decreases before push
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          set +e
          vendor/bin/phpstan analyse --no-progress > build/logs/phpstan-batch-2.log 2>&1
          status=$?
          set -e
          count="$(grep -oE 'Found [0-9]+ errors' build/logs/phpstan-batch-2.log | tail -n 1 | grep -oE '[0-9]+' || true)"
          test -n "$count"
          echo "phpstan_status=$status errors=$count"
          test "$count" -lt 384

      - name: Commit and push once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Expected bounded corrections, found none.' >&2; exit 1; }
          git commit -m 'fix(phase-0.5): tighten remaining payment row types'
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"
          git push origin HEAD:task/8-phase-0.5-completion
