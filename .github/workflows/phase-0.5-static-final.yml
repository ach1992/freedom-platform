name: Phase 0.5 final static correction

on:
  push:
    branches:
      - task/8-phase-0.5-completion
    paths:
      - .github/workflows/phase-0.5-static-final.yml

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/8-phase-0.5-completion
          fetch-depth: 0

      - name: Guard exact validated parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor f0aa75143c0330ff35466453c523bab92fcf5f72 "${GITHUB_SHA}"
          unexpected="$(git diff --name-only f0aa75143c0330ff35466453c523bab92fcf5f72.."${GITHUB_SHA}" | grep -Ev '^\.github/workflows/phase-0\.5-static-final\.yml$' || true)"
          test -z "$unexpected"
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"

      - name: Bootstrap PHP 8.4
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap-self-hosted-toolchain.sh no-coverage
          export PATH="$(tail -n 1 "$GITHUB_PATH"):$PATH"
          composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Apply exact-head static corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old!r}')
              p.write_text(text.replace(old, new))

          # Referral accrual: query-builder rows cross private boundaries as stdClass.
          accrual = Path('app/Modules/Promotions/Application/ReferralRewardAccrualService.php')
          text = accrual.read_text()
          if 'use stdClass;\n' in text:
              raise SystemExit('ReferralRewardAccrualService already imports stdClass unexpectedly.')
          text = text.replace('use RuntimeException;\n', 'use RuntimeException;\nuse stdClass;\n', 1)
          if text.count('?object') != 2:
              raise SystemExit(f'ReferralRewardAccrualService expected two nullable object boundaries, found {text.count("?object")}.')
          text = text.replace('?object', '?stdClass')
          if text.count('static fn (object $row)') != 2:
              raise SystemExit('ReferralRewardAccrualService winner row closure count changed.')
          text = text.replace('static fn (object $row)', 'static fn (stdClass $row)')
          for old, new in [
              ('private function capacityAvailable(Connection $connection, object $rule,', 'private function capacityAvailable(Connection $connection, stdClass $rule,'),
              ('private function calculateReward(object $rule,', 'private function calculateReward(stdClass $rule,'),
              ('private function receipt(Connection $connection, object $row,', 'private function receipt(Connection $connection, stdClass $row,'),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f'ReferralRewardAccrualService marker mismatch: {old}')
              text = text.replace(old, new, 1)
          old_ids = """        $rewardPublicIds = $connection->table('referral_rewards')
              ->where('accrual_id', $this->positiveInt($row->id, 'Referral reward accrual ID'))
              ->orderBy('recipient_role')
              ->pluck('public_id')
              ->map(static fn (mixed $value): string => (string) $value)
              ->all();
          """
          new_ids = """        $rewardPublicIds = array_values($connection->table('referral_rewards')
              ->where('accrual_id', $this->positiveInt($row->id, 'Referral reward accrual ID'))
              ->orderBy('recipient_role')
              ->pluck('public_id')
              ->map(static fn (mixed $value): string => (string) $value)
              ->all());
          """
          if text.count(old_ids) != 1:
              raise SystemExit('ReferralRewardAccrualService reward ID list marker mismatch.')
          accrual.write_text(text.replace(old_ids, new_ids, 1))

          # Referral lifecycle: reward/refund rows are query-builder stdClass values.
          lifecycle = Path('app/Modules/Promotions/Application/ReferralRewardLifecycleService.php')
          text = lifecycle.read_text()
          if 'use stdClass;\n' in text:
              raise SystemExit('ReferralRewardLifecycleService already imports stdClass unexpectedly.')
          text = text.replace('use RuntimeException;\n', 'use RuntimeException;\nuse stdClass;\n', 1)
          text = text.replace('/** @var list<object> $rewards */', '/** @var list<stdClass> $rewards */')
          text = text.replace('/** @var object{id:int|string,public_id:string,purchase_settlement_id:int|string}|null $refund */', '/** @var stdClass|null $refund */')
          text = text.replace('/** @var object|null $reward */', '/** @var stdClass|null $reward */')
          reward_count = text.count('object $reward')
          refund_count = text.count('object $refund')
          if reward_count < 5 or refund_count < 3:
              raise SystemExit(f'ReferralRewardLifecycleService boundary count changed: reward={reward_count} refund={refund_count}')
          text = text.replace('object $reward', 'stdClass $reward')
          text = text.replace('object $refund', 'stdClass $refund')
          if text.count(': object') != 1:
              raise SystemExit(f'ReferralRewardLifecycleService expected one non-null object return, found {text.count(": object")}.')
          text = text.replace(': object', ': stdClass')
          if text.count('?object') != 2:
              raise SystemExit(f'ReferralRewardLifecycleService expected two nullable object returns, found {text.count("?object")}.')
          text = text.replace('?object', '?stdClass')
          lifecycle.write_text(text)

          # Numeric-string narrowing after existing strict validation.
          replace_exact(
              'app/Modules/Payments/NowPayments/Application/NowPaymentsDecimal.php',
              "        /** @var numeric-string $value */\n        $normalized = bcadd($value, '0', $precision);",
              "        if (! is_numeric($value)) {\n            throw new DomainException('NOWPayments decimal value is invalid.');\n        }\n        $normalized = bcadd($value, '0', $precision);",
          )
          replace_exact(
              'app/Modules/Payments/NowPayments/Application/NowPaymentsDecimal.php',
              "        $result = $trimmed === '' ? '0' : $trimmed;\n        /** @var numeric-string $result */\n\n        return $result;",
              "        $result = $trimmed === '' ? '0' : $trimmed;\n        if (! is_numeric($result)) {\n            throw new DomainException('NOWPayments decimal JSON value is invalid.');\n        }\n\n        return $result;",
          )
          replace_exact(
              'app/Modules/Payments/NowPayments/Infrastructure/HttpNowPaymentsTransport.php',
              "        $normalized = bcadd($value, '0', $precision);",
              "        if (! is_numeric($value)) {\n            throw new RuntimeException('NOWPayments non-negative decimal value is invalid.');\n        }\n        $normalized = bcadd($value, '0', $precision);",
          )
          replace_exact(
              'app/Modules/Payments/Usdt/Infrastructure/WallexUsdtRateProvider.php',
              "        $canonicalToman = $matches[1].($fraction === '' ? '' : '.'.$fraction);\n        $irr = bcmul($canonicalToman, '10', 8);",
              "        $canonicalToman = $matches[1].($fraction === '' ? '' : '.'.$fraction);\n        if (! is_numeric($canonicalToman)) {\n            throw new RuntimeException('Wallex USDTTMN price is invalid.');\n        }\n        $irr = bcmul($canonicalToman, '10', 8);",
          )

          # Race recovery must perform a fresh query instead of reusing PHPStan's prior exists() fact.
          replace_exact(
              'app/Modules/Payments/NowPayments/Application/NowPaymentsIpnIngressService.php',
              "                if (! $transaction->table('nowpayments_payment_observations')->where('event_key', $eventKey)->exists()) {\n                    throw $exception;\n                }",
              "                if ($transaction->table('nowpayments_payment_observations')->where('event_key', $eventKey)->first(['id']) === null) {\n                    throw $exception;\n                }",
          )

          # Iterable value types are known JSON/request maps.
          replace_exact(
              'app/Modules/Payments/NowPayments/Application/NowPaymentsIpnVerifier.php',
              "    public function paymentId(array $payload): string\n",
              "    /** @param array<string, mixed> $payload */\n    public function paymentId(array $payload): string\n",
          )
          replace_exact(
              'app/Modules/Payments/Zarinpal/Infrastructure/HttpZarinpalTransport.php',
              "    private function post(string $url, array $payload): ?Response\n",
              "    /** @param array<string, mixed> $payload */\n    private function post(string $url, array $payload): ?Response\n",
          )

          # QueryException extends RuntimeException; keep duplicate-TXID collision handling reachable by ordering it first.
          txid = Path('app/Modules/Payments/Usdt/Application/UsdtTxidSubmissionService.php')
          text = txid.read_text()
          runtime_block = """        } catch (RuntimeException $exception) {
              if ($exception->getMessage() === 'USDT TXID is already bound to another payment authority.') {
                  $duplicate = $this->database->connection()->table('usdt_txid_submissions')->where('txid', $txid)->first(['id']);
                  if ($duplicate !== null) {
                      $this->recordDuplicateFinding((int) $duplicate->id, $txid, $correlationId);
                  }
              }
              throw $exception;
          } catch (QueryException $exception) {
              $duplicate = $this->database->connection()->table('usdt_txid_submissions')->where('txid', $txid)->first(['id']);
              if ($duplicate !== null) {
                  $this->recordDuplicateFinding((int) $duplicate->id, $txid, $correlationId);
                  throw new RuntimeException('USDT TXID is already bound to another payment authority.', 0, $exception);
              }
              throw $exception;
          }
          """
          reordered = """        } catch (QueryException $exception) {
              $duplicate = $this->database->connection()->table('usdt_txid_submissions')->where('txid', $txid)->first(['id']);
              if ($duplicate !== null) {
                  $this->recordDuplicateFinding((int) $duplicate->id, $txid, $correlationId);
                  throw new RuntimeException('USDT TXID is already bound to another payment authority.', 0, $exception);
              }
              throw $exception;
          } catch (RuntimeException $exception) {
              if ($exception->getMessage() === 'USDT TXID is already bound to another payment authority.') {
                  $duplicate = $this->database->connection()->table('usdt_txid_submissions')->where('txid', $txid)->first(['id']);
                  if ($duplicate !== null) {
                      $this->recordDuplicateFinding((int) $duplicate->id, $txid, $correlationId);
                  }
              }
              throw $exception;
          }
          """
          if text.count(runtime_block) != 1:
              raise SystemExit('UsdtTxidSubmissionService catch block marker mismatch.')
          txid.write_text(text.replace(runtime_block, reordered, 1))

          # Only two internal states are accepted; literal match arms preserve literal-string SQL interpolation.
          migration = Path('database/migrations/2026_08_14_000960_bridge_card_to_card_payable_settlement.php')
          text = migration.read_text()
          old_state = "        $state = str_replace(\"'\", \"''\", $intentState);"
          new_state = """        $state = match ($intentState) {
              'awaiting_user_action' => 'awaiting_user_action',
              'created' => 'created',
              default => throw new RuntimeException('Unsupported C2C payment intent state.'),
          };"""
          if text.count(old_state) != 2:
              raise SystemExit(f'C2C migration expected two dynamic-state guards, found {text.count(old_state)}.')
          migration.write_text(text.replace(old_state, new_state))
          PY

          mapfile -t modified_php < <(git diff --name-only -- app database | grep '\.php$' | sort)
          test "${#modified_php[@]}" -gt 0
          vendor/bin/pint "${modified_php[@]}"
          git diff --check
          for file in "${modified_php[@]}"; do php -l "$file"; done

      - name: Require zero PHPStan errors before push
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          set +e
          vendor/bin/phpstan analyse --no-progress --error-format=json > build/logs/phpstan-final.json 2> build/logs/phpstan-final.stderr
          status=$?
          set -e
          count="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('build/logs/phpstan-final.json').read_text())
          totals = data.get('totals', {})
          print(int(totals.get('errors', 0)) + int(totals.get('file_errors', 0)))
          PY
          )"
          echo "phpstan_status=$status errors=$count"
          if [[ "$status" -ne 0 || "$count" -ne 0 ]]; then
            cat build/logs/phpstan-final.json
            cat build/logs/phpstan-final.stderr >&2
            exit 1
          fi

      - name: Commit product changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app database
          git diff --cached --quiet && { echo 'Expected final static corrections, found none.' >&2; exit 1; }
          git commit -m 'fix(phase-0.5): close final static analysis gaps'
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"
          git push origin HEAD:task/8-phase-0.5-completion
