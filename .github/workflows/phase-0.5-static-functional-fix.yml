name: Phase 0.5 bounded static and functional correction

on:
  push:
    branches:
      - task/8-phase-0.5-completion
    paths:
      - .github/workflows/phase-0.5-static-functional-fix.yml

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/8-phase-0.5-completion
          fetch-depth: 0

      - name: Guard staging-only drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 6fbf56c5227061c9281e821b15e84f915b656dc3 "${GITHUB_SHA}"
          unexpected="$(git diff --name-only 6fbf56c5227061c9281e821b15e84f915b656dc3.."${GITHUB_SHA}" | grep -Ev '^\.github/workflows/phase-0\.5-static-functional-fix\.yml$' || true)"
          test -z "$unexpected"
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"

      - name: Bootstrap PHP 8.4 toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap-self-hosted-toolchain.sh no-coverage
          export PATH="$(tail -n 1 "$GITHUB_PATH"):$PATH"
          php --version
          composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Apply bounded corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          # The selected services use `object` exclusively for Query Builder rows.
          row_files = [
              'app/Modules/Payments/NowPayments/Application/NowPaymentsPaymentService.php',
              'app/Modules/Payments/GiftCard/Application/GiftCardPaymentService.php',
              'app/Modules/Payments/Zarinpal/Application/ZarinpalPaymentService.php',
              'app/Modules/Payments/Application/PurchaseRefundService.php',
              'app/Modules/Payments/Usdt/Application/UsdtBlockchainVerificationService.php',
          ]
          for path in row_files:
              p = Path(path)
              text = p.read_text()
              if 'use stdClass;\n' in text:
                  raise SystemExit(f'{path}: stdClass import already present unexpectedly.')
              marker = 'use RuntimeException;\n'
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: RuntimeException import marker is not unique.')
              text = text.replace(marker, marker + 'use stdClass;\n', 1)
              count = len(re.findall(r'\bobject\b', text))
              if count < 1:
                  raise SystemExit(f'{path}: expected DB-row object types.')
              text = re.sub(r'\bobject\b', 'stdClass', text)
              p.write_text(text)

          # Typed issues proven by exact-head PHPStan #2058.
          replace_once(
              'app/Modules/Payments/GiftCard/Application/GiftCardPaymentService.php',
              '    private function beginProviderMutation(string $submissionPublicId, string $operation, array $fromStates, string $toState): GiftCardProviderRequest\n',
              '    /** @param list<string> $fromStates */\n    private function beginProviderMutation(string $submissionPublicId, string $operation, array $fromStates, string $toState): GiftCardProviderRequest\n',
          )
          replace_once(
              'app/Modules/Payments/Application/PurchaseRefundService.php',
              '    /** @param array<string, scalar|null> $safeEvidence @return array<string, scalar|null> */\n    private function normalizeSafeEvidence(array $safeEvidence): array\n',
              '    /**\n     * @param array<string, scalar|null> $safeEvidence\n     * @return array<string, scalar|null>\n     */\n    private function normalizeSafeEvidence(array $safeEvidence): array\n',
          )
          replace_once(
              'app/Modules/Payments/Zarinpal/Application/ZarinpalPaymentService.php',
              '    private function updateRequestState(\n        Connection $connection,\n        stdClass $request,\n        ZarinpalRequestState $to,\n        array $extra = [],\n    ): void {\n',
              '    /** @param array<string, int|string|null> $extra */\n    private function updateRequestState(\n        Connection $connection,\n        stdClass $request,\n        ZarinpalRequestState $to,\n        array $extra = [],\n    ): void {\n',
          )
          replace_once(
              'app/Modules/Payments/Usdt/Application/UsdtBlockchainVerificationService.php',
              "$evidence?->providerEventId ?? '', $evidence?->evidenceHash ?? ''",
              "$evidence->providerEventId ?? '', $evidence->evidenceHash ?? ''",
          )

          # PHPStan remembers the pre-insert exists() result. Use a fresh row lookup only in race recovery.
          replace_once(
              'app/Modules/Payments/NowPayments/Application/NowPaymentsPaymentService.php',
              "            if (! $connection->table('nowpayments_payment_observations')->where('event_key', $eventKey)->exists()) {\n                throw $exception;\n            }",
              "            if ($connection->table('nowpayments_payment_observations')->where('event_key', $eventKey)->first(['id']) === null) {\n                throw $exception;\n            }",
          )
          replace_once(
              'app/Modules/Payments/NowPayments/Application/NowPaymentsPaymentService.php',
              "            if (! $connection->table('nowpayments_reconciliation_findings')->where('finding_key', $findingKey)->exists()) {\n                throw $exception;\n            }",
              "            if ($connection->table('nowpayments_reconciliation_findings')->where('finding_key', $findingKey)->first(['id']) === null) {\n                throw $exception;\n            }",
          )
          replace_once(
              'app/Modules/Payments/Zarinpal/Application/ZarinpalPaymentService.php',
              "            if ($connection->table('zarinpal_payment_observations')->where('event_key', $eventKey)->exists()) {\n                return;\n            }\n            throw $exception;",
              "            if ($connection->table('zarinpal_payment_observations')->where('event_key', $eventKey)->first(['id']) !== null) {\n                return;\n            }\n            throw $exception;",
          )

          # Common payment safe evidence intentionally rejects keys containing `token`; token authority remains in chain event storage.
          replace_once(
              'app/Modules/Payments/Usdt/Application/UsdtVerifiedTransferService.php',
              "                    'txid' => (string) $authority->txid,\n                    'token_contract' => UsdtBep20Asset::TOKEN_CONTRACT,\n",
              "                    'txid' => (string) $authority->txid,\n",
          )

          # Remaining exact-head functional contract drift from #2058.
          gift = Path('tests/Feature/GiftCardRedemptionContentionTest.php')
          gift_text = gift.read_text()
          for evidence_hash in ['gift-contention-validate-evidence', 'gift-contention-uncertain-evidence']:
              old = "                now('UTC'),\n                hash('sha256', '" + evidence_hash + "'),"
              new = "                now('UTC')->toDateTimeImmutable(),\n                hash('sha256', '" + evidence_hash + "'),"
              if gift_text.count(old) != 1:
                  raise SystemExit(f'GiftCard contention DateTime marker missing: {evidence_hash}')
              gift_text = gift_text.replace(old, new, 1)
          gift.write_text(gift_text)

          flow = 'tests/Feature/UsdtBep20PaymentFlowTest.php'
          replace_once(flow, 'private function evidence(string $txid, int $amountBaseUnits,', 'private function evidence(string $txid, string $amountBaseUnits,')
          replace_once(flow, "$payment['expected_base_units'] - 1", "bcsub($payment['expected_base_units'], '1', 0)")
          replace_once(flow, "            56,\n            '0x'.str_repeat('aa', 20),\n            '0x'.str_repeat('bb', 20),\n            $amountBaseUnits,\n            6,", "            UsdtBep20Asset::CHAIN_ID,\n            UsdtBep20Asset::TOKEN_CONTRACT,\n            '0x'.str_repeat('bb', 20),\n            $amountBaseUnits,\n            UsdtBep20Asset::TOKEN_DECIMALS,")

          recon = 'tests/Feature/UsdtBep20ReconciliationTest.php'
          replace_once(recon, 'private function successEvidence(string $txid, int $amountBaseUnits,', 'private function successEvidence(string $txid, string $amountBaseUnits,')
          replace_once(recon, "            56,\n            '0x'.str_repeat('aa', 20),\n            '0x'.str_repeat('bb', 20),\n            $amountBaseUnits,\n            6,", "            UsdtBep20Asset::CHAIN_ID,\n            UsdtBep20Asset::TOKEN_CONTRACT,\n            '0x'.str_repeat('bb', 20),\n            $amountBaseUnits,\n            UsdtBep20Asset::TOKEN_DECIMALS,")
          PY

          modified_php=(
            app/Modules/Payments/Application/PurchaseRefundService.php
            app/Modules/Payments/GiftCard/Application/GiftCardPaymentService.php
            app/Modules/Payments/NowPayments/Application/NowPaymentsPaymentService.php
            app/Modules/Payments/Usdt/Application/UsdtBlockchainVerificationService.php
            app/Modules/Payments/Usdt/Application/UsdtVerifiedTransferService.php
            app/Modules/Payments/Zarinpal/Application/ZarinpalPaymentService.php
            tests/Feature/GiftCardRedemptionContentionTest.php
            tests/Feature/UsdtBep20PaymentFlowTest.php
            tests/Feature/UsdtBep20ReconciliationTest.php
          )
          vendor/bin/pint "${modified_php[@]}"
          git diff --check
          for file in "${modified_php[@]}"; do php -l "$file"; done

      - name: Prove static reduction before push
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          set +e
          vendor/bin/phpstan analyse --no-progress --error-format=raw > build/logs/phase-0.5-static-after.log 2>&1
          status=$?
          set -e
          errors="$(grep -c '^/' build/logs/phase-0.5-static-after.log || true)"
          echo "phpstan_status=$status errors=$errors"
          test "$errors" -lt 709
          test "$errors" -le 400

      - name: Commit and push once
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Expected bounded corrections, found none.' >&2; exit 1; }
          git commit -m 'fix(phase-0.5): tighten DB row types and remaining contracts'
          git fetch origin task/8-phase-0.5-completion
          test "$(git rev-parse origin/task/8-phase-0.5-completion)" = "${GITHUB_SHA}"
          git push origin HEAD:task/8-phase-0.5-completion
