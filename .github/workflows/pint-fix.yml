name: One-time Phase 0.5 CI correction

on:
  push:
    branches:
      - task/8-phase-0.5-completion
    paths:
      - .github/workflows/pint-fix.yml

permissions:
  contents: write

concurrency:
  group: phase-0.5-one-time-correction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 30
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git branch --show-current)" = "task/8-phase-0.5-completion"
          test -z "$(git status --porcelain)"

      - name: Bootstrap PHP toolchain
        run: bash scripts/ci/bootstrap-self-hosted-toolchain.sh no-coverage

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Apply bounded CI corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'database/migrations/2026_08_14_000800_create_zarinpal_payment_authority.php': [
                  (
                      "$table->foreignId('zarinpal_payment_request_id')->unique();",
                      "$table->foreignId('zarinpal_payment_request_id');\n            $table->unique('zarinpal_payment_request_id', 'zpv_request_unique');",
                  ),
                  (
                      "$table->foreignId('zarinpal_payment_request_id')->constrained('zarinpal_payment_requests')->restrictOnDelete();",
                      "$table->foreignId('zarinpal_payment_request_id');\n            $table->foreign('zarinpal_payment_request_id', 'zpo_request_fk')\n                ->references('id')\n                ->on('zarinpal_payment_requests')\n                ->restrictOnDelete();",
                  ),
              ],
              'database/migrations/2026_08_14_000900_create_card_to_card_amount_authority.php': [
                  (
                      "Schema::create('c2c_destination_account_events', function (Blueprint $table): void {\n            $table->bigIncrements('id');\n            $table->foreignId('c2c_destination_account_id')->constrained('c2c_destination_accounts')->restrictOnDelete();",
                      "Schema::create('c2c_destination_account_events', function (Blueprint $table): void {\n            $table->bigIncrements('id');\n            $table->foreignId('c2c_destination_account_id');\n            $table->foreign('c2c_destination_account_id', 'c2c_dest_event_account_fk')\n                ->references('id')\n                ->on('c2c_destination_accounts')\n                ->restrictOnDelete();",
                  ),
              ],
              'database/migrations/2026_08_14_001030_create_gift_card_reconciliation_findings.php': [
                  (
                      "$table->foreignId('gift_card_submission_id')->constrained('gift_card_submissions')->restrictOnDelete();",
                      "$table->foreignId('gift_card_submission_id');\n            $table->foreign('gift_card_submission_id', 'gift_card_recon_submission_fk')\n                ->references('id')\n                ->on('gift_card_submissions')\n                ->restrictOnDelete();",
                  ),
              ],
              'database/migrations/2026_08_14_001150_create_nowpayments_payment_authority.php': [
                  (
                      "$table->foreignId('nowpayments_payment_authority_id')->constrained('nowpayments_payment_authorities')->restrictOnDelete();",
                      "$table->foreignId('nowpayments_payment_authority_id');\n            $table->foreign('nowpayments_payment_authority_id', 'nowpayments_observation_authority_fk')\n                ->references('id')\n                ->on('nowpayments_payment_authorities')\n                ->restrictOnDelete();",
                  ),
              ],
              'database/migrations/2026_08_14_001152_create_nowpayments_reconciliation_findings.php': [
                  (
                      "$table->foreignId('nowpayments_payment_authority_id')->constrained('nowpayments_payment_authorities')->restrictOnDelete();",
                      "$table->foreignId('nowpayments_payment_authority_id');\n            $table->foreign('nowpayments_payment_authority_id', 'nowpayments_finding_authority_fk')\n                ->references('id')\n                ->on('nowpayments_payment_authorities')\n                ->restrictOnDelete();",
                  ),
              ],
              'tests/Feature/UsdtGenericRestBlockchainProviderTest.php': [
                  (
                      'self::assertSame(1_000_000, $evidence->amountBaseUnits);',
                      "self::assertSame('1000000', $evidence->amountBaseUnits);",
                  ),
                  (
                      "$this->expectExceptionMessage('must be an integer, never a float');",
                      "$this->expectExceptionMessage('must be an integer string, never a float');",
                  ),
              ],
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{file_name}: expected exactly one replacement target, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

          git diff --check
          php -l database/migrations/2026_08_14_000800_create_zarinpal_payment_authority.php
          php -l database/migrations/2026_08_14_000900_create_card_to_card_amount_authority.php
          php -l database/migrations/2026_08_14_001030_create_gift_card_reconciliation_findings.php
          php -l database/migrations/2026_08_14_001150_create_nowpayments_payment_authority.php
          php -l database/migrations/2026_08_14_001152_create_nowpayments_reconciliation_findings.php
          php -l tests/Feature/UsdtGenericRestBlockchainProviderTest.php

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            database/migrations/2026_08_14_000800_create_zarinpal_payment_authority.php \
            database/migrations/2026_08_14_000900_create_card_to_card_amount_authority.php \
            database/migrations/2026_08_14_001030_create_gift_card_reconciliation_findings.php \
            database/migrations/2026_08_14_001150_create_nowpayments_payment_authority.php \
            database/migrations/2026_08_14_001152_create_nowpayments_reconciliation_findings.php \
            tests/Feature/UsdtGenericRestBlockchainProviderTest.php
          git diff --cached --check
          test -z "$(git status --porcelain | grep -v '^M  ' || true)"
          git commit -m "fix(phase-0.5): resolve remaining CI edge cases"

      - name: Apply repository Pint rules
        shell: bash
        run: |
          set -euo pipefail
          php vendor/bin/pint
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 70 ]; then
            printf 'Expected exactly 70 Pint files, got %s.\n' "${#changed[@]}"
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          for path in "${changed[@]}"; do
            if [[ "$path" != *.php ]]; then
              printf 'Unexpected non-PHP Pint change: %s\n' "$path"
              exit 1
            fi
          done
          printf '%s\n' "${changed[@]}" | LC_ALL=C sort > /tmp/pint-changed-paths.txt
          actual_hash="$(sha256sum /tmp/pint-changed-paths.txt | awk '{print $1}')"
          expected_hash="3161c62cab5ba82d9bd9c1d00753142f807f7450bed6d854691a9ca3b591629d"
          if [ "$actual_hash" != "$expected_hash" ]; then
            echo "Unexpected Pint path set."
            cat /tmp/pint-changed-paths.txt
            exit 1
          fi
          git diff --check
          git add -- "${changed[@]}"
          git diff --cached --check
          git commit -m "style(phase-0.5): apply Pint formatting"

      - name: Remove one-time workflow and push once
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pint-fix.yml
          git commit -m "ci(phase-0.5): remove one-time correction workflow"
          test -z "$(git status --porcelain)"
          git push origin HEAD:task/8-phase-0.5-completion
