name: One-time Pint formatter

on:
  push:
    branches:
      - task/8-phase-0.5-completion
    paths:
      - .github/workflows/pint-fix.yml

permissions:
  contents: write

concurrency:
  group: pint-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply repository Pint rules
        run: vendor/bin/pint

      - name: Verify formatted diff
        run: git diff --check

      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No Pint changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply Pint formatting (#8)"
          git push origin HEAD:task/8-phase-0.5-completion
