name: Provider Readiness - Read Only

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Select the provider read-only contract to probe.
        required: true
        default: pasarguard
        type: choice
        options:
          - pasarguard
          - marzban
          - all
      confirm:
        description: Type READ_ONLY_PROVIDER_CHECK to confirm no provider mutation is intended.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provider-readiness-${{ github.ref_name }}-${{ inputs.provider }}
  cancel-in-progress: true

jobs:
  pasarguard:
    name: PasarGuard v5.4.1 read-only readiness
    if: ${{ github.ref_name == 'main' && inputs.confirm == 'READ_ONLY_PROVIDER_CHECK' && (inputs.provider == 'pasarguard' || inputs.provider == 'all') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: curl, json
          coverage: none

      - name: Validate read-only test configuration
        shell: bash
        env:
          PASARGUARD_TEST_ORIGIN: ${{ secrets.PASARGUARD_TEST_ORIGIN }}
          PASARGUARD_TEST_API_KEY: ${{ secrets.PASARGUARD_TEST_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${PASARGUARD_TEST_ORIGIN:-}" || { echo 'PASARGUARD_TEST_ORIGIN is not configured.' >&2; exit 1; }
          test -n "${PASARGUARD_TEST_API_KEY:-}" || { echo 'PASARGUARD_TEST_API_KEY is not configured.' >&2; exit 1; }
          php -m | grep -Fx curl >/dev/null

      - name: Probe PasarGuard source contract
        shell: bash
        env:
          PASARGUARD_TEST_ORIGIN: ${{ secrets.PASARGUARD_TEST_ORIGIN }}
          PASARGUARD_TEST_API_KEY: ${{ secrets.PASARGUARD_TEST_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p build/evidence/provider-readiness
          php scripts/ci/pasarguard-readonly-probe.php             2>&1 | tee build/evidence/provider-readiness/pasarguard.txt

      - name: Upload sanitized PasarGuard readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-readiness-pasarguard-${{ github.run_id }}
          path: build/evidence/provider-readiness/pasarguard.txt
          if-no-files-found: warn
          retention-days: 14

  marzban:
    name: Marzban v0.8.4 read-only readiness
    if: ${{ github.ref_name == 'main' && inputs.confirm == 'READ_ONLY_PROVIDER_CHECK' && (inputs.provider == 'marzban' || inputs.provider == 'all') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: curl, json
          coverage: none

      - name: Validate read-only test configuration
        shell: bash
        env:
          MARZBAN_TEST_ORIGIN: ${{ secrets.MARZBAN_TEST_ORIGIN }}
          MARZBAN_TEST_USERNAME: ${{ secrets.MARZBAN_TEST_USERNAME }}
          MARZBAN_TEST_PASSWORD: ${{ secrets.MARZBAN_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MARZBAN_TEST_ORIGIN:-}" || { echo 'MARZBAN_TEST_ORIGIN is not configured.' >&2; exit 1; }
          test -n "${MARZBAN_TEST_USERNAME:-}" || { echo 'MARZBAN_TEST_USERNAME is not configured.' >&2; exit 1; }
          test -n "${MARZBAN_TEST_PASSWORD:-}" || { echo 'MARZBAN_TEST_PASSWORD is not configured.' >&2; exit 1; }
          php -m | grep -Fx curl >/dev/null

      - name: Probe Marzban source contract
        shell: bash
        env:
          MARZBAN_TEST_ORIGIN: ${{ secrets.MARZBAN_TEST_ORIGIN }}
          MARZBAN_TEST_USERNAME: ${{ secrets.MARZBAN_TEST_USERNAME }}
          MARZBAN_TEST_PASSWORD: ${{ secrets.MARZBAN_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build/evidence/provider-readiness
          php scripts/ci/marzban-readonly-probe.php             2>&1 | tee build/evidence/provider-readiness/marzban.txt

      - name: Upload sanitized Marzban readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-readiness-marzban-${{ github.run_id }}
          path: build/evidence/provider-readiness/marzban.txt
          if-no-files-found: warn
          retention-days: 14
