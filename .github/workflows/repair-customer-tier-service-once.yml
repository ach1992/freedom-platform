name: Repair customer tier service once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repair-customer-tier-service-once.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'develop/v1.0.0-completion'
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop/v1.0.0-completion
          fetch-depth: 1

      - name: Repair generated file and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          file=app/Modules/Customers/Application/CustomerTierService.php
          grep -Fq 'is_array($ecoded)' "$file"
          sed -i 's/is_array($ecoded)/is_array($decoded)/' "$file"
          php -l "$file"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$file"
          git rm .github/workflows/repair-customer-tier-service-once.yml
          git diff --cached --check
          git commit -m 'fix: repair customer tier policy decoding'
          git push origin HEAD:develop/v1.0.0-completion
