name: Hosted Runner Probe Once

on:
  pull_request:
    paths:
      - .github/workflows/runner-probe-once.yml

permissions:
  contents: read

jobs:
  ubuntu-22:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Record runner startup
        run: |
          set -euo pipefail
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"

  ubuntu-24:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record runner startup
        run: |
          set -euo pipefail
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
