name: Staging Candidate Health Once

on:
  pull_request:
    paths:
      - .github/workflows/staging-candidate-health-once.yml

permissions:
  contents: read

jobs:
  candidate-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare SSH client
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Inspect candidate writable paths as www
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            "DOMAIN='$STAGING_DOMAIN' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          ROOT="/www/acdomains/$DOMAIN"
          PHP=/www/server/php/84/bin/php
          echo '# staged candidate writable paths'
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for release in "$ROOT"/releases/staging-a-501a98ae0b3f "$ROOT"/releases/staging-b-501a98ae0b3f; do
            [ -d "$release" ] || continue
            echo "release=$(basename "$release")"
            for path in "$ROOT" "$ROOT/shared" "$ROOT/shared/storage" "$release" "$release/storage" "$release/bootstrap" "$release/bootstrap/cache"; do
              echo "path=$(realpath -m "$path")"
              stat -Lc 'mode=%a owner=%U group=%G type=%F' "$path"
              if runuser -u www -- test -r "$path"; then echo 'www_readable=yes'; else echo 'www_readable=no'; fi
              if runuser -u www -- test -x "$path"; then echo 'www_searchable=yes'; else echo 'www_searchable=no'; fi
              if runuser -u www -- test -w "$path"; then echo 'www_writable=yes'; else echo 'www_writable=no'; fi
            done
            runuser -u www -- "$PHP" -r '
              $paths = [$argv[1], $argv[2]];
              foreach ($paths as $path) {
                  echo "php_path=".$path.PHP_EOL;
                  echo "php_realpath=".(realpath($path) ?: "false").PHP_EOL;
                  echo "php_is_dir=".(is_dir($path) ? "yes" : "no").PHP_EOL;
                  echo "php_is_writable=".(is_writable($path) ? "yes" : "no").PHP_EOL;
                  $error = error_get_last();
                  echo "php_error=".($error["message"] ?? "none").PHP_EOL;
              }
            ' "$release/storage" "$release/bootstrap/cache"
          done
          REMOTE

      - name: Remove SSH material
        if: always()
        run: rm -rf "$HOME/.ssh"
