name: Staging Deploy Core

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-core:
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 45
    env:
      VERIFIED_APP_SHA: f3f460b1ae5deabfa1590a17b479e8de4d8bf2af
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop/v1.0.0-completion
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Check out verified application commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f3f460b1ae5deabfa1590a17b479e8de4d8bf2af
          path: application
          fetch-depth: 1
          persist-credentials: false

      - name: Validate staging inputs
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
          TELEGRAM_TEST_BOT_TOKEN: ${{ secrets.TELEGRAM_TEST_BOT_TOKEN }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in STAGING_HOST STAGING_PORT STAGING_USER STAGING_DOMAIN TELEGRAM_TEST_BOT_TOKEN STAGING_SSH_PRIVATE_KEY STAGING_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "Missing required secret: ${name}" >&2; exit 1; }
          done
          [[ "$STAGING_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Invalid staging domain.' >&2; exit 1; }
          test -f control/deploy/staging/core-deploy.sh
          test -f control/deploy/staging/prepare-php-functions.sh
          test -f control/deploy/staging/prepare-runtime-paths.sh
          test -f control/deploy/staging/recover-operations-migration.sh
          test -f application/composer.lock

      - name: Prepare package and temporary SSH client
        env:
          STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
          TELEGRAM_TEST_BOT_TOKEN: ${{ secrets.TELEGRAM_TEST_BOT_TOKEN }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/freedom-staging/ssh" "$RUNNER_TEMP/freedom-staging/package"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/freedom-staging/ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$RUNNER_TEMP/freedom-staging/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/freedom-staging/ssh/id_ed25519" "$RUNNER_TEMP/freedom-staging/ssh/known_hosts"
          printf '%s' "$STAGING_DOMAIN" > "$RUNNER_TEMP/freedom-staging/package/domain"
          printf '%s' "$TELEGRAM_TEST_BOT_TOKEN" > "$RUNNER_TEMP/freedom-staging/package/telegram-token"
          install -m 700 control/deploy/staging/core-deploy.sh "$RUNNER_TEMP/freedom-staging/package/core-deploy.sh"
          install -m 700 control/deploy/staging/prepare-php-functions.sh "$RUNNER_TEMP/freedom-staging/package/prepare-php-functions.sh"
          install -m 700 control/deploy/staging/prepare-runtime-paths.sh "$RUNNER_TEMP/freedom-staging/package/prepare-runtime-paths.sh"
          install -m 700 control/deploy/staging/recover-operations-migration.sh "$RUNNER_TEMP/freedom-staging/package/recover-operations-migration.sh"
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=vendor \
            --exclude=build \
            -C application \
            -czf "$RUNNER_TEMP/freedom-staging/package/application.tar.gz" .
          chmod 600 "$RUNNER_TEMP/freedom-staging/package/domain" \
            "$RUNNER_TEMP/freedom-staging/package/telegram-token" \
            "$RUNNER_TEMP/freedom-staging/package/application.tar.gz"
          test -s "$RUNNER_TEMP/freedom-staging/package/application.tar.gz"

      - name: Upload verified deployment inputs
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/freedom-staging/ssh/known_hosts"
            -i "$RUNNER_TEMP/freedom-staging/ssh/id_ed25519"
            -p "$STAGING_PORT"
          )
          ssh "${ssh_options[@]}" "$STAGING_USER@$STAGING_HOST" \
            'install -d -m 700 /root/freedom-bootstrap/incoming'
          scp_options=(
            -q
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/freedom-staging/ssh/known_hosts"
            -i "$RUNNER_TEMP/freedom-staging/ssh/id_ed25519"
            -P "$STAGING_PORT"
          )
          scp "${scp_options[@]}" \
            "$RUNNER_TEMP/freedom-staging/package/application.tar.gz" \
            "$RUNNER_TEMP/freedom-staging/package/domain" \
            "$RUNNER_TEMP/freedom-staging/package/telegram-token" \
            "$RUNNER_TEMP/freedom-staging/package/core-deploy.sh" \
            "$RUNNER_TEMP/freedom-staging/package/prepare-php-functions.sh" \
            "$RUNNER_TEMP/freedom-staging/package/prepare-runtime-paths.sh" \
            "$RUNNER_TEMP/freedom-staging/package/recover-operations-migration.sh" \
            "$STAGING_USER@$STAGING_HOST:/root/freedom-bootstrap/incoming/"

      - name: Recover, deploy, activate, rollback, and verify core runtime
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence/staging
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/freedom-staging/ssh/known_hosts" \
            -i "$RUNNER_TEMP/freedom-staging/ssh/id_ed25519" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            "chmod 700 /root/freedom-bootstrap/incoming/prepare-php-functions.sh /root/freedom-bootstrap/incoming/prepare-runtime-paths.sh /root/freedom-bootstrap/incoming/recover-operations-migration.sh /root/freedom-bootstrap/incoming/core-deploy.sh && /root/freedom-bootstrap/incoming/prepare-php-functions.sh && /root/freedom-bootstrap/incoming/prepare-runtime-paths.sh && /root/freedom-bootstrap/incoming/recover-operations-migration.sh && /root/freedom-bootstrap/incoming/core-deploy.sh '$VERIFIED_APP_SHA'" \
            | tee build/evidence/staging/core-deploy.txt

      - name: Remove temporary SSH and package material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/freedom-staging"

      - name: Upload sanitized core deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-core-deploy-${{ github.run_id }}
          path: build/evidence/staging
          if-no-files-found: warn
          retention-days: 7
