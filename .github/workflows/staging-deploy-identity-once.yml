name: Staging Verify Identity Phone Once

on:
  pull_request:
    paths:
      - .github/workflows/staging-deploy-identity-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 10
    steps:
      - name: Prepare temporary SSH client
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/identity-smoke/ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/identity-smoke/ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$RUNNER_TEMP/identity-smoke/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/identity-smoke/ssh/id_ed25519" "$RUNNER_TEMP/identity-smoke/ssh/known_hosts"

      - name: Verify migration, PHP 8.4 binding, and HTTPS health
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/evidence/staging
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/identity-smoke/ssh/known_hosts" \
            -i "$RUNNER_TEMP/identity-smoke/ssh/id_ed25519" \
            -o ConnectTimeout=20 \
            -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            "set -euo pipefail; cd /www/acdomains/$STAGING_DOMAIN/current; PHP84=/www/server/php/84/bin/php; \"\$PHP84\" -v | head -n 1; \"\$PHP84\" artisan migrate:status --no-ansi | grep '2026_08_04_000600_extend_phone_verification_foundation'; \"\$PHP84\" -r 'require \"vendor/autoload.php\"; \$app=require \"bootstrap/app.php\"; \$app->make(Illuminate\\Contracts\\Console\\Kernel::class)->bootstrap(); \$hasher=\$app->make(App\\Modules\\Identity\\Application\\Contracts\\PhoneLookupHasher::class); \$number=App\\Modules\\Identity\\Domain\\IranianMobileNumber::fromString(\"۰۹۱۲ ۳۴۵-۶۷۸۹\"); \$hash=\$hasher->hash(\$number); if (\$number->e164()!==\"+989123456789\" || strlen(\$hash->value)!==64 || \$hash->keyVersion<1) { exit(1); } echo \"identity_phone_binding=ok\\n\";'; curl -fsS --max-time 15 \"https://$STAGING_DOMAIN/health/ready\" >/dev/null; echo 'https_ready=ok'" \
            | tee build/evidence/staging/identity-phone-smoke.txt

      - name: Remove temporary SSH material
        if: always()
        run: rm -rf "$RUNNER_TEMP/identity-smoke"

      - name: Upload sanitized smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-identity-phone-smoke-${{ github.run_id }}
          path: build/evidence/staging
          if-no-files-found: warn
          retention-days: 7
