name: Staging Edge Check Once

on:
  pull_request:
    paths:
      - .github/workflows/staging-edge-check-once.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check public HTTP and HTTPS
        env:
          DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: |
          set -euo pipefail
          for scheme in http https; do
            for endpoint in /health/live /health/ready; do
              set +e
              code=$(curl --silent --show-error --max-time 20 --output /tmp/body --write-out '%{http_code}' "$scheme://$DOMAIN$endpoint")
              status=$?
              set -e
              echo "$scheme$endpoint curl_status=$status http_code=$code"
              if [ "$status" -eq 0 ]; then
                head -c 500 /tmp/body; echo
              fi
            done
          done
      - name: Check Telegram webhook metadata
        env:
          TOKEN: ${{ secrets.TELEGRAM_TEST_BOT_TOKEN }}
          DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --max-time 20 "https://api.telegram.org/bot$TOKEN/getWebhookInfo")
          python3 - "$DOMAIN" "$response" <<'PY'
          import json, sys
          domain = sys.argv[1]
          payload = json.loads(sys.argv[2])
          result = payload.get('result') or {}
          url = result.get('url') or ''
          print('telegram_ok=' + str(bool(payload.get('ok'))).lower())
          print('webhook_configured=' + str(bool(url)).lower())
          print('webhook_targets_staging=' + str(domain in url).lower())
          print('pending_update_count=' + str(result.get('pending_update_count', 0)))
          print('last_error_present=' + str(bool(result.get('last_error_message'))).lower())
          PY
