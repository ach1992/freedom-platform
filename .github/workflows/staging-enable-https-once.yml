name: Staging Enable HTTPS Once

on:
  pull_request:
    paths:
      - .github/workflows/staging-enable-https-once.yml

permissions:
  contents: read

jobs:
  https:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Issue certificate and configure OpenLiteSpeed
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          PORT: ${{ secrets.STAGING_PORT }}
          USER: ${{ secrets.STAGING_USER }}
          DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$PORT" "$USER@$HOST" "DOMAIN='$DOMAIN' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          ROOT="/www/acdomains/$DOMAIN"
          test -f "$ROOT/current/public/index.php"
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq certbot
          certbot certonly --webroot \
            --webroot-path "$ROOT/current/public" \
            --domain "$DOMAIN" \
            --non-interactive --agree-tos --register-unsafely-without-email \
            --keep-until-expiring
          test -s "/etc/letsencrypt/live/$DOMAIN/fullchain.pem"
          test -s "/etc/letsencrypt/live/$DOMAIN/privkey.pem"
          install -d -m 0755 /www/server/panel/vhost/openlitespeed/listen
          cat > /www/server/panel/vhost/openlitespeed/listen/443.conf <<EOF
          listener Default443 {
            address                 *:443
            secure                  1
            keyFile                 /etc/letsencrypt/live/$DOMAIN/privkey.pem
            certFile                /etc/letsencrypt/live/$DOMAIN/fullchain.pem
            certChain               1
            sslProtocol             24
            renegProtection         1
            sslSessionCache         1
            enableSpdy              15
            map                     $DOMAIN $DOMAIN
          }
          EOF
          chmod 644 /www/server/panel/vhost/openlitespeed/listen/443.conf
          install -d -m 0755 /etc/letsencrypt/renewal-hooks/deploy
          cat > /etc/letsencrypt/renewal-hooks/deploy/restart-openlitespeed <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          /usr/local/lsws/bin/lswsctrl restart >/dev/null
          EOF
          chmod 755 /etc/letsencrypt/renewal-hooks/deploy/restart-openlitespeed
          set +e
          /usr/local/lsws/bin/openlitespeed -t >/tmp/freedom-ols-https-test.log 2>&1
          config_status=$?
          set -e
          if grep -Eqi '\[(ERROR|FATAL)\]|syntax error|failed to load' /tmp/freedom-ols-https-test.log; then
            cat /tmp/freedom-ols-https-test.log >&2
            exit 1
          fi
          echo "ols_config_status=$config_status warnings_only=yes"
          /usr/local/lsws/bin/lswsctrl restart >/dev/null
          sleep 5
          ss -lntH '( sport = :443 )' | grep -q .
          curl --silent --show-error --fail --max-time 20 \
            --resolve "$DOMAIN:443:127.0.0.1" \
            "https://$DOMAIN/health/live" >/tmp/freedom-https-live.json
          echo "certificate_present=yes"
          echo "listener_443=yes"
          echo "local_https_live=$(cat /tmp/freedom-https-live.json)"
          echo "certificate_expiry=$(openssl x509 -in /etc/letsencrypt/live/$DOMAIN/fullchain.pem -noout -enddate | cut -d= -f2)"
          REMOTE
      - name: Verify public HTTPS
        env:
          DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: |
          set -euo pipefail
          for endpoint in /health/live /health/ready; do
            body=$(curl --silent --show-error --fail --max-time 30 "https://$DOMAIN$endpoint")
            echo "$endpoint=$body"
          done
      - if: always()
        run: rm -rf "$HOME/.ssh"
