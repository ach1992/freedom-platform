name: Staging Final Rehearsal Once

on:
  pull_request:
    paths:
      - .github/workflows/staging-final-rehearsal-once.yml

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERIFIED_APP_SHA: c1e403461576c72aedc6f1da7f80140678f9779f
    steps:
      - name: Check out deployment controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop/v1.0.0-completion
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Check out verified application commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c1e403461576c72aedc6f1da7f80140678f9779f
          path: application
          fetch-depth: 1
          persist-credentials: false
      - name: Validate inputs and prepare package
        env:
          STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
          TELEGRAM_TEST_BOT_TOKEN: ${{ secrets.TELEGRAM_TEST_BOT_TOKEN }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in STAGING_DOMAIN TELEGRAM_TEST_BOT_TOKEN STAGING_SSH_PRIVATE_KEY STAGING_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "Missing required secret: ${name}" >&2; exit 1; }
          done
          [[ "$STAGING_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]]
          install -d -m 700 "$HOME/.ssh" "$RUNNER_TEMP/freedom-staging"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          printf '%s' "$STAGING_DOMAIN" > "$RUNNER_TEMP/freedom-staging/domain"
          printf '%s' "$TELEGRAM_TEST_BOT_TOKEN" > "$RUNNER_TEMP/freedom-staging/telegram-token"
          for script in core-deploy.sh prepare-php-functions.sh prepare-runtime-paths.sh recover-operations-migration.sh; do
            install -m 700 "control/deploy/staging/$script" "$RUNNER_TEMP/freedom-staging/$script"
          done
          tar --exclude=.git --exclude=.env --exclude=vendor --exclude=build \
            -C application -czf "$RUNNER_TEMP/freedom-staging/application.tar.gz" .
          chmod 600 "$RUNNER_TEMP/freedom-staging/domain" \
            "$RUNNER_TEMP/freedom-staging/telegram-token" \
            "$RUNNER_TEMP/freedom-staging/application.tar.gz"
      - name: Upload verified deployment inputs
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" 'install -d -m 700 /root/freedom-bootstrap/incoming'
          scp -q -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -P "$STAGING_PORT" \
            "$RUNNER_TEMP/freedom-staging/"{application.tar.gz,domain,telegram-token,core-deploy.sh,prepare-php-functions.sh,prepare-runtime-paths.sh,recover-operations-migration.sh} \
            "$STAGING_USER@$STAGING_HOST:/root/freedom-bootstrap/incoming/"
      - name: Run full activation rollback and operations rehearsal
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          mkdir -p build/evidence/staging
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" \
            "chmod 700 /root/freedom-bootstrap/incoming/*.sh && /root/freedom-bootstrap/incoming/prepare-php-functions.sh && /root/freedom-bootstrap/incoming/prepare-runtime-paths.sh && /root/freedom-bootstrap/incoming/recover-operations-migration.sh && /root/freedom-bootstrap/incoming/core-deploy.sh '$VERIFIED_APP_SHA'" \
            | tee build/evidence/staging/final-rehearsal.txt
      - name: Remove local SSH and secret material
        if: always()
        run: rm -rf "$HOME/.ssh" "$RUNNER_TEMP/freedom-staging"
      - name: Upload sanitized rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-final-rehearsal-${{ github.run_id }}
          path: build/evidence/staging
          if-no-files-found: warn
          retention-days: 30
