name: Staging Installer Contract

on:
  pull_request:
    paths:
      - .github/workflows/staging-installer-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare SSH client
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Read installer contract and available stack versions
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            'python3 - <<'"'"'PY'"'"'
import json
from pathlib import Path

catalog_path = Path("/www/server/panel/data/softList.conf")
dispatcher_path = Path("/www/server/panel/install/install_soft.sh")

if not catalog_path.is_file() or not dispatcher_path.is_file():
    raise SystemExit("aaPanel installer contract is incomplete")

print("dispatcher_args=mtype action name version")
print("dispatcher_sha256=" + __import__("hashlib").sha256(dispatcher_path.read_bytes()).hexdigest())

data = json.loads(catalog_path.read_text(encoding="utf-8"))


def walk(value, path="root"):
    if isinstance(value, dict):
        yield path, value
        for key, child in value.items():
            yield from walk(child, f"{path}.{key}")
    elif isinstance(value, list):
        for index, child in enumerate(value):
            yield from walk(child, f"{path}[{index}]")

matches = []
for path, item in walk(data):
    name = str(item.get("name", ""))
    shell = str(item.get("shell", ""))
    text = f"{name} {shell}".lower()
    if "openlitespeed" in text or name.lower() == "php" or shell.lower() == "php.sh":
        safe = {
            key: item.get(key)
            for key in (
                "name", "title", "shell", "check", "version", "versions",
                "mtype", "type", "type_id", "status", "install_version"
            )
            if key in item
        }
        matches.append((path, safe))

for path, safe in matches:
    print("catalog_path=" + path)
    print(json.dumps(safe, ensure_ascii=True, sort_keys=True))
PY'

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -rf "$HOME/.ssh"
