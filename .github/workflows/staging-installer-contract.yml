name: Staging Installer Contract

on:
  pull_request:
    paths:
      - .github/workflows/staging-installer-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare SSH client
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Read installer contract and available stack versions
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            'set -eu
             dispatcher=/www/server/panel/install/install_soft.sh
             catalog=/www/server/panel/data/softList.conf
             test -r "$dispatcher"
             test -r "$catalog"
             echo "dispatcher_begin"
             sed -n "1,220p" "$dispatcher" \
               | sed -E "s#https?://[^[:space:]\"'"'"']+#URL_REDACTED#g"
             echo "dispatcher_end"
             echo "catalog_matches_begin"
             grep -Eai "openlitespeed|litespeed|php[-_ ]?8\.4|php84|8\.4" "$catalog" \
               | head -n 120 \
               | sed -E "s#https?://[^[:space:]\"'"'"']+#URL_REDACTED#g" \
               || true
             echo "catalog_matches_end"'

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -rf "$HOME/.ssh"
