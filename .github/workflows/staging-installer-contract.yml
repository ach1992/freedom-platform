name: Staging Installer Contract

on:
  pull_request:
    paths:
      - .github/workflows/staging-installer-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare SSH client
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Read installer contract and available stack versions
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            'set -eu
             catalog=/www/server/panel/data/softList.conf
             dispatcher=/www/server/panel/install/install_soft.sh
             test -r "$catalog"
             test -r "$dispatcher"
             echo "dispatcher_args=mtype action name version"
             sha256sum "$dispatcher" | awk "{print \"dispatcher_sha256=\"\$1}"
             echo "openlitespeed_context_begin"
             grep -n -A 35 -B 8 "\"name\": \"Openlitespeed\"" "$catalog" | head -n 80 || true
             echo "openlitespeed_context_end"
             echo "php84_context_begin"
             grep -n -A 18 -B 18 "\"version\": \"8.4\"" "$catalog" | head -n 100 || true
             echo "php84_context_end"'

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -rf "$HOME/.ssh"
