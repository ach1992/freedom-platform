name: Staging PHP Build Tail Once

on:
  pull_request:
    paths:
      - .github/workflows/staging-php-build-tail-once.yml

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare SSH client
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Read sanitized PHP build tail
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" \
            'set -eu
             log=/var/log/freedom-php84-install.log
             test -f "$log"
             echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
             echo "php84_binary=$([ -x /www/server/php/84/bin/php ] && echo present || echo absent)"
             echo "installer_processes=$(pgrep -fc "install_soft|php.sh|make|gcc|g\\+\\+" || true)"
             echo "log_tail_begin"
             tail -n 60 "$log" \
               | sed -E "s#https?://[^[:space:]]+#URL_REDACTED#g; s#([Pp]assword|[Pp]asswd|[Tt]oken|[Ss]ecret|[Uu]sername|[Ll]ogin)[[:space:]:=]+[^[:space:]]+#\1=REDACTED#g"
             echo "log_tail_end"'

      - name: Remove SSH material
        if: always()
        run: rm -rf "$HOME/.ssh"
