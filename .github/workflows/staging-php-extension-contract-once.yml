name: Staging PHP Extension Contract Once

on:
  pull_request:
    paths:
      - .github/workflows/staging-php-extension-contract-once.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare SSH client
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Inspect exact PHP extension installers
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            'python3 -' <<'PY'
          from pathlib import Path

          targets = [
              ('/www/server/panel/class/ajax.py', 'InstallLib'),
              ('/www/server/panel/class/ajax.py', 'UninstallLib'),
              ('/www/server/panel/mod/project/php/aepgMod.py', 'install_env_soft'),
          ]

          for filename, function in targets:
              lines = Path(filename).read_text(errors='replace').splitlines()
              marker = f'    def {function}('
              start = next((index for index, line in enumerate(lines) if line.startswith(marker)), None)
              print(f'# {filename}:{function}')
              if start is None:
                  print('not_found')
                  continue
              end = len(lines)
              for index in range(start + 1, len(lines)):
                  if lines[index].startswith('    def '):
                      end = index
                      break
              print('\n'.join(lines[start:end]))
          PY

      - name: Remove SSH material
        if: always()
        run: rm -rf "$HOME/.ssh"
