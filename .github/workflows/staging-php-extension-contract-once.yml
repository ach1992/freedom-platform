name: Staging PHP Extension Contract Once

on:
  pull_request:
    paths:
      - .github/workflows/staging-php-extension-contract-once.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare SSH client
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Inspect exact aaPanel extension API
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            'bash -s' <<'REMOTE'
          set -eu
          echo '# php_async fileinfo behavior'
          sed -n '285,325p' /www/server/panel/mod/project/php/php_asyncMod.py
          echo '# aepg install_phplib'
          sed -n '1135,1235p' /www/server/panel/mod/project/php/aepgMod.py
          echo '# aepg callers one'
          sed -n '1385,1435p' /www/server/panel/mod/project/php/aepgMod.py
          echo '# aepg callers two'
          sed -n '1640,1695p' /www/server/panel/mod/project/php/aepgMod.py
          echo '# panel routes'
          grep -RIn --include='*.py' -E 'install_phplib|InstallLib|UninstallLib' \
            /www/server/panel/class /www/server/panel/mod /www/server/panel/route 2>/dev/null \
            | head -n 120 \
            || true
          REMOTE

      - name: Remove SSH material
        if: always()
        run: rm -rf "$HOME/.ssh"
