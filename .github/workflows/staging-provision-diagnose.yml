name: Staging Provision Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare SSH client
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_SSH_PRIVATE_KEY"
          test -n "$STAGING_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Read sanitized provision diagnostics
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            'set -eu
             echo "panel_directory=$([ -d /www/server/panel ] && echo present || echo absent)"
             echo "panel_service_script=$([ -x /etc/init.d/bt ] && echo present || echo absent)"
             echo "panel_process_count=$(pgrep -fc "BT-Panel|BT-Task|panel.py" || true)"
             for service in ssh cron supervisor mariadb redis-server; do
               echo "service_${service}=$(systemctl is-active "$service" 2>/dev/null || true)"
             done
             if [ -f /var/log/freedom-aapanel-install.log ]; then
               echo "installer_log_bytes=$(wc -c < /var/log/freedom-aapanel-install.log)"
               echo "installer_log_error_summary_begin"
               grep -Eai "error|failed|failure|unsupported|not supported|denied|timeout|cannot|missing|abort|traceback" /var/log/freedom-aapanel-install.log \
                 | tail -n 80 \
                 | sed -E "s#https?://[^[:space:]]+#URL_REDACTED#g; s#([Pp]assword|[Pp]asswd|[Tt]oken|[Ss]ecret|[Uu]sername|[Ll]ogin)[[:space:]:=]+[^[:space:]]+#\1=REDACTED#g" \
                 || true
               echo "installer_log_error_summary_end"
             else
               echo "installer_log=absent"
             fi
             echo "panel_paths_begin"
             find /www/server -maxdepth 2 -mindepth 1 -type d 2>/dev/null \
               | sed -n "1,80p" \
               | sed -E "s#/www/server/panel/data.*#/www/server/panel/data/REDACTED#"
             echo "panel_paths_end"'

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -rf "$HOME/.ssh"
