name: Staging Readiness

on:
  repository_dispatch:
    types: [staging_readiness]

permissions:
  contents: read

concurrency:
  group: staging-readiness
  cancel-in-progress: true

jobs:
  readiness:
    name: Read-only staging readiness
    if: ${{ github.ref == 'refs/heads/main' && github.event.client_payload.confirmation == 'READ_ONLY_STAGING_CHECK' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_PORT: ${{ secrets.STAGING_PORT }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
    steps:
      - name: Validate read-only contract
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.client_payload.confirmation }}' = 'READ_ONLY_STAGING_CHECK'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$RUNNER_OS" = 'Linux'
          test "$RUNNER_ARCH" = 'X64'

          for name in STAGING_HOST STAGING_PORT STAGING_USER STAGING_DOMAIN; do
            test -n "${!name:-}" || { echo "Missing required staging secret: $name" >&2; exit 1; }
          done

          [[ "$STAGING_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Invalid staging host shape.' >&2; exit 1; }
          [[ "$STAGING_PORT" =~ ^[0-9]{1,5}$ ]] || { echo 'Invalid staging port shape.' >&2; exit 1; }
          ((STAGING_PORT >= 1 && STAGING_PORT <= 65535)) || { echo 'Invalid staging port range.' >&2; exit 1; }
          [[ "$STAGING_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]] || { echo 'Invalid staging user shape.' >&2; exit 1; }
          [[ "$STAGING_DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Invalid staging domain shape.' >&2; exit 1; }

      - name: Prepare pinned SSH client
        shell: bash
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${STAGING_SSH_PRIVATE_KEY:-}" || { echo 'Missing staging SSH private key.' >&2; exit 1; }
          test -n "${STAGING_KNOWN_HOSTS:-}" || { echo 'Missing staging known-hosts authority.' >&2; exit 1; }

          umask 077
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Collect sanitized target facts
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/staging-readiness"
          rm -rf "$evidence"
          mkdir -p "$evidence"

          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            "DOMAIN='$STAGING_DOMAIN' bash -s" > "$evidence/readiness.txt" <<'REMOTE'
          set -euo pipefail

          project_root="/www/acdomains/$DOMAIN"
          php_cli=/www/server/php/84/bin/php
          php_cli_ini=/www/server/php/84/etc/php-cli.ini
          lsphp=/usr/local/lsws/lsphp84/bin/lsphp
          composer=/usr/local/bin/composer

          echo '# staging readiness'
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "hostname_sha256=$(hostname | sha256sum | awk '{print $1}')"
          if [[ -r /etc/os-release ]]; then
            . /etc/os-release
            printf 'os=%s\n' "${PRETTY_NAME:-unknown}" | tr '\r\n' '  '
            echo
          else
            echo 'os=unknown'
          fi
          echo "kernel=$(uname -sr)"
          echo "disk_root_available_bytes=$(df -PB1 / | awk 'NR==2 {print $4}')"
          echo "memory_total_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"

          if [[ -x "$php_cli" ]]; then
            echo "php_cli=$("$php_cli" -c "$php_cli_ini" -r 'echo PHP_VERSION;')"
            echo "php_cli_ini=$("$php_cli" -c "$php_cli_ini" -r 'echo php_ini_loaded_file() ?: "none";')"
            echo "php_cli_extensions=$("$php_cli" -c "$php_cli_ini" -r '$extensions = get_loaded_extensions(); sort($extensions); echo implode(",", $extensions);')"
          else
            echo 'php_cli=missing'
          fi

          if [[ -x "$lsphp" ]]; then
            echo "lsphp=$("$lsphp" -r 'echo PHP_VERSION;' 2>/dev/null || echo unreadable)"
            echo "lsphp_ini=$("$lsphp" -r 'echo php_ini_loaded_file() ?: "none";' 2>/dev/null || echo unreadable)"
          else
            echo 'lsphp=missing'
          fi

          if [[ -f "$composer" && -x "$php_cli" ]]; then
            echo "composer=$("$php_cli" -c "$php_cli_ini" "$composer" --version --no-ansi | sed -E 's/[[:space:]]+/ /g')"
          else
            echo 'composer=missing'
          fi

          for service in cron supervisor mariadb mysql redis-server redis lsws lshttpd; do
            state=$(systemctl is-active "$service" 2>/dev/null || true)
            [[ -n "$state" ]] || state=not-found
            echo "service_${service}=$state"
          done

          if [[ -d "$project_root" ]]; then
            echo 'project_root=present'
          else
            echo 'project_root=absent'
          fi

          if [[ -L "$project_root/current" ]]; then
            echo 'current_symlink=present'
            current_path=$(readlink -f "$project_root/current" 2>/dev/null || true)
            case "$current_path" in
              "$project_root"/releases/*)
                echo 'current_target_shape=release'
                echo "current_release=$(basename "$current_path")"
                ;;
              *)
                echo 'current_target_shape=unexpected'
                ;;
            esac
          else
            echo 'current_symlink=absent'
          fi

          env_file="$project_root/shared/.env"
          if [[ -f "$env_file" && ! -L "$env_file" ]]; then
            echo 'shared_environment=present'
            app_debug=$(awk -F= '$1 == "APP_DEBUG" {print tolower($2)}' "$env_file" | tail -n1 | tr -d "[:space:]'\"")
            case "$app_debug" in
              false|0|off|no) echo 'app_debug=false' ;;
              *) echo 'app_debug=unsafe_or_unknown' ;;
            esac
          else
            echo 'shared_environment=absent_or_unsafe'
            echo 'app_debug=unknown'
          fi

          cron_count=$(crontab -l 2>/dev/null | grep -c 'artisan schedule:run' || true)
          echo "scheduler_cron_entries=$cron_count"

          supervisor_state=$(supervisorctl status 'freedom-platform-workers:*' 2>/dev/null || true)
          worker_total=$(printf '%s\n' "$supervisor_state" | awk 'NF >= 2 {count++} END {print count+0}')
          worker_running=$(printf '%s\n' "$supervisor_state" | awk '$2 == "RUNNING" {count++} END {print count+0}')
          echo "supervisor_workers_total=$worker_total"
          echo "supervisor_workers_running=$worker_running"

          if [[ -x "$php_cli" && -f "$project_root/current/artisan" ]]; then
            set +e
            health_output=$(cd "$project_root/current" && "$php_cli" -c "$php_cli_ini" artisan health:check --critical --json --redact 2>&1)
            health_status=$?
            set -e
            echo "health_check_exit=$health_status"
            echo 'health_check_output_begin'
            printf '%s\n' "$health_output"
            echo 'health_check_output_end'
          else
            echo 'health_check_exit=unavailable'
          fi
          REMOTE

          test -s "$evidence/readiness.txt"
          if grep -Eqi '(^|_)(password|passwd|token|secret|api_key|private_key)[[:space:]]*=' "$evidence/readiness.txt"; then
            echo 'Sensitive-looking key was emitted.' >&2
            exit 1
          fi
          cat "$evidence/readiness.txt"

      - name: Remove local SSH material
        if: always()
        shell: bash
        run: rm -rf "$HOME/.ssh"

      - name: Upload sanitized readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-readiness-${{ github.run_id }}
          path: ${{ runner.temp }}/staging-readiness
          if-no-files-found: error
          retention-days: 7
