name: Staging Release Diagnose Once

on:
  pull_request:
    paths:
      - .github/workflows/staging-release-diagnose-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Inspect release state without secrets
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          PORT: ${{ secrets.STAGING_PORT }}
          USER: ${{ secrets.STAGING_USER }}
          DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$PORT" "$USER@$HOST" "DOMAIN='$DOMAIN' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          ROOT="/www/acdomains/$DOMAIN"
          PHP=/www/server/php/84/bin/php
          echo "current_release=$(basename "$(readlink -f "$ROOT/current")")"
          echo 'journal_begin'
          if [ -s "$ROOT/shared/release-journal.json" ]; then
              python3 - "$ROOT/shared/release-journal.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          allowed = {k: data.get(k) for k in ('status','release','previous_release','updated_at','failure_reason') if k in data}
          print(json.dumps(allowed, sort_keys=True))
          PY
          else
              echo 'journal=absent'
          fi
          echo 'journal_end'
          echo 'deploy_evidence_begin'
          if [ -s /root/freedom-bootstrap/core-deploy-evidence.txt ]; then
              sed -n '1,240p' /root/freedom-bootstrap/core-deploy-evidence.txt
          else
              echo 'deploy_evidence=absent'
          fi
          echo 'deploy_evidence_end'
          echo 'runtime_counts_begin'
          mariadb --protocol=socket -N -uroot freedom_platform -e \
            "SELECT CONCAT('workers=',COUNT(*)) FROM worker_heartbeats WHERE worker_id <> 'scheduler'; SELECT CONCAT('scheduler=',COUNT(*)) FROM worker_heartbeats WHERE worker_id='scheduler'; SELECT CONCAT('unresolved_stale=',COUNT(*)) FROM alerts WHERE event_name='operations.worker_heartbeat_stale' AND resolved_at IS NULL;"
          echo 'runtime_counts_end'
          echo 'supervisor_begin'
          supervisorctl status 'freedom-platform-workers:*' || true
          echo 'supervisor_end'
          echo 'health_begin'
          runuser -u www -- "$PHP" "$ROOT/current/artisan" health:check --critical --json --redact --no-ansi --no-interaction
          echo 'health_end'
          REMOTE
      - if: always()
        run: rm -rf "$HOME/.ssh"
