name: Staging Runtime Diagnose Once

on:
  pull_request:
    paths:
      - .github/workflows/staging-runtime-diagnose-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Inspect provisioning worker runtime
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          PORT: ${{ secrets.STAGING_PORT }}
          USER: ${{ secrets.STAGING_USER }}
          DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$PORT" "$USER@$HOST" "DOMAIN='$DOMAIN' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          ROOT="/www/acdomains/$DOMAIN"
          echo "current_release=$(basename "$(readlink -f "$ROOT/current")")"
          echo 'worker_rows_begin'
          mariadb --protocol=socket -N -uroot freedom_platform -e \
            "SELECT worker_id, queue, TIMESTAMPDIFF(SECOND,last_seen_at,UTC_TIMESTAMP(6)) AS age_seconds FROM worker_heartbeats ORDER BY worker_id;"
          echo 'worker_rows_end'
          echo 'provisioning_processes_begin'
          for name in freedom-platform-provisioning_00 freedom-platform-provisioning_01; do
              pid=$(supervisorctl pid "freedom-platform-workers:$name")
              echo "name=$name pid=$pid"
              ps -o pid=,etime=,stat=,wchan=,cmd= -p "$pid"
              tr '\0' '\n' < "/proc/$pid/environ" \
                | grep -E '^(APP_ENV|WORKER_HEARTBEAT_ENABLED|WORKER_NAME|WORKER_QUEUE_GROUP|WORKER_HEARTBEAT_INTERVAL_SECONDS|WORKER_HEARTBEAT_STALE_AFTER_SECONDS)=' \
                | sort
          done
          echo 'provisioning_processes_end'
          echo 'queue_lengths_begin'
          REDISCLI_AUTH=$(awk -F= '$1 == "REDIS_PASSWORD" {print substr($0, index($0, "=") + 1)}' "$ROOT/shared/.env")
          export REDISCLI_AUTH
          for queue in provisioning telegram-ingress telegram-delivery synchronization default; do
              length=$(redis-cli -h 127.0.0.1 -p 6379 -n 0 LLEN "queues:$queue")
              reserved=$(redis-cli -h 127.0.0.1 -p 6379 -n 0 ZCARD "queues:$queue:reserved")
              delayed=$(redis-cli -h 127.0.0.1 -p 6379 -n 0 ZCARD "queues:$queue:delayed")
              echo "$queue ready=$length reserved=$reserved delayed=$delayed"
          done
          unset REDISCLI_AUTH
          echo 'queue_lengths_end'
          echo 'heartbeat_log_begin'
          grep -E 'Queue worker heartbeat could not be recorded|operations.worker_heartbeat_record_failed|ERROR|CRITICAL' \
            "$ROOT/shared/storage/logs/supervisor-provisioning.log" 2>/dev/null \
            | tail -n 80 \
            | sed -E 's#https?://[^[:space:]]+#URL_REDACTED#g' \
            || true
          echo 'heartbeat_log_end'
          REMOTE
      - if: always()
        run: rm -rf "$HOME/.ssh"
