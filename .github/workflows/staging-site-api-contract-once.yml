name: Staging Site API Contract Once

on:
  pull_request:
    paths:
      - .github/workflows/staging-site-api-contract-once.yml

permissions:
  contents: read

jobs:
  inspect-site-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare SSH client
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Inspect site creation options and callers
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            'python3 -' <<'PY'
          from pathlib import Path

          path = Path('/www/server/panel/class/panelSite.py')
          lines = path.read_text(errors='replace').splitlines()

          for function in ('_set_ssl', '_set_redirect'):
              print(f'# panelSite.py:{function}')
              marker = f'    def {function}('
              start = next((i for i, line in enumerate(lines) if line.startswith(marker)), None)
              if start is None:
                  print('not_found')
                  continue
              end = len(lines)
              for i in range(start + 1, len(lines)):
                  if lines[i].startswith('    def '):
                      end = i
                      break
              print('\n'.join(lines[start:min(end, start + 180)]))

          print('# AddSite callers')
          roots = [Path('/www/server/panel/class'), Path('/www/server/panel/mod'), Path('/www/server/panel/script')]
          shown = 0
          for root in roots:
              for source in root.rglob('*.py'):
                  try:
                      source_lines = source.read_text(errors='replace').splitlines()
                  except OSError:
                      continue
                  for index, line in enumerate(source_lines):
                      if '.AddSite(' not in line and 'AddSite(args' not in line and 'AddSite(get' not in line:
                          continue
                      print(f'## {source}:{index + 1}')
                      print('\n'.join(source_lines[max(0, index - 20):min(len(source_lines), index + 8)]))
                      shown += 1
                      if shown >= 12:
                          raise SystemExit(0)
          PY

      - name: Remove SSH material
        if: always()
        run: rm -rf "$HOME/.ssh"
