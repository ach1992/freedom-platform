name: Staging Site Contract Once

on:
  pull_request:
    paths:
      - .github/workflows/staging-site-contract-once.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare SSH client
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Inspect aaPanel OpenLiteSpeed site contract
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" \
            'set -eu
             echo "# aaPanel OpenLiteSpeed site contract"
             for path in \
               /www/server/panel/vhost/openlitespeed \
               /www/server/panel/vhost/template/openlitespeed \
               /usr/local/lsws/conf/vhosts \
               /usr/local/lsws/conf/httpd_config.conf; do
               echo "path_${path//\//_}=$([ -e "$path" ] && echo present || echo absent)"
             done
             echo "vhost_files_begin"
             find /www/server/panel/vhost -maxdepth 3 -type f 2>/dev/null \
               | grep -Ei "openlitespeed|litespeed" \
               | sort \
               | head -n 100 \
               || true
             echo "vhost_files_end"
             echo "site_api_symbols_begin"
             grep -RIn --include="*.py" -E "def (AddSite|add_site|CreateSite|create_site)|Openlitespeed|openlitespeed" \
               /www/server/panel/class /www/server/panel/mod /www/server/panel/script 2>/dev/null \
               | head -n 160 \
               | sed -E "s#https?://[^[:space:]]+#URL_REDACTED#g" \
               || true
             echo "site_api_symbols_end"
             echo "ols_includes_begin"
             grep -nE "include|virtualhost|listener" /usr/local/lsws/conf/httpd_config.conf 2>/dev/null \
               | head -n 160 \
               || true
             echo "ols_includes_end"'

      - name: Remove SSH material
        if: always()
        run: rm -rf "$HOME/.ssh"
