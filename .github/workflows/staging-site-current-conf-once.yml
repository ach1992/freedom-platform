name: Staging Site Current Conf Once

on:
  pull_request:
    paths:
      - .github/workflows/staging-site-current-conf-once.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - env:
          KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - env:
          HOST: ${{ secrets.STAGING_HOST }}
          PORT: ${{ secrets.STAGING_PORT }}
          USER: ${{ secrets.STAGING_USER }}
          DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p "$PORT" "$USER@$HOST" "
            echo MAIN_BEGIN
            sed -n '1,220p' /www/server/panel/vhost/openlitespeed/$DOMAIN.conf
            echo MAIN_END
            echo DETAIL_BEGIN
            sed -n '1,320p' /www/server/panel/vhost/openlitespeed/detail/$DOMAIN.conf
            echo DETAIL_END
            echo LISTENER443_BEGIN
            if [ -f /www/server/panel/vhost/openlitespeed/listen/443.conf ]; then sed -n '1,220p' /www/server/panel/vhost/openlitespeed/listen/443.conf; else echo absent; fi
            echo LISTENER443_END
          "
      - if: always()
        run: rm -rf "$HOME/.ssh"
