name: Staging Site Path Diagnose Once

on:
  pull_request:
    paths:
      - .github/workflows/staging-site-path-diagnose-once.yml

permissions:
  contents: read

jobs:
  diagnose-site-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare SSH client
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Inspect aaPanel site files and local HTTP state
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_DOMAIN: ${{ secrets.STAGING_DOMAIN }}
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -p "$STAGING_PORT" \
            "$STAGING_USER@$STAGING_HOST" \
            "DOMAIN='$STAGING_DOMAIN' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          ROOT="/www/acdomains/$DOMAIN"
          PANEL=/www/server/panel
          PANEL_PY=/www/server/panel/pyenv/bin/python3

          echo '# aaPanel site path diagnostic'
          echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "domain=$DOMAIN"
          echo "current_target=$(readlink -f "$ROOT/current" 2>/dev/null || echo absent)"
          echo "document_root_exists=$([ -d "$ROOT/current/public" ] && echo yes || echo no)"
          echo "index_exists=$([ -f "$ROOT/current/public/index.php" ] && echo yes || echo no)"
          echo "htaccess_exists=$([ -f "$ROOT/current/public/.htaccess" ] && echo yes || echo no)"
          echo "user_ini_exists=$([ -f "$ROOT/current/public/.user.ini" ] && echo yes || echo no)"

          echo 'site_record_begin'
          cd "$PANEL"
          DOMAIN="$DOMAIN" "$PANEL_PY" - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, '/www/server/panel')
          sys.path.insert(0, '/www/server/panel/class')
          import public
          site = public.M('sites').where('name=?', (os.environ['DOMAIN'],)).find()
          if not site:
              print('site_record=absent')
          else:
              allowed = {key: site.get(key) for key in ('id', 'name', 'path', 'status', 'project_type') if key in site}
              print(json.dumps(allowed, sort_keys=True))
          PY
          echo 'site_record_end'

          echo 'matching_vhost_paths_begin'
          find /www/server/panel/vhost/openlitespeed -maxdepth 4 \
            \( -type f -o -type l \) \
            -print 2>/dev/null \
            | while read -r path; do
                if grep -Fq "$DOMAIN" "$path" 2>/dev/null || [[ "$(basename "$path")" == *"$DOMAIN"* ]]; then
                  printf '%s\n' "$path"
                fi
              done \
            | sort -u
          echo 'matching_vhost_paths_end'

          echo 'expected_paths_begin'
          for path in \
            "/www/server/panel/vhost/openlitespeed/$DOMAIN.conf" \
            "/www/server/panel/vhost/openlitespeed/detail/$DOMAIN.conf" \
            "/www/server/panel/vhost/openlitespeed/listen/80.conf" \
            "/usr/local/lsws/conf/httpd_config.conf"; do
            echo "path=$path exists=$([ -e "$path" ] && echo yes || echo no)"
            if [ -e "$path" ]; then
              stat -Lc 'mode=%a owner=%U group=%G type=%F' "$path"
            fi
          done
          echo 'expected_paths_end'

          echo 'ols_config_test_begin'
          set +e
          /usr/local/lsws/bin/openlitespeed -t >/root/freedom-bootstrap/site-ols-test.log 2>&1
          status=$?
          set -e
          echo "ols_config_status=$status"
          tail -n 80 /root/freedom-bootstrap/site-ols-test.log \
            | sed -E 's#https?://[^[:space:]]+#URL_REDACTED#g' \
            || true
          echo 'ols_config_test_end'

          echo "listener_80=$(ss -lntH '( sport = :80 )' | wc -l)"
          echo 'local_http_begin'
          for endpoint in /health/live /health/ready; do
            set +e
            body=$(curl --silent --show-error --max-time 15 \
              --header "Host: $DOMAIN" \
              --write-out '\nhttp_code=%{http_code}' \
              "http://127.0.0.1$endpoint" 2>&1)
            curl_status=$?
            set -e
            echo "endpoint=$endpoint curl_status=$curl_status"
            printf '%s\n' "$body"
          done
          echo 'local_http_end'
          REMOTE

      - name: Remove SSH material
        if: always()
        run: rm -rf "$HOME/.ssh"
