name: Staging Stack Progress

on:
  pull_request:
    paths:
      - .github/workflows/staging-stack-progress.yml

permissions:
  contents: read

jobs:
  progress:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare SSH client
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Read non-sensitive installation progress
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -p "$STAGING_PORT" "$STAGING_USER@$STAGING_HOST" \
            'set -eu
             echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
             echo "openlitespeed_binary=$([ -x /usr/local/lsws/bin/litespeed ] && echo present || echo absent)"
             echo "php84_binary=$([ -x /www/server/php/84/bin/php ] && echo present || echo absent)"
             echo "lsphp84_binary=$([ -x /usr/local/lsws/lsphp84/bin/lsphp ] && echo present || echo absent)"
             echo "installer_processes=$(pgrep -fc "install_soft|openlitespeed|php.sh|make|gcc|g\\+\\+" || true)"
             for log in /var/log/freedom-openlitespeed-install.log /var/log/freedom-php84-install.log /var/log/freedom-php84-ols-install.log; do
               key=$(basename "$log" | tr ".-" "__")
               if [ -f "$log" ]; then
                 echo "${key}_bytes=$(stat -c %s "$log")"
                 echo "${key}_mtime=$(stat -c %Y "$log")"
               else
                 echo "${key}=absent"
               fi
             done'

      - name: Remove SSH material
        if: always()
        run: rm -rf "$HOME/.ssh"
