name: Trigger SMS adapters once

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/trigger-sms-adapters-once.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'develop/v1.0.0-completion'
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop/v1.0.0-completion
          fetch-depth: 1

      - name: Apply reviewed SMS adapter package
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          awk "/<<'PAYLOAD'/{capture=1; next} /^[[:space:]]*PAYLOAD$/{capture=0} capture{sub(/^[[:space:]]*/, \"\"); print}" \
            .github/workflows/apply-sms-adapters-once.yml \
            | base64 -d > "$temp_dir/package.tar.gz"
          test -s "$temp_dir/package.tar.gz"
          gzip -t "$temp_dir/package.tar.gz"
          mkdir -p "$temp_dir/package"
          tar -xzf "$temp_dir/package.tar.gz" -C "$temp_dir/package"
          cp -a "$temp_dir/package/." .

          test -f app/Modules/Identity/Infrastructure/MelliPayamakSmsProvider.php
          test -f app/Modules/Identity/Infrastructure/KavenegarSmsProvider.php
          test -f tests/Unit/Modules/Identity/SmsProviderHttpContractTest.php
          find app/Modules/Identity resources/lang config tests/Unit/Modules/Identity -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .env.example \
            app/Modules/Identity \
            config/identity.php \
            docs/integration-contracts/2026-08-05-sms-providers.md \
            evidence/0.3.0/sms-provider-http-adapters.md \
            resources/lang/en/identity.php \
            resources/lang/fa/identity.php \
            tests/Unit/Modules/Identity/SmsProviderHttpContractTest.php
          git rm \
            .github/workflows/apply-sms-adapters-once.yml \
            .github/workflows/trigger-sms-adapters-once.yml
          git diff --cached --check
          git commit -m 'feat: add fake-tested SMS provider adapters'
          git push origin HEAD:develop/v1.0.0-completion
