name: Update OTP Documentation Once

on:
  pull_request:
    paths:
      - .github/workflows/update-otp-docs-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop/v1.0.0-completion
          fetch-depth: 1

      - name: Update canonical traceability and audit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          matrix_path = Path('docs/02-requirement-traceability-matrix.md')
          matrix = matrix_path.read_text()
          matrix = matrix.replace(
              'Implementation/test/evidence status: `in-progress` for the explicitly marked foundation rows; all evidence remains unverified until a recorded CI run exists.',
              'Implementation/test/evidence status: `in-progress` for explicitly marked foundation rows; retained CI and target evidence is cited below, while phase completion still requires every remaining gap to close.',
          )

          dat_row = '| `DAT-001`, `DAT-002`, `DAT-003`, `DAT-004` | `Money.php`; `Clock.php`; state enums; foundation migrations; unit/migration tests | Complete domain schema, retention services and production migration evidence |'
          additions = '''| `ONB-001`, `ONB-004`, `ONB-005`, `USR-001`, `SEC-003`, `DAT-003`, `INT-002` | Telegram identity/webhook services; `IranianMobileNumber`; verification policy/method enums; `TelegramContactVerifier`; `OtpChallengeIssuer`; `OtpChallengeVerifier`; HMAC phone/OTP hashers; atomic Redis limiter; fake/rate-limited SMS providers; phone/OTP migrations; contact/OTP/Redis tests; `evidence/0.3.0/identity-phone-contact-sms-foundation.md`; `evidence/0.3.0/otp-lifecycle-abuse-controls.md`; CI runs `30959686735`, `30961861886`; staging runs `30959844808`, `30960110251`, `30962042217` | Melli Payamak/Kavenegar HTTP adapters, identity-admin release/reverification policies and complete Phase application flows |
| `USR-002`, `USR-003`, `AGT-001`, `AGT-002`, `ACL-001`, `ACL-002`, `ACL-003`, `SEC-002` | identity/customer/agent/ACL migration; tier/role/permission seeders; account/tier/agent/approval enums; deny-precedence resolver; foundation migration/domain tests | Customer transition services, full agent lifecycle services, authorization policies, hardened Owner/approval flows and append-only audit coverage |'''
          if additions not in matrix:
              if dat_row not in matrix:
                  raise SystemExit('Traceability insertion anchor not found.')
              matrix = matrix.replace(dat_row, dat_row + '\n' + additions)

          requirement_ids = [
              'ONB-001', 'ONB-004', 'ONB-005',
              'USR-001', 'USR-002', 'USR-003',
              'AGT-001', 'AGT-002',
              'ACL-001', 'ACL-002', 'ACL-003',
              'SEC-002', 'SEC-003', 'DAT-003', 'INT-002',
              'QUA-001', 'QUA-011',
          ]
          for requirement_id in requirement_ids:
              pattern = re.compile(
                  rf'^(\| `{re.escape(requirement_id)}` \|.*\| )`(?:not-started|in-progress)`( \|)$',
                  re.MULTILINE,
              )
              matrix, count = pattern.subn(r'\1`in-progress`\2', matrix)
              if count != 1:
                  raise SystemExit(f'Expected one traceability row for {requirement_id}, found {count}.')

          matrix_path.write_text(matrix)

          audit_path = Path('docs/20-current-state-audit.md')
          audit = audit_path.read_text()
          old_identity = '''- Telegram account/customer synchronization with transaction and race handling;
- customer tiers, profiles, histories, tags and globally unique active phone-hash schema;
- OTP challenge schema;
- agent application/profile lifecycle schema and state enums;
- roles, permissions, multi-role assignments, per-admin tri-state override and deny-precedence resolver;
- sensitive-action approval schema and state machine;
- secure Telegram webhook secret validation, encrypted payload persistence, database deduplication/collision detection, asynchronous processing, stranded-update recovery and encrypted `/start` attribution;
- real staging Telegram webhook contract verified.'''
          new_identity = '''- Telegram account/customer synchronization with transaction and race handling;
- customer tiers, profiles, histories, tags and globally unique active phone-hash schema;
- Iranian mobile normalization with Persian/Arabic digits, encrypted canonical values and keyed searchable hashes;
- Telegram contact ownership verification, one-active-number constraints, policy/version evidence and number-change invalidation;
- HMAC-only OTP issue/verify/invalidate lifecycle with two-minute expiry, sixty-second cooldown and five-attempt lockout;
- idempotent OTP issuance and atomic Redis abuse controls by phone, Telegram account, IP and provider;
- safe SMS delivery taxonomy, fake providers and definitive-failure-only fallback semantics;
- agent application/profile lifecycle schema and state enums;
- roles, permissions, multi-role assignments, per-admin tri-state override and deny-precedence resolver;
- sensitive-action approval schema and state machine;
- secure Telegram webhook secret validation, encrypted payload persistence, database deduplication/collision detection, asynchronous processing, stranded-update recovery and encrypted `/start` attribution;
- real staging Telegram webhook, contact foundation and OTP lifecycle contracts verified.'''
          if old_identity not in audit:
              raise SystemExit('Audit identity section anchor not found.')
          audit = audit.replace(old_identity, new_identity)

          old_evidence = '''Telegram run `30958272387` passed secret rejection, valid ingestion, exact-duplicate idempotency, collision rejection, stranded-update recovery, one processing attempt, cleanup and final `pending_update_count=0`.'''
          new_evidence = '''Telegram run `30958272387` passed secret rejection, valid ingestion, exact-duplicate idempotency, collision rejection, stranded-update recovery, one processing attempt, cleanup and final `pending_update_count=0`.

Phone/contact application SHA `750bcdf994f864859d1a0a2c0e5fda476793bfc9` passed CI run `30959686735` with **129 tests, 619 assertions** and target runs `30959844808` / `30960110251`.

OTP application SHA `82363cda52c9df2ede7c548faae9f0c55a215b3c` passed CI run `30961861886` with **135 tests, 662 assertions** and staging run `30962042217`, including migration, A/B rollback, hash-at-rest, failed-attempt commit, successful consumption and Redis limiter smoke checks.'''
          if old_evidence not in audit:
              raise SystemExit('Audit evidence anchor not found.')
          audit = audit.replace(old_evidence, new_evidence)

          audit = re.sub(
              r'## Current exact work package\n\n.*\Z',
              '''## Current exact work package

Continue Phase `0.3.0` with:

1. Melli Payamak and Kavenegar adapters behind the existing `SmsProvider` contract;
2. fake HTTP contract tests for accepted, definitive rejection, rate limit, malformed response, transport timeout and ambiguous server outcomes;
3. configuration that keeps fake providers active and real adapters disabled until credentials are supplied;
4. customer state/tier/tag transition services with append-only audit;
5. agent claim/review/approve/reject/reapply/suspend/restore application services;
6. reusable authorization policies, multi-role resolution, hardened Owner behavior and sensitive-action approvals.

No owner action is required for the fake HTTP adapter package. Real SMS credentials remain just-in-time inputs for a later activation gate.
''',
              audit,
              flags=re.DOTALL,
          )
          audit_path.write_text(audit)
          PY

      - name: Commit documentation update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/02-requirement-traceability-matrix.md docs/20-current-state-audit.md
          git diff --cached --check
          git commit -m 'docs: align OTP traceability and audit'
          git push origin HEAD:develop/v1.0.0-completion
