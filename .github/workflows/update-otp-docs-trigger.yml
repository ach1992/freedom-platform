name: Run OTP Documentation Update

on:
  pull_request:

permissions:
  contents: write

jobs:
  update:
    runs-on: [self-hosted, Linux, X64, freedom-staging, php84]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop/v1.0.0-completion
          fetch-depth: 1
      - name: Update documentation
        run: python3 scripts/ci/update-otp-docs-once.py
      - name: Commit documentation and remove one-time updater
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/02-requirement-traceability-matrix.md docs/20-current-state-audit.md
          git rm \
            .github/workflows/update-otp-docs-once.yml \
            .github/workflows/update-otp-docs-trigger.yml \
            scripts/ci/update-otp-docs-once.py
          git diff --cached --check
          git commit -m 'docs: align OTP traceability and audit'
          git push origin HEAD:develop/v1.0.0-completion
