; Production template for Ubuntu/aaPanel. Run application workers as www.
; Critical financial and provisioning work is isolated from bulk work.
; Each process publishes a sidecar heartbeat independent of queue activity.

[program:freedom-platform-critical]
process_name=%(program_name)s_%(process_num)02d
command=/www/acdomains/hell.hellpservice.ir/current/deploy/bin/queue-worker-with-heartbeat.sh --queue=critical-payments,bank-verification,gift-card-verification --sleep=1 --tries=3 --backoff=5 --timeout=120 --max-time=3600
directory=/www/acdomains/hell.hellpservice.ir/current
user=www
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=180
redirect_stderr=true
stdout_logfile=/www/acdomains/hell.hellpservice.ir/shared/storage/logs/supervisor-critical.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production",WORKER_HEARTBEAT_ENABLED="true",WORKER_NAME="%(program_name)s_%(process_num)02d",WORKER_QUEUE_GROUP="critical-payments,bank-verification,gift-card-verification",WORKER_HEARTBEAT_INTERVAL_SECONDS="30",WORKER_HEARTBEAT_STALE_AFTER_SECONDS="480"

[program:freedom-platform-provisioning]
process_name=%(program_name)s_%(process_num)02d
command=/www/acdomains/hell.hellpservice.ir/current/deploy/bin/queue-worker-with-heartbeat.sh --queue=provisioning,telegram-ingress,telegram-delivery,synchronization,default --sleep=1 --tries=3 --backoff=5 --timeout=180 --max-time=3600
directory=/www/acdomains/hell.hellpservice.ir/current
user=www
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=240
redirect_stderr=true
stdout_logfile=/www/acdomains/hell.hellpservice.ir/shared/storage/logs/supervisor-provisioning.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production",WORKER_HEARTBEAT_ENABLED="true",WORKER_NAME="%(program_name)s_%(process_num)02d",WORKER_QUEUE_GROUP="provisioning,telegram-ingress,telegram-delivery,synchronization,default",WORKER_HEARTBEAT_INTERVAL_SECONDS="30",WORKER_HEARTBEAT_STALE_AFTER_SECONDS="480"

[program:freedom-platform-bulk]
process_name=%(program_name)s_%(process_num)02d
command=/www/acdomains/hell.hellpservice.ir/current/deploy/bin/queue-worker-with-heartbeat.sh --queue=broadcasts,reports,backups,maintenance --sleep=2 --tries=3 --backoff=10 --timeout=300 --max-time=3600
directory=/www/acdomains/hell.hellpservice.ir/current
user=www
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=360
redirect_stderr=true
stdout_logfile=/www/acdomains/hell.hellpservice.ir/shared/storage/logs/supervisor-bulk.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=APP_ENV="production",WORKER_HEARTBEAT_ENABLED="true",WORKER_NAME="%(program_name)s_%(process_num)02d",WORKER_QUEUE_GROUP="broadcasts,reports,backups,maintenance",WORKER_HEARTBEAT_INTERVAL_SECONDS="30",WORKER_HEARTBEAT_STALE_AFTER_SECONDS="480"

[group:freedom-platform-workers]
programs=freedom-platform-critical,freedom-platform-provisioning,freedom-platform-bulk
priority=999
